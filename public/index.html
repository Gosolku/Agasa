<script>

/* ---------- persistence: localStorage, in-memory fallback ---------- */
const _mem = {};
const store = {
  get(k, fb){ try{ const v = localStorage.getItem(k); return v==null?fb:JSON.parse(v); }
              catch(e){ return (k in _mem)?_mem[k]:fb; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){ _mem[k]=v; } }
};

/* ---------- tiny kotlin highlighter ---------- */
const KW = ["fun","val","var","class","object","interface","data","sealed","enum","abstract","override","open","init","constructor","companion","lateinit","by","lazy","if","else","when","for","while","return","in","is","as","null","true","false","this","super","private","public","protected","internal","it","break","continue"];
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function hl(src){
  let out="", i=0;
  while(i<src.length){
    const rest=src.slice(i); let m;
    if(m=rest.match(/^\/\/[^\n]*/)){ out+='<span class="com">'+esc(m[0])+'</span>'; i+=m[0].length; continue; }
    if(m=rest.match(/^"(?:\\.|[^"\\])*"/)){ out+='<span class="str">'+esc(m[0])+'</span>'; i+=m[0].length; continue; }
    if(m=rest.match(/^\b\d+(?:\.\d+)?\b/)){ out+='<span class="num">'+esc(m[0])+'</span>'; i+=m[0].length; continue; }
    if(m=rest.match(/^[A-Za-z_][A-Za-z0-9_]*/)){ const w=m[0];
      if(KW.includes(w)) out+='<span class="kw">'+w+'</span>';
      else if(src[i+w.length]==='(') out+='<span class="fn">'+w+'</span>';
      else out+=esc(w); i+=w.length; continue; }
    out+=esc(src[i]); i++;
  }
  return out;
}
const codecard=(name,code)=>`<div class="codecard"><div class="cc-bar"><div class="cc-dots"><i></i><i></i><i></i></div><span class="cc-name">${name}</span></div><pre class="code">${hl(code)}</pre></div>`;
const outblock=t=>`<div class="outblock"><div class="ob-h">Output</div><pre>${esc(t)}</pre></div>`;

/* ============================================================
   RECAP — "Kotlin, so far"  (true course order · verified times)
   Covered = 0h through Collections at 9h58m.
   ============================================================ */
const RECAP = [
 { g:"Foundations" },
 { id:"vars", num:"01", title:"Variables · val & var", time:"1h00m",
   def:`<code>val</code> makes a box you can read but not reassign; <code>var</code> makes one you can change. Reach for <code>val</code> by default and only switch to <code>var</code> when the value genuinely needs to change.`,
   code:`val name = "Gosol"   // fixed for good\nvar score = 0        // can change\nscore = score + 10\n// name = "Ali"      // error: val can't be reassigned`, out:null,
   ip:`When something shouldn't move — a date of birth, the number of quiz questions — make it <code>val</code>. If the compiler won't let you reassign it, that's the sign you actually needed a <code>var</code>, not a reason to fight it.` },
 { id:"types", num:"02", title:"Types & inference", time:"~1h10m",
   def:`Every value has a type — <code>Int</code>, <code>Double</code>, <code>String</code>, <code>Boolean</code>, <code>Char</code>. Kotlin usually <b>infers</b> it from the value, so you rarely write it, but you can state it after a colon when you want to be explicit or force a type.`,
   code:`val age = 16              // inferred Int\nval price: Double = 4.0    // stated\nval grade: Char = 'A'\nval passed = true          // inferred Boolean`, out:null,
   ip:`If a number needs decimals — money, an average, a measurement — make it a <code>Double</code>. A plain <code>Int</code> silently drops the fraction and hands you wrong totals.` },
 { id:"strings", num:"03", title:"String templates", time:"~1h40m",
   def:`Instead of gluing text with <code>+</code>, drop a value into a string with <code>$</code>, or a whole expression with <code>${'$'}{...}</code>. Cleaner and far harder to get wrong.`,
   code:`val name = "Gosol"\nval score = 9\nprintln("Hi $name, you scored $score")\nprintln("Next target: ${'$'}{score + 1}")`, out:`Hi Gosol, you scored 9\nNext target: 10`,
   ip:`Any time you build a message for the user — a greeting, a result line — use a template. The moment you catch yourself writing <code>"..." + thing + "..."</code>, switch to one.` },
 { g:"Control & data" },
 { id:"ifwhen", num:"04", title:"if / when as expressions", time:"2h36m",
   def:`In Kotlin <code>if</code> and <code>when</code> don't just run code — they <b>return a value</b>, so you can assign the result straight to a variable. <code>when</code> is the clean replacement for a long if/else chain.`,
   code:`val n = 7\nval label = if (n % 2 == 0) "even" else "odd"\n\nval size = when {\n    n < 10  -> "small"\n    n < 100 -> "medium"\n    else    -> "large"\n}\nprintln("$label, $size")`, out:`odd, small`,
   ip:`When you're picking one value out of several conditions — a grade from a mark, a label from a status — assign a <code>when</code> to a <code>val</code> instead of reassigning a <code>var</code> in each branch. One name, set once, no case forgotten.` },
 { id:"null", num:"05", title:"Nullability", time:"2h38m",
   def:`By default a variable can never hold <code>null</code>, which kills most crashes. Add <code>?</code> to the type to allow null. To use one safely: <code>?.</code> runs the call only if it isn't null; <code>?:</code> (Elvis) gives a fallback; <code>!!</code> forces it and <b>throws</b> if it was null.`,
   code:`var text: String? = null\n\nprintln(text?.length)        // null (no crash)\nprintln(text?.length ?: 0)   // 0 (Elvis fallback)\n// println(text!!.length)    // throws NullPointerException`, out:`null\n0`,
   ip:`When a value might be missing — a name not typed yet, a load that failed — mark it <code>?</code> and read it with <code>?.</code> plus an Elvis fallback. Keep <code>!!</code> for the rare case you're certain it's filled: it means "crash here if I'm wrong."` },
 { id:"funcs", num:"06", title:"Functions", time:"2h53m",
   def:`<code>fun</code> declares a function; parameters are <code>name: Type</code> and the return type follows <code>):</code>. A one-expression function can drop the braces and <code>return</code>. <b>Default parameters</b> let callers skip the common case.`,
   code:`fun greet(name: String): String {\n    return "Hi $name"\n}\nfun square(n: Int) = n * n          // single-expression\nfun power(n: Int, exp: Int = 2) = n // default arg\n\nprintln(greet("Gosol"))\nprintln(square(4))`, out:`Hi Gosol\n16`,
   ip:`The moment you write the same few lines twice, wrap them in a function and give it a clear name. Default parameters save every caller from passing the same usual value each time.` },
 { id:"loops", num:"07", title:"Loops", time:"3h49m",
   def:`<code>for</code> walks a range or collection; <code>while</code> repeats while a condition holds. Ranges use <code>..</code> (inclusive), <code>until</code> (stops one short), and <code>step</code> to skip.`,
   code:`for (i in 1..3) println(i)        // 1 2 3\nfor (i in 0 until 3) print(i)     // 012\nfor (c in "hi") print(c)          // hi\n\nvar n = 3\nwhile (n > 0){ print(n); n-- }    // 321`, out:`1\n2\n3\n012hi321`,
   ip:`Use <code>for</code> with <code>until</code> when walking positions in a list — 0 up to but not including its size — the shape that dodges the classic "one past the end" crash. Save <code>while</code> for when you don't know the count, like "keep asking until the input is valid."` },
 { id:"arrays", num:"08", title:"Arrays", time:"4h37m",
   def:`An array is a <b>fixed-size</b> row of one type, reached by index from <code>0</code>. You can read and overwrite slots but never grow or shrink it — for that you'll want a list (topic 26).`,
   code:`val nums = arrayOf(10, 20, 30)\nprintln(nums[0])       // 10\nnums[1] = 99           // overwrite slot 1\nprintln(nums.size)     // 3\nprintln(nums.joinToString())`, out:`10\n3\n10, 99, 30`,
   ip:`Reach for an array only when the count is truly fixed — the 12 months, the 7 days. The instant you think "I'll add more later," that's a list, not an array.` },
 { g:"Objects" },
 { id:"class", num:"09", title:"Classes & the primary constructor", time:"5h12m",
   def:`A class is a <b>blueprint</b> for objects. The primary constructor sits in the parentheses after the name; putting <code>val</code>/<code>var</code> there declares and fills the property in one line. You build an object by calling the class like a function.`,
   code:`class Car(val make: String, var speed: Int)\n\nval c = Car("Toyota", 0)\nc.speed = 60\nprintln("${'$'}{c.make} at ${'$'}{c.speed}")`, out:`Toyota at 60`,
   ip:`Whenever a few pieces of data belong together — a user's name and age, a question and its answer — make a class and put them in the constructor. It beats passing four loose variables everywhere.` },
 { id:"init", num:"10", title:"init blocks", time:"5h45m",
   def:`An <code>init { }</code> block runs automatically the moment an object is created, right after the constructor. It's where setup that needs more than a plain assignment goes — validation, a starting message, deriving one property from another.`,
   code:`class User(val name: String){\n    init {\n        println("Created user: $name")\n    }\n}\nval u = User("Gosol")`, out:`Created user: Gosol`,
   ip:`Put logic that must run every time an object is born — checking a value isn't empty, logging it — inside <code>init</code>. If it's just "store this value," the constructor already did it; <code>init</code> is for the extra step.` },
 { id:"secondary", num:"11", title:"Secondary constructors", time:"6h01m",
   def:`A secondary constructor is an <b>extra</b> way to build the same object, written with the <code>constructor</code> keyword. It delegates to the primary one with <code>: this(...)</code>, letting callers build with less information when a sensible default exists.`,
   code:`class User(val name: String, val age: Int){\n    constructor(name: String) : this(name, 0)\n}\nval a = User("Gosol", 16)\nval b = User("Ali")        // age defaults to 0\nprintln(b.age)`, out:`0`,
   ip:`Add one when there's a common shortcut for creating your object — "a user with just a name, age unknown yet." It spares every caller from remembering a placeholder value.` },
 { id:"getset", num:"12", title:"Getters & setters", time:"6h25m",
   def:`Every property quietly has a getter (read) and setter (write) that Kotlin generates. You can override them to add behaviour — compute on read, guard/clean on write — using <code>field</code> to refer to the real stored value.`,
   code:`class Person(name: String){\n    var name: String = name\n        set(value){ field = value.trim() }   // clean on write\n    val shout: String\n        get() = name.uppercase()             // compute on read\n}\nval p = Person("  Gosol  ")\np.name = "  Ali "\nprintln("[${'$'}{p.name}] ${'$'}{p.shout}")`, out:`[Ali] ALI`,
   ip:`Use a custom setter to keep bad data out at the door — trim spaces, reject negatives — so the rest of your code can trust the value. Use a custom getter for anything you'd rather calculate fresh than store, like a full name from first + last.` },
 { id:"lateinit", num:"13", title:"lateinit", time:"6h41m",
   def:`<code>lateinit var</code> promises the compiler you'll assign a non-null value <b>before</b> you use it, so you skip both <code>null</code> and an immediate value. Touching it early throws <b>UninitializedPropertyAccessException</b>.`,
   code:`class Screen {\n    lateinit var title: String\n    fun show(){ println(title) }\n}\nval s = Screen()\ns.title = "Home"   // set first\ns.show()           // then use`, out:`Home`,
   ip:`Use it when a value can't be ready at construction but definitely will be before anything reads it — a screen's title set during setup. If you're ever unsure it'll be filled in time, a nullable <code>String?</code> is safer.` },
 { id:"companion", num:"14", title:"Companion objects", time:"6h51m",
   def:`A <code>companion object</code> holds members that belong to the <b>class itself</b>, not to any one object — Kotlin's version of "static." You call them on the class name, and there's one per class. A common use is a factory function that builds an instance.`,
   code:`class User private constructor(val name: String){\n    companion object {\n        fun create(name: String) = User(name)\n    }\n}\nval u = User.create("Gosol")\nprintln(u.name)`, out:`Gosol`,
   ip:`Reach for a companion when something relates to the class as a whole, not one instance — a <code>create(...)</code> that assembles an object, or a shared label. You'll notice you're calling it on the type name, not a variable.` },
 { id:"singleton", num:"15", title:"Object declarations · singleton", time:"7h01m",
   def:`<code>object Name { }</code> creates a single, shared instance — exactly one exists for the whole program. Good for things there should only ever be one of. You access its members directly on the object's name.`,
   code:`object Settings {\n    var darkMode = true\n    fun toggle(){ darkMode = !darkMode }\n}\nSettings.toggle()\nprintln(Settings.darkMode)`, out:`false`,
   ip:`Use an <code>object</code> when there must only ever be one of something — one settings holder, one logger. Every part of your app that names it sees the exact same single instance.` },
 { id:"lazy", num:"16", title:"Lazy initialization", time:"7h13m",
   def:`<code>by lazy { }</code> delays creating a value until the first time it's actually read, then remembers it for every read after. Saves work when the value is expensive and might never be needed.`,
   code:`val config: String by lazy {\n    println("building...")\n    "loaded"\n}\nprintln("before")\nprintln(config)   // builds now\nprintln(config)   // reuses`, out:`before\nbuilding...\nloaded\nloaded`,
   ip:`Wrap a value in <code>by lazy</code> when it's costly to make and not always used — heavy setup only some screens need. It builds once, on first use, then hands back the same thing.` },
 { id:"enum", num:"17", title:"Enum classes", time:"7h18m",
   def:`An <code>enum class</code> is a fixed, named set of options — like constants, but type-safe and more powerful. Because the full list is known, a <code>when</code> over an enum can cover every case with compiler help.`,
   code:`enum class Direction { NORTH, SOUTH, EAST, WEST }\n\nval d = Direction.NORTH\nval turn = when (d){\n    Direction.NORTH -> "up"\n    Direction.SOUTH -> "down"\n    else            -> "sideways"\n}\nprintln(turn)`, out:`up`,
   ip:`Whenever a value can only be one of a small fixed set — a traffic light's colour, a card's suit, a status of not-started / learning / done — use an enum instead of loose strings. Typos become impossible and you can't invent an option that doesn't exist.` },
 { id:"inner", num:"18", title:"Inner classes", time:"7h33m",
   def:`A class declared inside another. Marking it <code>inner</code> lets it reach the outer class's properties; without <code>inner</code> it's merely nested and can't. Use sparingly.`,
   code:`class Outer {\n    private val msg = "hi"\n    inner class Inner {\n        fun show() = println(msg)   // reaches outer\n    }\n}\nOuter().Inner().show()`, out:`hi`,
   ip:`Use an <code>inner</code> class when a small helper only makes sense inside its parent and needs the parent's data. Most of the time, though, a plain top-level class is clearer — don't nest for the sake of it.` },
 { id:"inherit", num:"19", title:"Inheritance", time:"7h54m",
   def:`A class marked <code>open</code> can be extended with <code>: Parent()</code>, inheriting its properties and functions. The child replaces behaviour by marking a function <code>open</code> in the parent and <code>override</code> in the child.`,
   code:`open class Animal(val name: String){\n    open fun speak() = "..."\n}\nclass Dog(name: String) : Animal(name){\n    override fun speak() = "Woof"\n}\nprintln(Dog("Rex").speak())`, out:`Woof`,
   ip:`Use inheritance when things are genuinely a "kind of" the same thing and share real behaviour — a Dog is an Animal. If you only want to reuse a bit of code without that "is-a" link, that's a job for delegation (topic 25), not inheritance.` },
 { id:"sealed", num:"20", title:"Sealed classes", time:"8h27m",
   def:`A <code>sealed</code> class fixes its full set of subclasses at compile time, all in the same file. Because the compiler knows the complete list, a <code>when</code> over a sealed type is <b>exhaustive</b> — cover every case or it won't compile, no <code>else</code> needed.`,
   code:`sealed class Result\nclass Ok(val data: String) : Result()\nclass Err(val msg: String)  : Result()\n\nfun show(r: Result) = when (r){\n    is Ok  -> "Got ${'$'}{r.data}"\n    is Err -> "Failed: ${'$'}{r.msg}"\n}\nprintln(show(Ok("done")))`, out:`Got done`,
   ip:`Use a sealed class to model "one of a few known outcomes" — a call that either succeeded with data or failed with a message. The compiler then forces you to handle every outcome, so you can't ship a screen that forgets the error case.` },
 { id:"abstract", num:"21", title:"Abstract classes", time:"8h41m",
   def:`An <code>abstract class</code> can't be created on its own — it's a partial blueprint. It mixes concrete code with <code>abstract</code> members that subclasses <b>must</b> fill in. It sits between a plain open class and an interface.`,
   code:`abstract class Shape {\n    abstract fun area(): Double          // must override\n    fun describe() = "area = ${'$'}{area()}"  // shared\n}\nclass Circle(val r: Double) : Shape() {\n    override fun area() = 3.14 * r * r\n}\nprintln(Circle(2.0).describe())`, out:`area = 12.56`,
   ip:`Use an abstract class when several things share real code but each must supply one missing piece — every Shape can describe itself, but only a Circle knows its own area formula. If there's no shared code to hand down, an interface is the lighter choice.` },
 { id:"data", num:"22", title:"Data classes", time:"8h48m",
   def:`Add <code>data</code> before <code>class</code> and Kotlin generates the tedious parts: a readable <code>toString()</code>, content-based <code>==</code>, and <code>copy()</code> to duplicate with a tweak. Built for classes whose whole job is to hold data.`,
   code:`data class User(val name: String, val age: Int)\n\nval a = User("Gosol", 16)\nval b = a.copy(age = 17)     // same name, new age\nprintln(a)\nprintln(a == User("Gosol", 16))`, out:`User(name=Gosol, age=16)\ntrue`,
   ip:`Use a data class for the little "bags of fields" your app passes around — a quiz question, a chat message, a list row. You get printing, equality and copying free instead of hand-writing them each time.` },
 { id:"interface", num:"23", title:"Interfaces", time:"9h16m",
   def:`An interface is a <b>contract</b>: a list of functions a class promises to provide, usually with no code of its own. A class implements it by filling those functions in, and can implement <b>many</b> — how Kotlin shares behaviour without tangled inheritance.`,
   code:`interface Clickable {\n    fun onClick()\n}\nclass Button(val label: String) : Clickable {\n    override fun onClick() = println("$label clicked")\n}\nval b: Clickable = Button("Save")\nb.onClick()`, out:`Save clicked`,
   ip:`Think of it as "the button knows a click will happen, but you decide what happens." You'll meet this constantly in Android as a click listener: the screen says <i>something</i> runs on tap, and you supply that <i>something</i> by filling in the interface.` },
 { id:"objexpr", num:"24", title:"Object expressions · anonymous classes", time:"9h41m",
   def:`An <code>object : SomeType { }</code> created on the spot, with no class name — a one-off implementation. Common for supplying a quick listener or override where naming a whole class would be overkill.`,
   code:`interface Clickable { fun onClick() }\n\nval save = object : Clickable {\n    override fun onClick() = println("saved")\n}\nsave.onClick()`, out:`saved`,
   ip:`This is the pre-lambda way to attach behaviour on the spot — a one-time handler where a named class is overkill. You'll see it throughout older Android code before lambdas shortened it.` },
 { id:"delegation", num:"25", title:"Delegation", time:"9h50m",
   def:`The <code>by</code> keyword hands work off to another object. In <b>class delegation</b> a class implements an interface by forwarding every call to something that already does the job — reuse without inheriting. <b>Property delegation</b> (like <code>by lazy</code>) hands a property's get/set to a delegate.`,
   code:`interface Printer { fun print(msg: String) }\nclass Console : Printer {\n    override fun print(msg: String) = println("console: $msg")\n}\nclass Report(p: Printer) : Printer by p   // forwards to p\n\nReport(Console()).print("hello")`, out:`console: hello`,
   ip:`Use delegation to reuse an implementation without inheriting from it — wrap an object, forward the parts you don't change, override only what you do. It's the practical form of "favour composition over inheritance."` },
 { id:"collections", num:"26", title:"Collections · List, Set, Map", time:"9h58m",
   def:`The everyday containers: a <b>List</b> keeps order and allows duplicates; a <b>Set</b> keeps only unique values; a <b>Map</b> stores key → value for lookup. Each has a read-only form and a <code>mutable</code> form you can change.`,
   code:`val msgs = listOf("hi", "hi", "bye")   // order + dupes\nval tags = setOf("a", "a", "b")        // unique only\nval ages = mapOf("Gosol" to 16)        // key -> value\n\nprintln(msgs.size)       // 3\nprintln(tags)            // [a, b]\nprintln(ages["Gosol"])   // 16`, out:`3\n[a, b]\n16`,
   ip:`Picking the right one is half the job: a <b>List</b> for messages in a chat (order matters, repeats allowed), a <b>Set</b> the moment duplicates must vanish (unique tags), a <b>Map</b> to look something up by a key (a user by id).` },
 { g:"Collections in depth" },
 { id:"colops", num:"27", title:"List / Set / Map operations", time:"10h00m",
   def:`The read-only forms (<code>listOf</code>, <code>setOf</code>, <code>mapOf</code>) can't be changed; the <code>mutable</code> forms can <code>add</code>, <code>remove</code> and reassign. Reach into a list by index with <code>[ ]</code>; look up a map value by its key the same way. A <b>Set</b> silently drops duplicates, and a <b>Map</b> is a bag of <code>key to value</code> pairs.`,
   code:`val names = mutableListOf("Ann", "Bo", "Ann")\nnames.add("Cy"); names.removeAt(0)\n\nval tags = setOf("a", "a", "b")     // dupes gone\nval ages = mutableMapOf("Gosol" to 16)\nages["Ali"] = 20\n\nprintln(names)\nprintln(tags)\nprintln(ages["Gosol"])`, out:`[Bo, Ann, Cy]\n[a, b]\n16`,
   ip:`Pick <code>mutable</code> only when the contents genuinely change over the app's life — a growing list of chat messages. If a collection is built once and only read afterwards, the read-only form makes that promise visible and stops accidental edits.` },
 { id:"transform", num:"28", title:"map · filter · flatten", time:"10h15m",
   def:`These are the workhorses. <code>map</code> transforms every element into a new one; <code>filter</code> keeps only those matching a condition; <code>flatten</code> collapses a list-of-lists into one flat list. Each returns a <b>new</b> collection — the original is untouched.`,
   code:`val nums = listOf(1, 2, 3, 4)\nprintln(nums.map { it * it })        // squares\nprintln(nums.filter { it % 2 == 0 }) // evens\n\nval nested = listOf(listOf(1, 2), listOf(3))\nprintln(nested.flatten())`, out:`[1, 4, 9, 16]\n[2, 4]\n[1, 2, 3]`,
   ip:`Whenever you catch yourself writing a loop that builds a second list, a <code>map</code> or <code>filter</code> almost always says it in one clear line. Chain them — <code>list.filter { }.map { }</code> — to describe <i>what</i> you want rather than spelling out <i>how</i> to walk the list.` },
 { id:"colquery", num:"29", title:"filterIsInstance · partition · take / drop", time:"10h45m",
   def:`A family of query helpers: <code>filterIsInstance&lt;T&gt;()</code> keeps only elements of one type from a mixed list; <code>partition</code> splits into two lists by a condition; <code>take</code>/<code>drop</code> (and their <code>last</code>/<code>While</code> cousins) slice off the front or back; <code>chunked</code> and <code>windowed</code> cut a list into blocks.`,
   code:`val mixed = listOf(1, "hi", 2, true, "yo")\nprintln(mixed.filterIsInstance<String>())\n\nval (evens, odds) = listOf(1,2,3,4).partition { it % 2 == 0 }\nprintln(evens)\n\nprintln(listOf(1,2,3,4,5).take(2))\nprintln(listOf(1,2,3,4,5).chunked(2))`, out:`[hi, yo]\n[2, 4]\n[1, 2]\n[[1, 2], [3, 4], [5]]`,
   ip:`<code>partition</code> is the clean way to split "passed vs failed" in one pass instead of two filters. <code>chunked</code> shines when you need rows of a fixed width — three items per line in a grid.` },
 { id:"aggregate", num:"30", title:"Aggregates & sorting", time:"11h25m",
   def:`Numeric summaries come built in: <code>sum</code>, <code>average</code>, <code>count</code>, and the null-safe <code>minOrNull</code>/<code>maxOrNull</code> (they return <code>null</code> on an empty list rather than crashing). <code>sorted</code> orders ascending; <code>sortedBy { }</code> orders by a chosen field; <code>sortedByDescending</code> reverses it.`,
   code:`val nums = listOf(5, 1, 40, 20)\nprintln(nums.sum())        // 66\nprintln(nums.average())    // 16.5\nprintln(nums.maxOrNull())  // 40\nprintln(nums.sorted())`, out:`66\n16.5\n40\n[1, 5, 20, 40]`,
   ip:`Prefer <code>maxOrNull</code> over the older <code>max</code> so an empty list gives you a <code>null</code> to handle instead of an exception. To sort your own objects — laptops by price, users by age — reach straight for <code>sortedBy { it.price }</code> before writing any comparison by hand.` },
 { id:"comparable", num:"31", title:"Comparable & Comparator", time:"11h38m",
   def:`To let Kotlin sort <b>your own</b> class, either implement <code>Comparable</code> and define <code>compareTo</code> (the object's one natural order), or pass a <code>Comparator</code> at the call site for a one-off order. <code>compareTo</code> returns a negative number, zero, or a positive number — "am I less than, equal to, or greater than the other?" — and <code>sortedBy { }</code> builds a comparator for you behind the scenes.`,
   code:`data class Laptop(val name: String, val price: Int)\nval laptops = listOf(Laptop("Dell", 800), Laptop("HP", 500))\n\n// natural order via a comparator, no interface needed\nprintln(laptops.sortedBy { it.price }.map { it.name })\nprintln(laptops.sortedByDescending { it.price }.map { it.name })`, out:`[HP, Dell]\n[Dell, HP]`,
   ip:`Implement <code>Comparable</code> when a type has one obvious order it should always sort by. Use a <code>Comparator</code> (or just <code>sortedBy</code>) when the order depends on the moment — the same laptops sorted by price on one screen and by name on another.` },
 { id:"search", num:"32", title:"Search algorithms", time:"12h00m",
   def:`Two classics. <b>Linear search</b> walks every element until it finds the target — simple, works on any list, but slow on big data. <b>Binary search</b> needs a <b>sorted</b> list and halves the search range each step, so it finds an item in a handful of comparisons even in a huge list.`,
   code:`fun binarySearch(a: List<Int>, target: Int): Int {\n    var low = 0; var high = a.size - 1\n    while (low <= high) {\n        val mid = (low + high) / 2\n        when {\n            a[mid] < target -> low = mid + 1\n            a[mid] > target -> high = mid - 1\n            else -> return mid\n        }\n    }\n    return -1\n}\nprintln(binarySearch(listOf(1,3,5,7,9), 7))`, out:`3`,
   ip:`This is your first real taste of why <b>algorithm choice matters</b>: on a million sorted items, linear search may check a million times while binary search checks about twenty. When data is sorted and large, halving beats walking — the same instinct behind a lot of interview questions.` },
 { g:"Generics & safety" },
 { id:"generics", num:"33", title:"Generics", time:"12h15m",
   def:`A generic uses a type placeholder — usually <code>T</code> — so one class or function works for <b>any</b> type while staying type-safe. <code>class Box&lt;T&gt;(val item: T)</code> is a box of whatever you put in it, and the compiler remembers which type that was, so you keep autocomplete and catch mistakes.`,
   code:`class Team<T>(val name: String) {\n    val players = mutableListOf<T>()\n    fun add(p: T) { players.add(p) }\n}\nval footy = Team<String>("United")\nfooty.add("Rooney")\nprintln(footy.players)`, out:`[Rooney]`,
   ip:`You'll <i>use</i> generics constantly — <code>List&lt;String&gt;</code>, <code>MutableMap&lt;String, Int&gt;</code> are generics — long before you <i>write</i> your own. Writing one pays off when you have a container or helper whose logic is identical no matter the element type.` },
 { id:"bounds", num:"34", title:"Upper bounds", time:"12h37m",
   def:`An upper bound restricts what a generic type may be. <code>&lt;T : Player&gt;</code> means "T can be Player or any subclass," so inside the code you can safely call Player's members. Use <code>where</code> to demand more than one bound at once.`,
   code:`open class Player(val name: String)\nclass Footballer(name: String) : Player(name)\n\nfun <T : Player> announce(p: T) = "Signed: ${'$'}{p.name}"\n\nprintln(announce(Footballer("Kane")))\n// announce("hi")  // error: String isn't a Player`, out:`Signed: Kane`,
   ip:`Bound a generic when the code needs to <i>do</i> something with the value, not just store it — if you must read <code>.name</code>, constrain <code>T</code> to a type that has one. Without a bound, <code>T</code> could be anything and you'd be stuck.` },
 { id:"variance", num:"35", title:"Covariance & contravariance (in / out)", time:"12h50m",
   def:`These control whether a generic of a subtype counts as a generic of a supertype. <code>out T</code> makes it <b>covariant</b> — a producer that only hands values out, so <code>Box&lt;Cat&gt;</code> is usable where <code>Box&lt;Animal&gt;</code> is wanted. <code>in T</code> makes it <b>contravariant</b> — a consumer that only takes values in. The memory aid: <b>out = producer, in = consumer</b>.`,
   code:`open class Animal\nclass Cat : Animal()\n\n// 'out' → a Box<Cat> is accepted as a Box<Animal>\nclass Box<out T>(val item: T)\n\nfun show(b: Box<Animal>) = println(b.item != null)\nshow(Box(Cat()))   // allowed because of 'out'`, out:`true`,
   ip:`You'll meet this mostly as a compiler complaint ("type mismatch, out-projected..."). The fix is usually adding <code>out</code> when your class only <i>returns</i> the type, or <code>in</code> when it only <i>accepts</i> it. <code>List&lt;out T&gt;</code> is why a <code>List&lt;String&gt;</code> is happily a <code>List&lt;Any&gt;</code>.` },
 { id:"erasure", num:"36", title:"Type erasure & reified", time:"13h05m",
   def:`At runtime Kotlin <b>erases</b> generic types — a <code>List&lt;String&gt;</code> is just a <code>List</code>, the <code>String</code> part is gone. That's why you can't normally write <code>if (x is T)</code>. The escape hatch is an <code>inline fun</code> marked <code>reified</code>, which keeps the real type available so type checks work.`,
   code:`inline fun <reified T> filterType(list: List<Any>): List<T> {\n    return list.filter { it is T }.map { it as T }\n}\nval mixed = listOf(1, "hi", 2, "yo")\nprintln(filterType<String>(mixed))`, out:`[hi, yo]`,
   ip:`Remember the pairing: <code>reified</code> only works inside an <code>inline</code> function — the compiler needs to paste the code in at the call site to know the concrete type. It's what lets tidy helpers like <code>filterIsInstance&lt;T&gt;()</code> exist at all.` },
 { id:"visibility", num:"37", title:"Visibility modifiers", time:"13h17m",
   def:`These decide who can see a declaration. <code>public</code> (the default) is visible everywhere; <code>private</code> only inside its class or file; <code>protected</code> to the class and its subclasses; <code>internal</code> anywhere in the same module. Declaring something at the <b>top level</b> (outside any class) makes it a file-wide helper.`,
   code:`class BankAccount {\n    private var balance = 0        // hidden from outside\n    fun deposit(n: Int) { balance += n }\n    fun show() = "Balance: $balance"\n}\nval acc = BankAccount()\nacc.deposit(50)\nprintln(acc.show())\n// acc.balance = 999   // error: private`, out:`Balance: 50`,
   ip:`Make fields <code>private</code> by default and expose only the functions the outside world should call — that way nothing can put your object into a bad state directly. You already saw this with the companion-object factory, where the constructor was <code>private</code>.` },
 { id:"packages", num:"38", title:"Packages & imports", time:"13h35m",
   def:`A package is a named folder for related code — <code>com.example.classes</code>. Code in one package reaches code in another by <code>import</code>ing it. A trailing <code>*</code> imports everything in a package at once. Packages keep large projects organised and let you reuse code across files.`,
   code:`// file: com/example/model/User.kt\npackage com.example.model\nclass User(val name: String)\n\n// file: Main.kt\nimport com.example.model.User\n// import com.example.model.*   // whole package\n\nval u = User("Gosol")\nprintln(u.name)`, out:`Gosol`,
   ip:`Group code by what it does — models in one package, screens in another — so a stranger (or future you) can find things. In Android this becomes second nature: the project is already carved into packages for you.` },
 { id:"exceptions", num:"39", title:"Exceptions", time:"13h47m",
   def:`When something goes wrong at runtime an <b>exception</b> is thrown and, unhandled, it crashes the app. Wrap risky code in <code>try { } catch (e) { } finally { }</code>: <code>catch</code> runs on failure, <code>finally</code> runs either way (cleanup). Like <code>if</code>, a <code>try</code> is an expression — its last line can be assigned to a variable.`,
   code:`fun safeDivide(a: Int, b: Int): Int {\n    return try {\n        a / b\n    } catch (e: ArithmeticException) {\n        println("Can't divide by zero")\n        0\n    }\n}\nprintln(safeDivide(10, 2))\nprintln(safeDivide(10, 0))`, out:`5\nCan't divide by zero\n0`,
   ip:`Catch the <b>specific</b> exception you expect (like <code>NumberFormatException</code> around <code>toInt()</code>) rather than a blanket <code>Exception</code>, so real bugs still surface. Use <code>finally</code> for anything that must happen no matter what — closing a file or a database.` },
 { g:"Functions as values" },
 { id:"lambdas", num:"40", title:"Higher-order functions & lambdas", time:"13h55m",
   def:`A <b>lambda</b> is a block of code you can store in a variable and pass around: <code>{ a, b -> a + b }</code>. A <b>higher-order function</b> is one that takes or returns a function. When the function is the <b>last</b> parameter, you can move the lambda outside the parentheses — the trailing-lambda syntax you've seen everywhere in <code>filter { }</code>.`,
   code:`fun operate(a: Int, b: Int, op: (Int, Int) -> Int): Int {\n    return op(a, b)\n}\nval sum = { x: Int, y: Int -> x + y }\n\nprintln(operate(3, 4, sum))\nprintln(operate(3, 4) { x, y -> x * y })  // trailing lambda`, out:`7\n12`,
   ip:`This is the modern replacement for the object-expression listener from topics 23–24: instead of a whole anonymous class, you hand over a lambda. Every <code>setOnClickListener { ... }</code> in Android is exactly this — you're passing the code to run on tap.` },
 { id:"scopefns", num:"41", title:"Scope functions", time:"14h17m",
   def:`Five tidy helpers — <code>let</code>, <code>run</code>, <code>with</code>, <code>apply</code>, <code>also</code> — that run a block on an object. They differ in two ways: how the object is referred to inside (<code>it</code> vs <code>this</code>) and what the block returns (the object itself vs the block's last line). <code>apply</code> returns the object (great for setup); <code>let</code> returns the block's result (great for null-checks).`,
   code:`data class User(var name: String = "", var age: Int = 0)\n\nval u = User().apply {   // 'this', returns the User\n    name = "Gosol"\n    age = 16\n}\nprintln(u)\n\nval len = u.name.let { it.length }  // 'it', returns result\nprintln(len)`, out:`User(name=Gosol, age=16)\n5`,
   ip:`Reach for <code>apply</code> to configure a fresh object in one block, and <code>name?.let { ... }</code> to run code only when a nullable isn't null. Don't over-use them — if a plain few lines is clearer, keep the plain lines.` },
 { g:"Concurrency" },
 { id:"threads", num:"42", title:"Threads", time:"14h42m",
   def:`Code normally runs line by line on one <b>main thread</b>. A slow task (a network call, a big loop) on that thread freezes everything. A <b>thread</b> is a separate line of execution so work can happen "at the same time." But threads are heavy — make too many and the app runs out of memory and crashes, which is exactly the problem coroutines solve.`,
   code:`fun main() {\n    Thread {\n        Thread.sleep(500)\n        println("background done")\n    }.start()\n    println("main keeps going")\n}`, out:`main keeps going\nbackground done`,
   ip:`The lesson here is the <i>why</i>, not the API: heavy work must leave the main thread or the UI stutters, but raw threads don't scale. Hold that tension in mind — it's the setup for coroutines, the tool you'll actually use.` },
 { id:"coroutines", num:"43", title:"Coroutines · suspend, launch, async", time:"14h52m",
   def:`Coroutines do background work cheaply — thousands can run where threads would choke. A <code>suspend</code> function can pause (e.g. at <code>delay</code>) without blocking the thread, but can only be called from a coroutine. <code>launch</code> starts a coroutine that returns nothing; <code>async</code> returns a <code>Deferred</code> you <code>await</code> for a result. A <b>dispatcher</b> (<code>Dispatchers.IO</code>, <code>Main</code>) picks which thread it runs on.`,
   code:`import kotlinx.coroutines.*\n\nsuspend fun fetch(): String {\n    delay(200)          // suspends, doesn't block\n    return "data"\n}\nfun main() = runBlocking {\n    val job = async { fetch() }\n    println("waiting...")\n    println(job.await())\n}`, out:`waiting...\ndata`,
   ip:`Use <code>launch</code> for fire-and-forget work (save a note), <code>async</code> + <code>await</code> when you need the result back (fetch then display). In Android you'll launch from <code>viewModelScope</code> or <code>lifecycleScope</code> so the coroutine dies with the screen and can't leak.` },
 { id:"coroutinesctl", num:"44", title:"Coroutine control · scope, jobs, cancellation", time:"15h30m",
   def:`Coroutines live inside a <b>scope</b> bound to something (a screen), and <code>launch</code> hands back a <code>Job</code> you can <code>cancel</code>. A cancelled coroutine should check <code>isActive</code> and stop cleanly; a <code>withTimeout</code>/<code>withTimeoutOrNull</code> auto-cancels if work takes too long. A <code>CoroutineExceptionHandler</code> catches errors so one failing child doesn't take down the parent.`,
   code:`import kotlinx.coroutines.*\n\nfun main() = runBlocking {\n    val result = withTimeoutOrNull(300) {\n        delay(200); "finished"\n    }\n    println(result)          // finished\n    val slow = withTimeoutOrNull(100) {\n        delay(500); "finished"\n    }\n    println(slow)            // null — timed out\n}`, out:`finished\nnull`,
   ip:`Scope your coroutines to the screen's lifecycle so leaving the screen cancels them — otherwise they run on invisibly and can crash by touching dead UI. Use a timeout for anything that might hang, like a flaky network request.` },
 { g:"Data storage foundations" },
 { id:"sql", num:"45", title:"SQL & SQLite basics", time:"16h25m",
   def:`A relational database stores data in <b>tables</b> of rows and columns. SQL is the language to talk to it: <code>CREATE TABLE</code>, <code>INSERT</code>, <code>SELECT ... FROM</code>, <code>UPDATE ... WHERE</code>, <code>DELETE</code>. A <code>WHERE</code> clause targets specific rows (usually by a unique <code>id</code>), and a <code>JOIN</code> stitches two tables together on a shared key.`,
   code:`-- run in the sqlite3 shell\nCREATE TABLE books (id INTEGER, author TEXT, title TEXT);\nINSERT INTO books VALUES (1, 'Orwell', '1984');\nSELECT * FROM books WHERE id = 1;\nUPDATE books SET title = 'Animal Farm' WHERE id = 1;`, out:`1|Orwell|1984`,
   ip:`This is the mental model under every app database, including Room later: data lives in tables, you <code>SELECT</code> what you need and <code>WHERE</code> to pick rows. Learn to think in "which rows, which columns" and the Android storage libraries become far less mysterious.` },
 { g:"Android — first apps" },
 { id:"androidstudio", num:"46", title:"Android Studio & project anatomy", time:"16h50m", android:true,
   def:`Android Studio is the official IDE. A new project hands you a fixed skeleton: <b>an Activity</b> (a screen, in Kotlin), <b>a layout</b> (its appearance, in XML under <code>res/layout</code>), <b>resources</b> (<code>res/values</code> for strings, colors, themes), the <b>Manifest</b> (declares your app's screens and permissions), and <b>Gradle</b> files (dependencies and build settings). You test on an <b>emulator</b> — a virtual phone.`,
   code:`app/\n├─ manifests/AndroidManifest.xml   // screens + permissions\n├─ kotlin/  MainActivity.kt         // the code\n└─ res/\n   ├─ layout/  activity_main.xml     // the UI\n   ├─ values/  strings.xml, colors.xml\n   └─ drawable/                       // images`, out:null,
   ip:`Learn where each thing lives early — text goes in <code>strings.xml</code>, not hard-coded; look-and-feel in <code>layout</code>; permissions in the Manifest; libraries in Gradle. Fighting the structure is the single biggest early time-sink; working with it makes everything after feel orderly.` },
 { id:"xml", num:"47", title:"XML layouts & widgets", time:"17h00m", android:true,
   def:`A screen's appearance is described in an XML layout file as a tree of <b>views</b> (widgets): <code>TextView</code>, <code>Button</code>, <code>EditText</code>, <code>ImageView</code>, and so on. Two constants govern size: <code>match_parent</code> (fill the parent) and <code>wrap_content</code> (only as big as the content). Every widget gets an <code>android:id</code> so the Kotlin code can find it.`,
   code:`<!-- res/layout/activity_main.xml -->\n<Button\n    android:id="@+id/showButton"\n    android:layout_width="wrap_content"\n    android:layout_height="wrap_content"\n    android:text="@string/show" />`, out:null,
   ip:`Give every widget you'll touch from code a clear <code>id</code>, and pull user-facing text from <code>@string/...</code> rather than typing it inline — so translating or rewording the app is one edit, not fifty. The visual designer and the raw XML are two views of the same file; learn to read the XML.` },
 { id:"findview", num:"48", title:"Connecting code to views · R & findViewById", time:"17h30m", android:true,
   def:`<code>setContentView(R.layout.activity_main)</code> tells the Activity which layout to show. The generated <code>R</code> class holds an id for every resource, so <code>findViewById(R.id.showButton)</code> hands your code the actual widget object. From there you read it, change it, or attach a listener.`,
   code:`class MainActivity : AppCompatActivity() {\n    override fun onCreate(s: Bundle?) {\n        super.onCreate(s)\n        setContentView(R.layout.activity_main)\n        val btn = findViewById<Button>(R.id.showButton)\n        val txt = findViewById<TextView>(R.id.result)\n        btn.setOnClickListener {\n            txt.visibility = View.VISIBLE\n        }\n    }\n}`, out:null,
   ip:`<code>R</code> is the bridge between the XML world and the Kotlin world — an <code>id</code> in the layout becomes <code>R.id.thatId</code> in code. <code>findViewById</code> is the old, verbose way; later the course reaches View Binding, which gives you the views directly without the lookups (topic further down).` },
 { id:"widgets", num:"49", title:"Interactive widgets & listeners", time:"18h05m", android:true,
   def:`Input widgets report events through <b>listeners</b> — lambdas you attach. A <code>Button</code> fires <code>setOnClickListener</code>; an <code>EditText</code> gives text via <code>.text.toString()</code>; a <code>SeekBar</code> reports drags through <code>onProgressChanged</code>; <code>RadioButton</code>/<code>CheckBox</code> report their checked state. A <code>Toast</code> pops a short message.`,
   code:`val input = findViewById<EditText>(R.id.field)\nval btn = findViewById<Button>(R.id.convert)\n\nbtn.setOnClickListener {\n    val n = input.text.toString().toDoubleOrNull() ?: 0.0\n    val cm = n * 2.54\n    Toast.makeText(this, "$cm cm", Toast.LENGTH_SHORT).show()\n}`, out:null,
   ip:`Every listener is a higher-order function from the Kotlin half of the course — the click lambda is the same idea as passing code to <code>filter</code>. Always guard user text: <code>toDoubleOrNull() ?: 0.0</code> stops an empty or bad field from crashing the app.` },
 { id:"lifecycle", num:"50", title:"The Activity lifecycle", time:"19h55m", android:true,
   def:`Android drives each Activity through callbacks as it appears and disappears: <code>onCreate</code> (build the screen) → <code>onStart</code> → <code>onResume</code> (visible, interactive) → <code>onPause</code> → <code>onStop</code> → <code>onDestroy</code>. You override the ones you need. It matters because the system can pause or destroy your screen at any time — on a rotation or a phone call.`,
   code:`override fun onCreate(s: Bundle?) {\n    super.onCreate(s)\n    setContentView(R.layout.activity_main)\n    // set up views here — runs once\n}\noverride fun onPause() {\n    super.onPause()\n    // save unsaved work — screen leaving\n}`, out:null,
   ip:`Do one-time setup in <code>onCreate</code> and save anything you can't lose in <code>onPause</code>/<code>onStop</code>, because the system may kill the screen without warning. Rotating the phone destroys and recreates the Activity — that surprise is why state-saving and ViewModels exist.` },
 { id:"intents", num:"51", title:"Intents · moving between screens", time:"20h05m", android:true,
   def:`An <b>Intent</b> opens another Activity and can carry data with it via <code>putExtra</code>; the receiving screen reads it back with <code>getStringExtra</code> (and friends). To get a result <i>back</i>, the modern way is <code>registerForActivityResult</code> with a launcher, replacing the old <code>startActivityForResult</code>.`,
   code:`// screen A → screen B, with data\nval intent = Intent(this, SecondActivity::class.java)\nintent.putExtra("name", "Gosol")\nstartActivity(intent)\n\n// inside SecondActivity\nval name = intent.getStringExtra("name")`, out:null,
   ip:`Store the key in a <code>const val</code> shared between both screens so a typo can't silently break the hand-off. Match the getter to the type you put in — <code>putExtra</code> a <code>Double</code>, read it with <code>getDoubleExtra</code>, or you'll get a wrong or default value.` },
 { id:"quizapp", num:"52", title:"Project · Quiz app (putting it together)", time:"20h40m", android:true,
   def:`The first full app ties the basics together: a data class per <code>Question</code> (text, options, correct answer index), a list of them, and an Activity that shows one at a time, highlights the picked option, checks the answer, tracks a score, then passes the score by Intent to a result screen. No new concept — it's assembly.`,
   code:`data class Question(\n    val text: String,\n    val options: List<String>,\n    val answer: Int          // index of correct option\n)\nval questions = listOf(\n    Question("Capital of France?", listOf("Paris","Rome"), 0)\n)`, out:null,
   ip:`Notice how the Kotlin fundamentals resurface: a <b>data class</b> models a question, a <b>List</b> holds them, <code>when</code> maps a tap to a response, an <b>Intent</b> carries the score. When you build your own apps, this is the loop — model the data, list it, react to input, move to the next screen.` },
 { g:"Android — lists & structure" },
 { id:"recyclerview", num:"53", title:"RecyclerView & adapters", time:"22h45m", android:true,
   def:`A <b>RecyclerView</b> shows a scrolling list efficiently by recycling a few item views as you scroll rather than building one per row. You supply an <b>Adapter</b> (binds your data to each row via a <b>ViewHolder</b>), an <b>item layout</b> XML, and a <b>LayoutManager</b> (positions the rows). Row taps are handled inside the adapter using the clicked position.`,
   code:`class ItemAdapter(val items: List<String>) :\n    RecyclerView.Adapter<ItemAdapter.VH>() {\n\n    class VH(v: View) : RecyclerView.ViewHolder(v) {\n        val title: TextView = v.findViewById(R.id.title)\n    }\n    override fun getItemCount() = items.size\n    override fun onBindViewHolder(h: VH, pos: Int) {\n        h.title.text = items[pos]\n    }\n    // onCreateViewHolder inflates the row layout\n}`, out:null,
   ip:`This is <i>the</i> Android pattern you'll reuse endlessly — any chat, feed, or settings list is a RecyclerView. Understand the three parts (adapter binds, ViewHolder holds the row's views, LayoutManager positions) and most "show a list of things" tasks become routine.` },
 { id:"menusbars", num:"54", title:"Menus, toolbars & themes", time:"23h30m", android:true,
   def:`A <b>Toolbar</b> is the app's top bar; you set it as the Activity's action bar and give it a menu. The menu is an XML file of <code>&lt;item&gt;</code>s inflated in <code>onCreateOptionsMenu</code>, with taps handled in <code>onOptionsItemSelected</code>. <b>Themes</b> (in <code>res/values/themes.xml</code>) set app-wide colors and can hide the default bar so you supply your own.`,
   code:`override fun onCreateOptionsMenu(menu: Menu): Boolean {\n    menuInflater.inflate(R.menu.main_menu, menu)\n    return true\n}\noverride fun onOptionsItemSelected(item: MenuItem): Boolean {\n    return when (item.itemId) {\n        R.id.action_settings -> { openSettings(); true }\n        else -> super.onOptionsItemSelected(item)\n    }\n}`, out:null,
   ip:`Handle menu taps with a <code>when</code> over <code>item.itemId</code> — the same expression from the Kotlin half. Keep colors and bar styles in the theme so a rebrand is one file, echoing the "text in strings.xml" habit.` },
 { id:"layouts", num:"55", title:"Layout types · Linear, Relative, Constraint", time:"24h10m", android:true,
   def:`Layouts arrange child widgets. <b>LinearLayout</b> stacks them in a row or column (with optional <code>weight</code> to share space). <b>RelativeLayout</b> positions each relative to siblings or the parent. <b>ConstraintLayout</b> — the modern default — pins each edge with constraints, letting you build flat, flexible screens without deep nesting.`,
   code:`<!-- ConstraintLayout: center a button -->\n<Button\n    android:id="@+id/go"\n    android:layout_width="wrap_content"\n    android:layout_height="wrap_content"\n    app:layout_constraintTop_toTopOf="parent"\n    app:layout_constraintBottom_toBottomOf="parent"\n    app:layout_constraintStart_toStartOf="parent"\n    app:layout_constraintEnd_toEndOf="parent" />`, out:null,
   ip:`Prefer <b>ConstraintLayout</b> for real screens — deep nests of LinearLayouts are slow and fiddly. In a ConstraintLayout a widget with no constraints jumps to the top-left, so the habit is: constrain every edge you care about.` },
 { g:"Android — drawing & media" },
 { id:"canvas", num:"56", title:"Custom drawing · Canvas & Paint", time:"24h35m", android:true,
   def:`For anything beyond standard widgets — a drawing pad — you draw onto a <b>Canvas</b> backed by a <b>Bitmap</b>, using a <b>Paint</b> object that holds color, stroke width, and style. A custom View overrides <code>onDraw</code> to paint, and <code>onTouchEvent</code> to turn finger movement (<code>ACTION_DOWN</code>, <code>ACTION_MOVE</code>) into a <b>Path</b>.`,
   code:`class DrawView(c: Context) : View(c) {\n    private val paint = Paint().apply {\n        color = Color.BLACK\n        strokeWidth = 8f\n        style = Paint.Style.STROKE\n    }\n    private val path = Path()\n    override fun onDraw(canvas: Canvas) {\n        canvas.drawPath(path, paint)\n    }\n}`, out:null,
   ip:`Canvas is your escape hatch when no widget fits — games, charts, signature pads. The rhythm is always the same: a Paint says <i>how</i> to draw, a Path or shape says <i>what</i>, and <code>onDraw</code> puts it on screen; call <code>invalidate()</code> to trigger a redraw.` },
 { id:"permissions", num:"57", title:"Runtime permissions & saving files", time:"26h30m", android:true,
   def:`Sensitive abilities (storage, location, camera) need a permission declared in the Manifest <b>and</b> requested at runtime on modern Android. You check with <code>checkSelfPermission</code>, request via a launcher, and handle the user's yes/no. Once granted, you can save a bitmap to the device's Pictures directory.`,
   code:`val requestPermission = registerForActivityResult(\n    ActivityResultContracts.RequestPermission()\n) { granted ->\n    if (granted) saveImage() else showToast("Denied")\n}\n// ask when needed:\nrequestPermission.launch(Manifest.permission.WRITE_EXTERNAL_STORAGE)`, out:null,
   ip:`Declaring a permission in the Manifest isn't enough on new Android — you must ask at runtime and gracefully handle "no." Request it at the moment you need it (just before saving), not on launch, so the prompt makes sense to the user.` },
 { g:"Android — fragments & navigation" },
 { id:"fragments", num:"58", title:"Fragments", time:"27h25m", android:true,
   def:`A <b>Fragment</b> is a reusable slice of UI that lives inside an Activity — its own layout and lifecycle. One Activity can host many fragments and swap them with a <code>FragmentManager</code> transaction. Data passes in through an <code>arguments</code> <code>Bundle</code>; fragments talk back to their host through a <b>listener interface</b>.`,
   code:`class ProfileFragment : Fragment(R.layout.fragment_profile) {\n    override fun onViewCreated(v: View, s: Bundle?) {\n        val name = arguments?.getString("name")\n        v.findViewById<TextView>(R.id.name).text = name\n    }\n    companion object {\n        fun newInstance(name: String) = ProfileFragment().apply {\n            arguments = Bundle().apply { putString("name", name) }\n        }\n    }\n}`, out:null,
   ip:`Pass data via the <code>arguments</code> Bundle, not the constructor — Android recreates fragments on rotation and only the Bundle survives. The <code>newInstance</code> factory (a companion object from the Kotlin half) is the standard way to build one safely.` },
 { id:"drawersheets", num:"59", title:"Navigation drawer & bottom sheets", time:"27h25m", android:true,
   def:`A <b>navigation drawer</b> is the slide-in side menu built with <code>DrawerLayout</code> + <code>NavigationView</code>, its items defined in a menu XML and toggled by the toolbar's hamburger icon. A <b>bottom sheet</b> slides up from the bottom — modal (a dialog) or persistent — for secondary actions.`,
   code:`<androidx.drawerlayout.widget.DrawerLayout ...>\n    <!-- main content -->\n    <com.google.android.material.navigation.NavigationView\n        android:layout_gravity="start"\n        app:menu="@menu/drawer_menu" />\n</androidx.drawerlayout.widget.DrawerLayout>`, out:null,
   ip:`Drawers and bottom sheets are Material components — lean on the library rather than hand-rolling slide animations. Route the drawer's menu taps with a <code>when</code> just like the toolbar menu; the pattern is identical.` },
 { id:"navcomponent", num:"60", title:"Navigation Component & safe args", time:"33h15m", android:true,
   def:`The Navigation Component replaces manual fragment transactions with a visual <b>nav graph</b> (an XML map of screens and the <b>actions</b> between them). A single <code>NavController</code> moves between destinations, manages the back stack, and — with <b>Safe Args</b> — passes strongly-typed arguments so you can't send the wrong type.`,
   code:`// navigate along an action defined in the nav graph\nval nav = Navigation.findNavController(view)\nnav.navigate(R.id.action_main_to_detail)\n\n// with Safe Args (generated), typed and checked:\nval action = MainFragmentDirections.toDetail(amount = 50)\nnav.navigate(action)`, out:null,
   ip:`Prefer the nav graph over hand-written transactions once an app has more than a couple of screens — the back stack and animations come for free. Safe Args turns "pass a string named amount" into a compiler-checked function call, killing a whole class of typos.` },
 { g:"Android — persistence" },
 { id:"sharedprefs", num:"61", title:"SharedPreferences", time:"34h20m", android:true,
   def:`<b>SharedPreferences</b> stores small key–value data — a username, a "dark mode on" flag, a last-seen message — that survives the app being closed. You write with an editor and <code>apply()</code>, and read with a default fallback.`,
   code:`val prefs = getSharedPreferences("app", MODE_PRIVATE)\nprefs.edit().putString("message", "hi").apply()\n\nval saved = prefs.getString("message", "")   // "" if absent\nprintln(saved)`, out:null,
   ip:`Use SharedPreferences for <i>settings and small flags</i>, never for lists of records — that's a database's job (Room, next). Always pass a sensible default to the getter, since the key may not exist on first run.` },
 { id:"room", num:"62", title:"Room database", time:"34h35m", android:true,
   def:`<b>Room</b> is the recommended wrapper over SQLite: you write far less boilerplate and get compile-time-checked queries. Three pieces: an <code>@Entity</code> (a table, as a data class), a <code>@Dao</code> (an interface of query functions), and a <code>@Database</code> (ties them together and hands you the DAO). Room generates the SQL plumbing for you.`,
   code:`@Entity\ndata class Note(\n    @PrimaryKey(autoGenerate = true) val id: Int = 0,\n    val title: String\n)\n@Dao\ninterface NoteDao {\n    @Insert suspend fun insert(note: Note)\n    @Query("SELECT * FROM Note") fun getAll(): List<Note>\n}`, out:null,
   ip:`Compare this to the raw SQLite topic earlier — Room is the same tables and <code>SELECT</code>s, minus the error-prone cursor code. Its query strings are checked at build time, so a typo in a column name fails to compile instead of crashing users.` },
 { id:"mvvm", num:"63", title:"MVVM · ViewModel, LiveData, repository", time:"35h25m", android:true,
   def:`<b>MVVM</b> organises an app into layers. The <b>ViewModel</b> holds screen state and survives rotation; it exposes data as <b>LiveData</b> (or Flow) the UI <i>observes</i> and reacts to; a <b>repository</b> is the single source that decides where data comes from (Room, network). The UI never talks to the database directly.`,
   code:`class NoteViewModel(private val repo: NoteRepository) : ViewModel() {\n    val notes: LiveData<List<Note>> = repo.allNotes\n    fun add(note: Note) = viewModelScope.launch {\n        repo.insert(note)\n    }\n}\n// in the fragment:\nviewModel.notes.observe(viewLifecycleOwner) { list -> adapter.submit(list) }`, out:null,
   ip:`This is the architecture your own apps should aim for: screen observes ViewModel, ViewModel asks repository, repository owns the data. It's why the ViewModel survives rotation (state kept) and why a coroutine launched from <code>viewModelScope</code> is automatically cancelled when the screen dies.` },
 { id:"listadapter", num:"64", title:"ListAdapter, DiffUtil & swipe", time:"36h50m", android:true,
   def:`<b>ListAdapter</b> is a smarter RecyclerView adapter: give it a new list with <code>submitList</code> and <b>DiffUtil</b> computes the minimal changes, animating only what moved — no more redrawing everything with <code>notifyDataSetChanged</code>. <b>ItemTouchHelper</b> adds swipe-to-delete and drag gestures.`,
   code:`class NoteAdapter : ListAdapter<Note, NoteAdapter.VH>(DIFF) {\n    companion object {\n        val DIFF = object : DiffUtil.ItemCallback<Note>() {\n            override fun areItemsTheSame(a: Note, b: Note) = a.id == b.id\n            override fun areContentsTheSame(a: Note, b: Note) = a == b\n        }\n    }\n}`, out:null,
   ip:`Once your list is backed by LiveData, pair it with ListAdapter so updates animate smoothly and efficiently. <code>areContentsTheSame</code> leans on data-class equality (from the Kotlin half) — another reason your list items should be <code>data class</code>es.` },
 { g:"Android — data formats & networking" },
 { id:"json", num:"65", title:"JSON & Gson", time:"37h35m", android:true,
   def:`APIs speak <b>JSON</b> — text of <code>{"key": value}</code> objects and <code>[ ]</code> arrays. <b>Gson</b> converts between JSON and Kotlin objects: <code>toJson</code> serialises an object to a string, <code>fromJson</code> parses a string back into a typed object. <code>@Expose</code> plus <code>excludeFieldsWithoutExposeAnnotation</code> controls which fields are included.`,
   code:`data class User(val name: String, val age: Int)\n\nval gson = Gson()\nval json = gson.toJson(User("Gosol", 16))\nprintln(json)\n\nval back = gson.fromJson(json, User::class.java)\nprintln(back.name)`, out:`{"name":"Gosol","age":16}\nGosol`,
   ip:`Model each JSON shape as a Kotlin data class whose field names match the keys, and let Gson do the mapping — hand-parsing JSON is a bug factory. For a list, parse into <code>Array&lt;User&gt;</code> or a typed list. This is the glue for every networked app.` },
 { id:"retrofit", num:"66", title:"Retrofit · REST APIs", time:"38h25m", android:true,
   def:`<b>Retrofit</b> turns a REST API into a Kotlin interface. You annotate functions with <code>@GET</code>, <code>@POST</code>, <code>@PUT</code>, <code>@DELETE</code>, add <code>@Path</code>/<code>@Query</code>/<code>@Body</code> for parameters, and Retrofit (with a Gson converter) handles the network call and JSON parsing, returning your typed objects.`,
   code:`interface Api {\n    @GET("posts")\n    suspend fun getPosts(): List<Post>\n\n    @GET("posts/{id}/comments")\n    suspend fun comments(@Path("id") id: Int): List<Comment>\n}\nval api = Retrofit.Builder()\n    .baseUrl("https://example.com/")\n    .addConverterFactory(GsonConverterFactory.create())\n    .build().create(Api::class.java)`, out:null,
   ip:`Declare <i>what</i> the endpoints are and let Retrofit do the plumbing — you rarely touch raw HTTP. Make the functions <code>suspend</code> and call them from a coroutine so the network work stays off the main thread, tying the coroutines topic straight into real use.` },
 { id:"location", num:"67", title:"Location & the Weather app", time:"39h40m", android:true,
   def:`The <b>FusedLocationProviderClient</b> gives the device's location after you request the fine/coarse location permission at runtime. Feed the latitude and longitude to a weather API through Retrofit, model the JSON response as data classes, and display it — a complete "permission → location → network → UI" pipeline.`,
   code:`val client = LocationServices.getFusedLocationProviderClient(this)\nclient.lastLocation.addOnSuccessListener { loc ->\n    if (loc != null) {\n        val lat = loc.latitude\n        val lon = loc.longitude\n        fetchWeather(lat, lon)   // Retrofit call\n    }\n}`, out:null,
   ip:`This app is the first that chains everything: runtime permission, an async system service, a Retrofit call on a coroutine, JSON into data classes, then onto the screen. When you build something real, this is the spine — each earlier topic is one vertebra.` },
 { g:"Android — binding & Firebase" },
 { id:"binding", num:"68", title:"View Binding & Data Binding", time:"41h00m", android:true,
   def:`<b>View Binding</b> generates a binding class per layout so you reach views as <code>binding.myButton</code> — type-safe, null-safe, and no <code>findViewById</code>. <b>Data Binding</b> goes further, letting the XML reference data directly. Both are switched on in the module's Gradle file.`,
   code:`class MainActivity : AppCompatActivity() {\n    private lateinit var binding: ActivityMainBinding\n    override fun onCreate(s: Bundle?) {\n        super.onCreate(s)\n        binding = ActivityMainBinding.inflate(layoutInflater)\n        setContentView(binding.root)\n        binding.showButton.setOnClickListener { /* ... */ }\n    }\n}`, out:null,
   ip:`Prefer View Binding over <code>findViewById</code> in every new screen — it removes the casts and the null-view crashes when an id is mistyped. Notice <code>lateinit</code> from the Kotlin half doing exactly its job: the binding is set in <code>onCreate</code>, before anything reads it.` },
 { id:"firebaseauth", num:"69", title:"Firebase Authentication", time:"41h35m", android:true,
   def:`<b>Firebase Auth</b> handles sign-up and sign-in without you running a server. <code>createUserWithEmailAndPassword</code> registers a user; <code>signInWithEmailAndPassword</code> logs them in; both are async and report success or failure in a listener. <code>currentUser</code> tells you who (if anyone) is signed in.`,
   code:`val auth = FirebaseAuth.getInstance()\nauth.createUserWithEmailAndPassword(email, password)\n    .addOnCompleteListener { task ->\n        if (task.isSuccessful) goToHome()\n        else showToast("Sign-up failed")\n    }`, out:null,
   ip:`Auth is asynchronous — don't read <code>currentUser</code> right after calling sign-in; wait for the listener, or you'll hit a null user mid-creation. Check <code>currentUser</code> on launch to skip the login screen for someone already signed in.` },
 { id:"firestore", num:"70", title:"Cloud Firestore", time:"43h10m", android:true,
   def:`<b>Firestore</b> is a cloud NoSQL database of <b>collections</b> holding <b>documents</b> (each a bag of fields). You <code>set</code>/<code>add</code> to write, <code>get</code> to read once, and — the powerful part — attach a <b>snapshot listener</b> that pushes live updates whenever the data changes. Queries filter with <code>whereEqualTo</code>, <code>whereGreaterThan</code>, and ordering.`,
   code:`val db = FirebaseFirestore.getInstance()\ndb.collection("notes").add(mapOf("title" to "hi", "priority" to 2))\n\ndb.collection("notes")\n    .whereGreaterThanOrEqualTo("priority", 2)\n    .addSnapshotListener { snap, error ->\n        if (error != null) return@addSnapshotListener\n        // snap updates automatically on every change\n    }`, out:null,
   ip:`Reach for a snapshot listener when the screen should reflect data <i>live</i> (a chat, a shared list) — it's Firestore's superpower over a one-off <code>get</code>. Remember Firestore has no <code>OR</code> across different fields, so design queries around <code>AND</code>/ranges.` },
 { id:"firebasechat", num:"71", title:"Project · Firebase chat app", time:"43h55m", android:true,
   def:`A full messaging app combining the Firebase pieces: <b>Auth</b> for accounts, <b>Storage</b> for uploaded profile/photo images (via a file <code>Uri</code>), and <b>Firestore</b> for messages ordered by timestamp with a live snapshot listener. A RecyclerView shows sent vs received bubbles using multiple <b>view types</b>, and images load with Picasso.`,
   code:`// two row layouts by view type\noverride fun getItemViewType(pos: Int): Int =\n    if (messages[pos].senderId == myId) SENT else RECEIVED\n\n// keep the list pinned to the newest message\nrecyclerView.scrollToPosition(messages.size - 1)`, out:null,
   ip:`This project shows how the cloud pieces snap together: Auth says who you are, Firestore streams the conversation live, Storage holds the images. The multi-view-type adapter (sent vs received) is a pattern you'll reuse for any list with more than one kind of row.` },
 { g:"Android — Jetpack Compose" },
 { id:"compose", num:"72", title:"Jetpack Compose · composables", time:"44h45m", android:true,
   def:`<b>Compose</b> is the modern, declarative UI toolkit — you build screens in Kotlin, not XML. A UI piece is a <code>@Composable</code> function; you <i>describe</i> what the screen should look like for the current data and Compose redraws when that data changes. <code>Column</code>, <code>Row</code>, and <code>Box</code> arrange children; <code>Text</code>, <code>Button</code>, <code>Image</code> render them.`,
   code:`@Composable\nfun Greeting(name: String) {\n    Column {\n        Text("Hello, $name")\n        Button(onClick = { /* ... */ }) {\n            Text("Tap me")\n        }\n    }\n}`, out:null,
   ip:`Compose replaces the whole "XML + findViewById + adapter" stack with plain Kotlin functions — far less code for the same screen. This is where Android is heading, so it's worth real attention; the language fundamentals you already have carry straight over.` },
 { id:"modifiers", num:"73", title:"Modifiers & arrangement", time:"44h55m", android:true,
   def:`A <b>Modifier</b> is a chain that decorates a composable — size, padding, background, border, click. Order matters: <code>padding().background()</code> differs from <code>background().padding()</code>. Inside a <code>Column</code>/<code>Row</code>, <code>Arrangement</code> spaces children along the main axis and <code>Alignment</code> positions them on the cross axis.`,
   code:`@Composable\nfun Card() {\n    Column(\n        modifier = Modifier\n            .fillMaxWidth()\n            .padding(16.dp)\n            .background(Color.LightGray),\n        verticalArrangement = Arrangement.SpaceEvenly\n    ) {\n        Text("Title")\n        Spacer(Modifier.height(8.dp))\n        Text("Body")\n    }\n}`, out:null,
   ip:`Think of modifiers as a pipeline read top-to-bottom — reorder them and the look changes. <code>Arrangement</code> (main axis) vs <code>Alignment</code> (cross axis) is the pair to internalise; almost every layout question in Compose is really "which arrangement, which alignment."` },
 { id:"state", num:"74", title:"State & state hoisting", time:"46h00m", android:true,
   def:`Compose redraws when <b>state</b> changes. A <code>remember { mutableStateOf(...) }</code> holds a value across redraws; reading it in a composable makes that composable recompose when it changes. <b>Hoisting</b> means lifting state up to a parent and passing the value down plus an event up — so children stay reusable and stateless.`,
   code:`@Composable\nfun Counter() {\n    var count by remember { mutableStateOf(0) }\n    Column {\n        Text("Count: $count")\n        Button(onClick = { count++ }) { Text("+1") }\n    }\n}`, out:null,
   ip:`State hoisting is the core Compose skill: a child receives <code>value</code> and reports changes through an <code>onValueChange</code> lambda, while the real state lives above it. It keeps composables testable and reusable — the Compose echo of MVVM's "UI observes, doesn't own."` },
 { id:"composelists", num:"75", title:"Scaffold, LazyColumn & TextField", time:"46h15m", android:true,
   def:`<b>Scaffold</b> lays out the standard app skeleton (top bar, bottom bar, content). <b>LazyColumn</b> is Compose's RecyclerView — it composes only the visible rows, so long lists stay fast. <b>TextField</b> is the Compose input, its value driven by state.`,
   code:`@Composable\nfun Notes(items: List<String>) {\n    Scaffold(topBar = { TopAppBar(title = { Text("Notes") }) }) { pad ->\n        LazyColumn(Modifier.padding(pad)) {\n            items(items) { note -> Text(note, Modifier.padding(8.dp)) }\n        }\n    }\n}`, out:null,
   ip:`A whole scrolling list is now a <code>LazyColumn { items(list) { ... } }</code> — no adapter, no ViewHolder, just a lambda per row. That collapse from ~40 lines of RecyclerView to a few is the clearest argument for Compose.` },
 { id:"composenav", num:"76", title:"Navigation in Compose", time:"46h35m", android:true,
   def:`Compose navigation uses a <code>NavController</code> and a <code>NavHost</code> that maps <b>routes</b> (strings) to composable screens. You move with <code>navController.navigate("route")</code> and pass arguments inside the route path, read from the back-stack entry.`,
   code:`val nav = rememberNavController()\nNavHost(nav, startDestination = "home") {\n    composable("home") { HomeScreen(nav) }\n    composable("detail/{name}") { entry ->\n        DetailScreen(entry.arguments?.getString("name"))\n    }\n}\n// navigate: nav.navigate("detail/Gosol")`, out:null,
   ip:`Routes are just strings, so keep them in constants to avoid typos, and encode arguments in the path (<code>detail/{name}</code>). It's the same back-stack idea as the XML Navigation Component, expressed in Kotlin instead of a graph file.` },
 { g:"Android — the Uber clone (capstone)" },
 { id:"uberoverview", num:"77", title:"Capstone · Uber clone overview", time:"48h30m", android:true,
   def:`The final project is <b>two apps</b> — a driver app and a rider app — sharing a Firebase backend. It pulls in everything: Auth and a splash screen, Google Maps, live driver locations via GeoFire, marker animation, Places autocomplete, the Directions API for routes, RxJava for streams, and FCM push notifications for trip requests. It's less "new concepts," more "large-scale assembly."`,
   code:`// two apps, one backend\n//   Driver app  → publishes its live location\n//   Rider app   → finds nearby drivers, requests a trip\n// Shared: Firebase Auth · Realtime DB / Firestore · FCM`, out:null,
   ip:`Don't expect fresh fundamentals here — expect to see the earlier topics working <i>together</i> under real complexity. When you reach it, read it as a map of how a production app is wired, not as a list of things to memorise. This is your Phase-1 "Build" target made concrete.` },
 { id:"maps", num:"78", title:"Google Maps & markers", time:"48h50m", android:true,
   def:`The Maps SDK shows an interactive map inside a fragment (needs an API key in the Manifest). You get a <code>GoogleMap</code> in a ready callback, move the camera with <code>moveCamera</code>, drop <b>markers</b> at coordinates, and style them with custom icons. Marker positions can be animated smoothly between points.`,
   code:`mapFragment.getMapAsync { map ->\n    val sydney = LatLng(-33.87, 151.21)\n    map.addMarker(MarkerOptions().position(sydney).title("Here"))\n    map.moveCamera(CameraUpdateFactory.newLatLngZoom(sydney, 15f))\n}`, out:null,
   ip:`Everything map-related waits for the <code>getMapAsync</code> callback — the map object isn't ready before it, a common early crash. A car sliding along the road is just a marker whose position is animated frame by frame between GPS points.` },
 { id:"geofire", num:"79", title:"GeoFire · realtime locations & RxJava", time:"49h15m", android:true,
   def:`<b>GeoFire</b> stores locations in Firebase and answers "who is within X km of here?" with live callbacks as drivers move in and out of range. The clone streams these with <b>RxJava</b> (<code>Observable</code>s, subscriptions on background/main schedulers) to react to a flow of location events over time.`,
   code:`val geoFire = GeoFire(FirebaseDatabase.getInstance().getReference("drivers"))\ngeoFire.setLocation(driverId, GeoLocation(lat, lon))\n\nval query = geoFire.queryAtLocation(GeoLocation(lat, lon), 5.0) // 5 km\nquery.addGeoQueryEventListener(/* onKeyEntered / onKeyExited ... */)`, out:null,
   ip:`GeoFire answers the "nearby" question you'd otherwise need painful math for. RxJava here is an alternative to coroutines for streams of events — you don't need to master it, but recognise the shape: subscribe to a stream, react to each emission, dispose when done.` },
 { id:"placesroutes", num:"80", title:"Places, Directions & notifications", time:"53h45m", android:true,
   def:`The trip flow uses <b>Places Autocomplete</b> to pick an address, the <b>Directions API</b> to fetch a route (decoded into a <b>polyline</b> drawn on the map), and <b>FCM</b> (Firebase Cloud Messaging) push notifications to send a ride request to a driver and handle accept/decline — even when the app is backgrounded.`,
   code:`// draw the route returned by the Directions API\nval points = PolyUtil.decode(encodedPolyline)\nmap.addPolyline(PolylineOptions().addAll(points).color(Color.BLACK))\n\n// FCM: a service receives pushes\nclass MyFcmService : FirebaseMessagingService() {\n    override fun onMessageReceived(msg: RemoteMessage) { showRequest(msg) }\n}`, out:null,
   ip:`This is the piece that makes it feel like a real product: search a place, see the route drawn, and get a live push to the other app. FCM is how apps notify a user when nothing is on screen — the mechanism behind almost every notification you receive.` },

];

const BEYOND_NOW = [
 { k:"== vs ===", d:`<code>==</code> compares by <b>content</b> (it calls <code>equals</code>) — the right choice for comparing text and values. <code>===</code> checks whether two names point at the exact <b>same object</b>. Reach for <code>==</code> almost always; <code>===</code> is the rare identity check.` },
 { k:"Integer division", d:`Dividing two <code>Int</code>s <b>truncates</b>: <code>5 / 2</code> is <code>2</code>, not <code>2.5</code>. If you want the fraction, at least one side must be a <code>Double</code> — <code>5.0 / 2</code>. A classic silent-bug source.` },
 { k:"val is shallow", d:`<code>val</code> only stops you <b>reassigning</b> the variable — it doesn't freeze the contents. A <code>val</code> holding a mutable list can still have items added; you just can't point the name at a different list.` },
 { k:"readLine()", d:`Reads a line the user types in the console and returns a <b>nullable</b> <code>String?</code> (input could be absent). Convert it with <code>?.toInt()</code> when you need a number. Handy for quick console programs.` }
];

 { k:"const val", time:"~ not taught explicitly", d:`A true compile-time constant — <code>const val PI = 3.14</code> — versus a normal <code>val</code> that's set while the app runs.`, note:`Still worth knowing: the instructor flags "constants" near the companion-object lesson (~6h51m) but never drills the const keyword itself. In Android you'll use plain constants for Intent extra keys (topic 51).`, resolved:false },
 { k:"Generics", time:"topic 33 · 12h15m", d:`Writing code that works for any type — <code>List&lt;T&gt;</code> — plus upper bounds, variance and reified.`, note:`Now a full topic (33–36).`, resolved:true },
 { k:"Visibility modifiers", time:"topic 37 · 13h17m", d:`<code>public</code> (default), <code>private</code>, <code>protected</code>, <code>internal</code> — controlling what other code can see.`, note:`Now a full topic.`, resolved:true },
