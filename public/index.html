<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>Agasa</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='%23ffffff'/%3E%3C/svg%3E" />

<style>
  /* The page's black lives on the root only. A background on body as well
     would paint over anything sitting at a negative z-index — which is
     exactly where the eye is. */
  html {
    height: 100%;
    background: #000000;
  }

  body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    color: #ffffff;
    font-family: ui-sans-serif, system-ui, sans-serif;
  }

  /* The eye is the page's ground, so it sits behind everything and takes
     no pointer events; anything built on top just stacks above it. */
  .backdrop {
    position: fixed;
    inset: 0;
    z-index: -1;
    display: block;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
</style>
</head>
<body>

<canvas class="backdrop" id="backdrop" aria-hidden="true"></canvas>

<script type="module">
  import { createEvilEye } from '/js/evil-eye.js';

  createEvilEye(document.getElementById('backdrop'), {
    eyeColor: '#ffffff',
    intensity: 1.1,
    pupilSize: 0.1,
    irisWidth: 0.7,
    glowIntensity: 0.2,
    scale: 0.6,
    noiseScale: 1.3,
    pupilFollow: 0,
    flameSpeed: 0.7,
    backgroundColor: '#000000',
  });
</script>
</body>
</html>
