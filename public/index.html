<style>
  /* ===========================================================
     GOSOLKU · STUDY OS — frosted glass over the warm wallpaper.
     Home is a five-card bento (no scroll). Every card opens a
     professional modal on click. Chess opens a full board trainer
     + repertoire study. Ember palette, amber lamplight accent.
     =========================================================== */
  :root{
    --ink:#efe7db; --ink-2:#bcae9c; --ink-3:#8d7e6b; --ink-faint:#6a5c4d;
    --glass:rgba(28,22,17,.46); --glass-2:rgba(40,31,24,.62); --glass-in:rgba(16,12,9,.55);
    --line:rgba(220,180,130,.14); --line-soft:rgba(220,180,130,.08);
    --amber:#e6ad6b; --amber-hi:#f4cd92; --amber-dim:#b08a54;
    --go:#8fa871; --mid:#dcaf52; --stop:#c76f50;
    --kw:#e0a066; --str:#a6b57e; --num:#d3a26d; --com:#7a6c5a; --fn:#e0c197;
    --r:18px; --r-sm:12px;
    --ease:cubic-bezier(.22,.61,.36,1);
    --ease-out:cubic-bezier(.16,1,.3,1);
    --spring:cubic-bezier(.34,1.42,.5,1);
    --sq-light:#eeeed2; --sq-dark:#769656; --hl:rgba(246,246,105,.52);
  }
  *{ box-sizing:border-box; }
  html{ background:#0e0b08; }
  html,body{ margin:0; padding:0; height:100%; overflow:hidden; }
  body{ background:transparent; }
  body{
    font-family:"Inter", system-ui, sans-serif; color:var(--ink);
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; line-height:1.5;
  }
  ::selection{ background:rgba(230,173,107,.26); color:#fff; }
  input[type=number]{ -moz-appearance:textfield; appearance:textfield; }
  input[type=number]::-webkit-outer-spin-button, input[type=number]::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }

  #veil{ position:fixed; inset:0; z-index:-2; pointer-events:none;
    background:
      radial-gradient(1100px 700px at 30% 30%, rgba(20,15,11,.20), transparent 70%),
      radial-gradient(1000px 620px at 85% -6%, rgba(230,173,107,.06), transparent 62%),
      linear-gradient(180deg, rgba(14,11,8,.52), rgba(10,8,6,.58)); }
  #spotlight{ position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:radial-gradient(560px 560px at var(--mx,50%) var(--my,26%), rgba(230,173,107,.06), transparent 62%);
    transition:background .25s linear; }

  .wrap{
    height:100vh; max-width:1240px; margin:0 auto;
    padding:clamp(20px,3.4vh,40px) clamp(20px,4vw,46px) clamp(40px,6vh,68px);
    display:flex; flex-direction:column; min-height:0;
  }

  /* ---------------- header ---------------- */
  header.masthead{ flex:0 0 auto; }
  .eyebrow{ font-family:"JetBrains Mono",monospace; font-size:11px; letter-spacing:.26em; text-transform:uppercase; color:var(--ink-3); }
  .greeting{
    font-family:"Fraunces", serif; font-optical-sizing:auto; font-weight:500;
    font-size:clamp(30px,4.6vw,52px); line-height:1.02; letter-spacing:-.015em;
    margin:12px 0 0; color:var(--ink);
  }
  .greeting .accent{ font-family:"Fraunces",serif; font-optical-sizing:auto; color:var(--amber-hi); font-style:normal; font-weight:600; letter-spacing:0; text-shadow:0 1px 26px rgba(230,173,107,.18); }
  .greeting .accent .firenze{ font-family:"Fraunces",serif; font-size:1em; font-weight:500; font-style:italic; color:var(--amber); letter-spacing:.005em; }
  .clockrow{ display:flex; align-items:baseline; gap:14px; margin-top:14px; color:var(--ink-3); font-size:13px; }
  .clockrow .time{ font-family:"JetBrains Mono", monospace; color:var(--ink-2); }
  .rule{ height:1px; margin:22px 0 20px; flex:0 0 auto; background:linear-gradient(90deg, transparent, var(--line) 10%, var(--line) 90%, transparent); }

  /* ---------------- bento ---------------- */
  .bento{
    flex:1 1 auto; min-height:0;
    display:grid; gap:14px;
    grid-template-columns:0.92fr 1.34fr 0.92fr;
    grid-template-rows:1fr 1fr 1fr;
    grid-template-areas:
      "course   core physique"
      "course   core quran"
      "school   core chess";
  }
  @media (max-width:1040px){
    html,body{ overflow:auto; }
    .wrap{ height:auto; min-height:100vh; }
    .bento{ grid-template-columns:1fr 1fr; grid-template-rows:none; grid-auto-rows:minmax(150px,1fr);
      grid-template-areas:
        "core core"
        "course course"
        "physique quran"
        "chess chess"
        "school school"; }
    .aicore{ min-height:340px; }
  }
  @media (max-width:560px){ .bento{ grid-template-columns:1fr; grid-template-areas:"core" "course" "physique" "quran" "chess" "school"; } .aicore{ min-height:300px; } }

  /* ---------------- card ---------------- */
  .box{
    position:relative; grid-area:var(--ga);
    border:1px solid var(--line-soft); border-radius:var(--r);
    background:var(--glass); backdrop-filter:blur(22px) saturate(1.1); -webkit-backdrop-filter:blur(22px) saturate(1.1);
    padding:20px 22px; overflow:hidden; cursor:pointer;
    display:flex; flex-direction:column; min-height:0;
    animation:boxIn .82s var(--ease-out) backwards; animation-delay:calc(var(--i,0)*110ms);
    transition:transform .5s var(--spring), border-color .45s var(--ease), box-shadow .5s var(--ease), background .45s var(--ease);
  }
  @keyframes boxIn{ from{ opacity:0; transform:translateY(20px) scale(.98); } to{ opacity:1; transform:none; } }
  .box::before{ content:""; position:absolute; inset:-1px; border-radius:inherit; pointer-events:none;
    background:radial-gradient(300px 300px at var(--gx,50%) var(--gy,50%), rgba(230,173,107,.09), transparent 60%);
    opacity:0; transition:opacity .6s var(--ease); }
  .box::after{ content:""; position:absolute; left:0; right:0; top:0; height:1px; opacity:0; transition:opacity .6s var(--ease);
    background:linear-gradient(90deg, transparent, rgba(230,173,107,.55), transparent); }
  .box:hover, .box:focus-visible{ transform:translateY(-5px) scale(1.016); border-color:var(--line);
    box-shadow:0 30px 72px -34px rgba(0,0,0,.82); background:var(--glass-2); }
  .box:hover::before, .box:focus-visible::before, .box:hover::after, .box:focus-visible::after{ opacity:1; }
  .box:active{ transform:translateY(-2px) scale(1.005); }
