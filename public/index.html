<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#0a0705" />
<meta name="robots" content="noindex, nofollow" />
<meta name="description" content="Agasa — a personal assistant." />
<title>Agasa</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%2317110b'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23d7a05f'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,480;9..144,560&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./styles.css" />
</head>
<body>

<div id="scene"></div>
<div id="grain"></div>
<div id="tod"></div>
<div id="lamp"></div>

<div id="app">

  <header>
    <div class="wordmark">
      <h1>Agasa</h1>
      <p>Personal assistant</p>
    </div>
    <div id="status">
      <span class="dot"></span>
      <span id="status-label">Gemini Flash</span>
    </div>
  </header>

  <main>
    <figure class="frame">
      <img src="./assets/kittens.jpg" alt="Two kittens — the ones this is all eventually for." />
      <figcaption>someday</figcaption>
    </figure>

    <div id="panel">
      <div id="log" role="log" aria-live="polite" aria-label="Conversation">
        <div id="empty">
          <h2>Nothing here yet.</h2>
          <p>Ask something to get started.</p>
          <div class="chips">
            <button type="button" class="chip" data-prompt="What can you help me with?">What can you help me with?</button>
            <button type="button" class="chip" data-prompt="Help me plan my evening.">Help me plan my evening</button>
            <button type="button" class="chip" data-prompt="Explain something for A-level Physics.">Explain something for A-level Physics</button>
          </div>
        </div>
      </div>

      <button type="button" id="jump">↓ new messages</button>

      <form id="composer">
        <label for="input" class="sr-only">Message</label>
        <textarea id="input" rows="1" placeholder="Ask something…" autocomplete="off"></textarea>
        <button type="submit" id="send">Send</button>
      </form>
    </div>
  </main>

  <footer>
    <div id="usage-bar"><div id="usage-fill"></div></div>
    <span id="usage-text">loading usage…</span>
  </footer>

</div>

<script src="./app.js"></script>
</body>
</html>
