  #veil{ position:fixed; inset:0; z-index:-2; pointer-events:none;
    background:
      radial-gradient(1100px 700px at 30% 30%, rgba(20,15,11,.20), transparent 70%),
      radial-gradient(1000px 620px at 85% -6%, rgba(230,173,107,.06), transparent 62%),
      linear-gradient(180deg, rgba(14,11,8,.52), rgba(10,8,6,.58)); }
  #spotlight{ position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:radial-gradient(560px 560px at var(--mx,50%) var(--my,26%), rgba(230,173,107,.06), transparent 62%);
    transition:background .25s linear; }
  #tod{ position:fixed; inset:0; z-index:-2; pointer-events:none; transition:background 1.2s cubic-bezier(.22,.61,.36,1); }

  @keyframes lampBreathe{ 0%,100%{ opacity:.82; } 50%{ opacity:1; } }
  #spotlight{ animation:lampBreathe 9s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce){ #spotlight{ animation:none !important; } }
</style>
</head>
<body>

<div class="bg-blur"></div>
<div id="veil"></div>
<div id="spotlight"></div>
<div id="tod"></div>

<script>
  /* ambient: mouse-tracked spotlight */
  window.addEventListener("mousemove", e=>{
    document.documentElement.style.setProperty("--mx",(e.clientX/window.innerWidth*100)+"%");
    document.documentElement.style.setProperty("--my",(e.clientY/window.innerHeight*100)+"%");
  }, {passive:true});

  /* ambient: time-of-day tint */
  function tint(h){
    if(h>=21||h<5) return "radial-gradient(1200px 820px at 78% 6%, rgba(230,173,107,.05), transparent 62%), linear-gradient(180deg, rgba(24,14,6,.10), transparent 42%)";
    if(h<8)  return "radial-gradient(1200px 820px at 22% 8%, rgba(150,180,225,.045), transparent 62%), linear-gradient(180deg, rgba(120,150,205,.03), transparent 46%)";
    if(h<17) return "linear-gradient(180deg, rgba(255,255,255,.006), transparent 40%)";
    return "radial-gradient(1200px 840px at 80% 5%, rgba(232,150,80,.055), transparent 62%), linear-gradient(180deg, rgba(42,18,6,.10), transparent 46%)";
  }
  function paintTint(){ document.getElementById("tod").style.background = tint(new Date().getHours()); }
  paintTint();
  setInterval(paintTint, 5*60*1000);
</script>

</body>
</html>
