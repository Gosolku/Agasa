<script>
/* ============================================================
   ALIVE · SMART — Alfred: assistant, spaced-repetition, focus,
   time tint, motion, honest salah windows, end-of-day, idle warmth
   ============================================================ */
(function(){
  "use strict";
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const q = (s,r)=> (r||document).querySelector(s);
  const plural = n=> n===1 ? "" : "s";
  const dstr = d=> d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  const today = ()=> dstr(new Date());
  const daysAgo = t=> t ? Math.round((Date.now()-t)/86400000) : 999;
  const DOT_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3.1"/><path d="M12 3.2v3M12 17.8v3M3.2 12h3M17.8 12h3"/></svg>';

  /* ---------- honest daily-activity record (used quietly — never shown as a number) ---------- */
  const AKEY="active_days";
  function markActive(){ const a=store.get(AKEY,[]); const t=today(); if(!a.includes(t)){ a.push(t); store.set(AKEY, a.slice(-160)); } }
  function streak(){ const a=new Set(store.get(AKEY,[])); const d=new Date();
    const has=x=> a.has(dstr(x));
    if(!has(d)){ d.setDate(d.getDate()-1); if(!has(d)) return 0; }
    let n=0; while(has(d)){ n++; d.setDate(d.getDate()-1); } return n; }
  function isFirstToday(){ return !store.get("seen_"+today(), false); }
  function stampSeenToday(){ store.set("seen_"+today(), true); }

  /* wrap store.set so genuine actions stamp the day + a light spaced-repetition memory */
  const _set = store.set.bind(store);
  store.set = function(k,v){ _set(k,v);
    if(/^(phys_|physskip_|quran_|chess_elo|chess_week|course_hours|quiz_|chess_prog)/.test(k)) markActive();
    if(/^quran_/.test(k) && v==="go") _set("sr_"+k, Date.now());
    return v; };

  /* ---------- approximate salah band (spoken softly as "near" — never a hard time claim) ---------- */
  /* ---------- honest salah windows from the offline engine ---------- */
  function salahNow(){
    const now=new Date(), h=now.getHours()+now.getMinutes()/60;
    let T; try{ T=salahHoursToday(now); }catch(e){ return {band:null, next:null, mins:null, T:null}; }
    const order=[["fajr",T.fajr],["sunrise",T.sunrise],["dhuhr",T.dhuhr],["asr",T.asr],["maghrib",T.maghrib],["isha",T.isha]];
    // nearest upcoming prayer (excluding sunrise as a prayer, but keeping it as a marker)
    const prayers=order.filter(([n])=>n!=="sunrise");
    let next=null, mins=null;
    for(const [n,t] of prayers){ const d=(t-h)*60; if(d>=0 && d<=90){ next=n; mins=Math.round(d); break; } }
    // which band we're inside (from a prayer's entry until the next)
    let band=null;
    for(let i=0;i<prayers.length;i++){ const [n,t]=prayers[i]; const nt=(prayers[i+1]?prayers[i+1][1]:24+T.fajr); if(h>=t && h<nt){ band=n; break; } }
    return {band, next, mins, T};
  }

  /* ---------- read the whole state ---------- */
  function parseTime(s){ s=String(s).replace("~","").trim(); const m=s.match(/(\d+)h(?:(\d+)m)?/); return m ? (+m[1])+((+m[2]||0)/60) : 1e9; }
  function nextTopic(ch){ return RECAP.filter(x=>x.num).find(t=>parseTime(t.time)>ch) || null; }
  function chessLines(){
    try{
      const prog=store.get("chess_prog",{});
      const list=(window.CHESS_LINES && window.CHESS_LINES.london) || [];
      return list.map(l=>{ const p=prog["london/lines/"+l.id]||{}; const days=(p.days||[]).length, prac=p.prac||0;
        return {id:l.id,name:l.name,prac,days,mastered:(prac>=10&&days>=3),last:p.last?Date.parse(p.last):null}; });
    }catch(e){ return []; }
  }
  function ctx(){
    const now=new Date(), h=now.getHours(), dow=now.getDay();
    const ch=courseHours(), nt=nextTopic(ch);
    const pDone=physDailyDone(), pSkip=physDailySkip(), pLeft=physDailyLeft();
    const pAll=(pLeft===0 && pDone>0);
    const skipItem=physWeeklyItems()[0]||null;
    const skipWk=skipItem?physWeekCount(skipItem.id):0, skipTgt=skipItem?(skipItem.target||1):0;
    const qGoArr=JUZ30.filter(a=>store.get("quran_"+a[0],"stop")==="go");
    const qNextArr=JUZ30.find(a=>store.get("quran_"+a[0],"stop")!=="go"); const qNext=qNextArr?qNextArr[1]:null;
    let due=null, dueDays=0;
    qGoArr.forEach(a=>{ const d=daysAgo(store.get("sr_quran_"+a[0],0)); if(d>=7 && d>dueDays){ dueDays=d; due=a[1]; } });
    const wk=weekCount(), wt=weekTarget();
    const wrong=(typeof getWrong==="function")?getWrong():{};
    const weak=[...new Set(Object.keys(wrong).filter(k=>wrong[k]).map(i=>QUIZ[i]&&QUIZ[i].topic).filter(Boolean))];
    const lines=chessLines();
    const nearMastery=lines.filter(l=>!l.mastered&&l.prac>0).sort((a,b)=>(b.prac+b.days*3)-(a.prac+a.days*3))[0]||null;
    const staleLine=lines.filter(l=>l.last).map(l=>({l,d:daysAgo(l.last)})).filter(x=>x.d>=6).sort((a,b)=>b.d-a.d)[0]||null;
    const sal=salahNow();
    return {h,dow,ch,nt,pDone,pSkip,pLeft,pAll,skipWk,skipTgt,qGo:qGoArr.length,qNext,due,dueDays,
            wk,wt,weak,lines,nearMastery,staleLine,st:streak(),sal,first:isFirstToday()};
  }

  /* ---------- assistant: many gated candidates, the most relevant wins ---------- */
  const am = t=>`<span class="am">${t}</span>`;
  const hl = t=>`<span class="hl">${t}</span>`;
  const sName = n=> String(n||"").replace(/\s*\([^)]*\)\s*$/,"").trim();
  function candidates(c){
    const out=[]; const add=(w,html,act)=>out.push({w,html,act});
    const S=c.sal||{};

    /* quietly-earned closings */
    if(c.pAll) add(10,`That's the whole list done today. ${am("Nicely held.")}`);
    if(c.wt && c.wk>=c.wt) add(10,`The week's games are in — target reached. Rest is earned.`);
    if(c.qNext===null && c.qGo>0) add(10,`All of ${am("Juz ’Amma")} held in memory now. That's a real thing to have done.`);

    /* honest salah windows — plain, respectful, never a countdown gimmick */
    if(S.next==="maghrib" && S.mins!=null && S.mins<=25)
      add(10,`About ${hl(S.mins+" min")} to Maghrib — then your dates and a walk.`, "physique");
    if(S.next==="isha" && S.mins!=null && S.mins<=25)
      add(9,`Isha's in about ${hl(S.mins+" min")}. A natural point to wind the day down.`);
    if(S.band==="fajr")
      add(8,`If you're up this early, it's the best quiet for memorising — no worry if not.`, "quran");
    if(S.next==="fajr" && S.mins!=null && S.mins<=45)
      add(9,`Fajr's in soon — the morning Qur’an is the best use of it, if you're up.`, "quran");

    /* time-sensitive, without reproach */
    if(c.h>=18 && c.h<23 && c.pLeft>0)
      add(8,`The day's folding up — ${hl(c.pLeft+" habit"+plural(c.pLeft))} still open. Close it out when you like.`, "physique");
    if(c.h>=23 || c.h<4)
      add(8,`It's late — better to sleep now and start sharp tomorrow.`);
    if(c.staleLine)
      add(7,`The ${am(sName(c.staleLine.l.name))} line has gone quiet — ${hl(c.staleLine.d+" days")}. One run keeps it sharp.`, "chess");
    if(c.due)
      add(7,`${am(c.due)} hasn't been recited in ${hl(c.dueDays+" days")}. A quiet pass would keep it firm.`, "quran");

    /* directed next actions */
    if(c.nearMastery){
      const rem=Math.max(0,10-c.nearMastery.prac), rd=Math.max(0,3-c.nearMastery.days); let tail;
      if(rem>0 && rd>0) tail=`${hl(rem+" run"+plural(rem))} and ${hl(rd+" day"+plural(rd))} from mastered`;
      else if(rem>0) tail=`${hl(rem+" clean run"+plural(rem))} from mastered`;
      else tail=`a run on ${hl(rd+" more day"+plural(rd))} from sealing it`;
      add(6,`${am(sName(c.nearMastery.name))} is ${tail}.`, "chess");
    }
    if(c.nt) add(6,`You left the course at ${hl(c.nt.num+" · "+sName(c.nt.title))}. Twenty minutes moves it on.`, "course");
    if(c.skipItem && c.skipTgt && c.skipWk<c.skipTgt && c.h>=7 && c.h<19)
      add(5,`Rope's at ${hl(c.skipWk+"/"+c.skipTgt)} this week — a skip whenever it fits, no pressure on the day.`, "physique");
    if(c.wk===0 && c.dow>=2)
      add(5,`The board's untouched this week. ${am("One London drill")} to keep the edge?`, "chess");
    if(c.qNext && c.qGo>0)
      add(5,`${am(c.qNext)} is the next surah, when you're ready for it.`, "quran");
    if(c.weak.length)
      add(5,`You stumbled on ${am(c.weak[0])} last time. A short retry would settle it.`, "quiz");

    /* momentum / atmosphere — plainer, sparing */
    if(c.st>=3) add(4,`A good run of days going. ${am("It suits you.")}`);
    if(c.first) add(4,`First of the day's work. Where shall we start, ${am("sir?")}`);
    if(c.h>=7 && c.h<12) add(3,`Morning — a clean page. Best used early.`);
    else if(c.h>=12 && c.h<15) add(3,`Midday. Steady hands win the long games.`);
    else if(c.h>=15 && c.h<18) add(3,`Afternoon — a good hour for the thing you've been circling.`);
    else if(c.h>=18 && c.h<21) add(3,`Evening. A fine time for chess and the walk.`);

    /* quiet fallbacks */
    add(2,`One thing at a time. That's the whole trick.`);
    add(2,`The desk is set, ${am("sir.")} Whenever you're ready.`);
    return out;
  }

  const ACT={
    course:{run:()=>openCourseModal(), label:"Resume"},
    physique:{run:()=>openPhysiqueModal(), label:"Open"},
    quran:{run:()=>openQuranModal(), label:"Open"},
    chess:{run:()=>openChess(), label:"To the board"},
    quiz:{run:()=>openQuiz(), label:"Retry"}
  };
  let lastMsg="";
  function pick(){
    const cs=candidates(ctx()); const max=Math.max.apply(null,cs.map(x=>x.w));
    let top=cs.filter(x=>x.w>=max-1);
    const fresh=top.filter(x=>x.html!==lastMsg); if(fresh.length) top=fresh;
    const p=top[Math.floor(Math.random()*top.length)]||{html:"The desk is set, sir."};
    lastMsg=p.html; return p;
  }

  /* ---------- DOM injection ---------- */
  let txtEl=null, tod=null;
  function build(){
    const masthead=q(".masthead");
    if(masthead && !q("#assistantLine")){ const p=document.createElement("p"); p.className="assist"; p.id="assistantLine";
      p.innerHTML='<span class="assist-dot" aria-hidden="true"></span><span class="assist-txt"></span>'; masthead.appendChild(p); }
    txtEl=q("#assistantLine .assist-txt");
    if(!q("#tod")){ tod=document.createElement("div"); tod.id="tod"; const v=q("#veil"); if(v) v.insertAdjacentElement("afterend",tod); else document.body.appendChild(tod); }
    else tod=q("#tod");
  }
  function applyLine(p){
    if(!txtEl) return;
    txtEl.innerHTML=p.html;
    const line=txtEl.parentNode; const old=line.querySelector(".assist-act"); if(old) old.remove();
    if(p.act && ACT[p.act]){ const btn=document.createElement("button"); btn.className="assist-act"; btn.type="button";
      btn.textContent=ACT[p.act].label+" ›"; btn.addEventListener("click",()=>ACT[p.act].run()); line.appendChild(btn); }
  }
  function renderAssistant(){
    const p=pick(); if(!txtEl) return;
    if(reduce || !txtEl.innerHTML){ applyLine(p); return; }
    const line=txtEl.parentNode; const old=line.querySelector(".assist-act"); if(old) old.style.opacity="0";
    txtEl.style.opacity="0"; txtEl.style.transform="translateY(3px)";
    setTimeout(()=>{ applyLine(p); txtEl.style.opacity=""; txtEl.style.transform=""; }, 240);
  }

  /* ---------- time-of-day tint ---------- */
  function tint(h){
    if(h>=21||h<5) return "radial-gradient(1200px 820px at 78% 6%, rgba(230,173,107,.05), transparent 62%), linear-gradient(180deg, rgba(24,14,6,.10), transparent 42%)";
    if(h<8)  return "radial-gradient(1200px 820px at 22% 8%, rgba(150,180,225,.045), transparent 62%), linear-gradient(180deg, rgba(120,150,205,.03), transparent 46%)";
    if(h<17) return "linear-gradient(180deg, rgba(255,255,255,.006), transparent 40%)";
    return "radial-gradient(1200px 840px at 80% 5%, rgba(232,150,80,.055), transparent 62%), linear-gradient(180deg, rgba(42,18,6,.10), transparent 46%)";
  }
  function paintTint(){ if(tod) tod.style.background = tint(new Date().getHours()); }

  /* ---------- focus of the day (least-complete card, no numbers shown) ---------- */
  function paintFocus(){
    const ch=courseHours();
    const r={ course:Math.min(1,ch/COURSE_TOTAL_H),
      physique:(function(){const items=physDailyItems();const dn=items.filter(i=>store.get("phys_"+i.id,false)).length,sk=items.filter(i=>store.get("physskip_"+i.id,false)).length;return dn/Math.max(1,items.length-sk);})(),
      quran:JUZ30.filter(a=>store.get("quran_"+a[0],"stop")==="go").length/JUZ30.length,
      chess:Math.min(1, weekCount()/(weekTarget()||1)) };
    const order=["physique","chess","quran","course"]; let pick2=order[0], best=Infinity;
    order.forEach(k=>{ if(r[k]<best){ best=r[k]; pick2=k; } });
    boxes.forEach(b=>{ const isF=b.classList.contains("box-"+pick2);
      b.classList.toggle("box--focus",isF);
      let tag=q(".focus-tag",b);
      if(isF && !tag){ tag=document.createElement("span"); tag.className="focus-tag"; tag.textContent="focus"; const head=q(".box-head",b); if(head) head.appendChild(tag); }
      if(!isF && tag) tag.remove();
    });
  }

  /* ---------- count-up on numbers (inside modals only) ---------- */
  function countUp(el){
    if(reduce || !el || el.dataset.counted) return;
    const node=el.firstChild; const raw=node&&node.nodeType===3 ? node.nodeValue : el.textContent;
    const m=String(raw).match(/^(\d[\d,]*)/); if(!m) return;
    const to=parseInt(m[1].replace(/,/g,""),10); if(!(to>0)) return;
    el.dataset.counted="1"; const tail=String(raw).slice(m[1].length); const t0=performance.now(), dur=680;
    const put=v=>{ const s=v.toLocaleString(); if(node&&node.nodeType===3) node.nodeValue=s+tail; else el.textContent=s; };
    function fr(t){ const p=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-p,3); put(Math.round(e*to)); if(p<1) requestAnimationFrame(fr); }
    put(0); requestAnimationFrame(fr);
  }
  function countUpIn(root){ if(root) root.querySelectorAll(".prog-pct, .big, .stat-pct").forEach(countUp); }

  /* ---------- pulse cards that changed while you were away ---------- */
  const sigs=new Map();
  const sig=b=> (b._sig?b._sig():"");
  function snapshot(){ boxes.forEach(b=> sigs.set(b,sig(b))); }
  function pulseChanged(){ boxes.forEach(b=>{ const s=sig(b);
    if(sigs.get(b)!==undefined && sigs.get(b)!==s && !reduce){ b.classList.remove("box--pulse"); void b.offsetWidth; b.classList.add("box--pulse"); setTimeout(()=>b.classList.remove("box--pulse"),1000); }
    sigs.set(b,s); }); }
  function onReturnHome(){ pulseChanged(); paintFocus(); renderAssistant(); }

  /* ---------- toast ---------- */
  let toastEl=null, toastT=null;
  function toast(msg){ if(!toastEl){ toastEl=document.createElement("div"); toastEl.className="toast"; document.body.appendChild(toastEl); }
    toastEl.innerHTML='<span class="tk-dot"></span>'+msg; toastEl.classList.add("show");
    clearTimeout(toastT); toastT=setTimeout(()=>toastEl.classList.remove("show"),2600); }
  window.osToast=toast;

  /* ---------- physique end-of-day close-out (called from the physique modal) ---------- */
  window.physCloseout=function(body,api){
    const now=new Date(), h=now.getHours()+now.getMinutes()/60;
    const force=window.__forceClose===true; window.__forceClose=false;
    const ds=today(); const sealed=store.get("phys_sealed",null)===ds;
    const done=physDailyDone(), skip=physDailySkip(), left=physDailyLeft();
    /* Sealing waits for Isha — the day isn't done until the last prayer is in. */
    let ishaH=21.75; try{ ishaH=salahHoursToday(now).isha; }catch(e){}
    const afterIsha = h>=ishaH;
    /* The close-out expands after 18:00 or on request; the day can always be reset. */
    const open = force || h>=18;
    const wrap=document.createElement("div"); wrap.className="dayclose"+(sealed?" sealed":"")+(open||sealed?"":" mini");
    if(!open && !sealed){
      wrap.innerHTML=`<div class="dc-h">The day</div><p><b>${done}</b> done, <b>${left}</b> open. <button class="dc-link" id="dcOpen">Close out the day ›</button></p>`;
      body.appendChild(wrap);
      const o=wrap.querySelector("#dcOpen");
      if(o) o.addEventListener("click",()=>{ window.__forceClose=true; openPhysiqueModal(); });
      return;
    }
    const sealedLine=`The day is sealed — <b>${done}</b> done, <b>${skip}</b> set aside. Rest well, sir. <button class="dc-link" id="dcReopen">Reopen ›</button>`;
    const line = sealed ? sealedLine
      : (left>0 ? `<b>${done}</b> done so far, <b>${left}</b> still open. Tick what you managed — the rest simply rolls into tomorrow.`
                : `All accounted for — <b>${done}</b> done, <b>${skip}</b> set aside. A tidy day.`);
    const wireReopen=()=>{ const r=wrap.querySelector("#dcReopen"); if(r) r.addEventListener("click",()=>{ store.set("phys_sealed",null); if(typeof updateCards==="function")updateCards(); if(typeof openPhysiqueModal==="function") openPhysiqueModal(); }); };
    /* Seal appears only after Isha; before then, a quiet note in its place. */
    const sealBtn = afterIsha
      ? `<button class="dc-btn" id="dcSeal">Seal the day</button>`
      : `<span class="dc-wait">Sealing opens after Isha (${salahFmt(ishaH)})</span>`;
    wrap.innerHTML=`<div class="dc-h">${sealed?"Day sealed":"Closing out the day"}</div><p>${line}</p>`
      + (sealed?"":`<div class="dc-actions">${sealBtn}<button class="dc-btn ghost" id="dcRoll">Roll the rest over</button><button class="dc-btn ghost danger" id="dcReset">Reset the day</button></div>`);
    body.appendChild(wrap);
    if(sealed) wireReopen();
    const seal=wrap.querySelector("#dcSeal");
    if(seal) seal.addEventListener("click",()=>{ store.set("phys_sealed",ds); if(api&&api.setSub)api.setSub(); if(typeof updateCards==="function")updateCards();
      wrap.classList.add("sealed"); wrap.querySelector(".dc-h").textContent="Day sealed"; wrap.querySelector("p").innerHTML=sealedLine; const a=wrap.querySelector(".dc-actions"); if(a)a.remove(); wireReopen(); toast("The day is sealed. Rest well."); });
    const roll=wrap.querySelector("#dcRoll");
    if(roll) roll.addEventListener("click",()=>{ physDailyItems().forEach(i=>{ if(!store.get("phys_"+i.id,false)) store.set("physskip_"+i.id,true); }); store.set("phys_sealed",ds); if(typeof updateCards==="function")updateCards(); if(typeof openPhysiqueModal==="function") openPhysiqueModal(); });
    const reset=wrap.querySelector("#dcReset");
    if(reset) reset.addEventListener("click",()=>{
      physDailyItems().forEach(i=>{ store.set("phys_"+i.id,false); store.set("physskip_"+i.id,false); });
      store.set("phys_sealed",null);
      if(typeof updateCards==="function")updateCards();
      toast("The day's slate is clear.");
      if(typeof openPhysiqueModal==="function") openPhysiqueModal();
    });
  };

  /* ---------- observers ---------- */
  function watchOverlay(sel){ const o=q(sel); if(!o) return; let was=o.classList.contains("show");
    new MutationObserver(()=>{ const now=o.classList.contains("show"); if(was&&!now) onReturnHome(); was=now; }).observe(o,{attributes:true,attributeFilter:["class"]}); }
  function watchModal(){ const mo=q("#modal"); if(mo) new MutationObserver(()=>countUpIn(mo)).observe(mo,{childList:true}); }

  /* ---------- boot ---------- */
  function boot(){
    build(); paintTint(); paintFocus(); renderAssistant(); stampSeenToday(); snapshot(); countUpIn(q("#bento"));
    watchOverlay("#overlay"); watchOverlay("#chessOverlay"); watchModal();
    setInterval(paintTint, 5*60*1000);
    setInterval(()=>{ if(!q(".overlay.show") && !q("#chessOverlay.show") && !document.hidden) renderAssistant(); }, 3*60*1000);
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",boot); else boot();
})();
</script>

<style id="aicore-style">

  grid-area:core; position:relative; overflow:hidden;
  border-radius:var(--r);
  display:flex; align-items:center; justify-content:center;

    radial-gradient(120% 130% at 50% 34%, rgba(70,50,30,.55), rgba(18,13,9,.60) 55%, rgba(9,6,4,.82) 100%);

/* concentric CSS rings layered over the canvas orb */
.aicore-rings{
  position:absolute; z-index:2; top:calc(50% - 3px); left:50%;
  width:min(70%, 360px); aspect-ratio:1; transform:translate(-50%,-50%);
  pointer-events:none;
}
.aicore-rings i{ position:absolute; inset:0; border-radius:50%; }
.aicore-rings .r-track{
  inset:6%; border:1px solid rgba(220,180,130,.12);
  box-shadow:inset 0 0 24px rgba(230,173,107,.06);
}
.aicore-rings .r-dash{
  inset:0; border-radius:50%;
  background:
    conic-gradient(from 0deg,
      transparent 0 6deg, rgba(228,173,107,.55) 6deg 7deg, transparent 7deg 15deg);
  -webkit-mask:radial-gradient(circle, transparent 0 47%, #000 47.6% 50%, transparent 50.6%);
          mask:radial-gradient(circle, transparent 0 47%, #000 47.6% 50%, transparent 50.6%);
  animation:agasa-spin 26s linear infinite; opacity:.7;
}
.aicore-rings .r-ticks{
  inset:12%;
  background:
    conic-gradient(from 0deg,
      transparent 0 28deg, rgba(244,205,146,.5) 28deg 29deg, transparent 29deg 30deg);
  -webkit-mask:radial-gradient(circle, transparent 0 44%, #000 44.6% 50%, transparent 50.6%);
          mask:radial-gradient(circle, transparent 0 44%, #000 44.6% 50%, transparent 50.6%);
  animation:agasa-spin 60s linear infinite reverse; opacity:.55;
}
.aicore-rings .r-sweep{
  inset:9%; border-radius:50%;
  background:conic-gradient(from var(--sw,0deg),
    rgba(246,205,146,.32), rgba(246,205,146,.05) 42deg, transparent 90deg, transparent 360deg);
  -webkit-mask:radial-gradient(circle, transparent 0 20%, #000 60%);
          mask:radial-gradient(circle, transparent 0 20%, #000 60%);
  animation:agasa-spin 7.5s linear infinite; opacity:.8; mix-blend-mode:screen;
}
@keyframes agasa-spin{ to{ transform:rotate(360deg); } }

/* HUD text */
.aicore-hud{
  position:absolute; z-index:3; inset:0; pointer-events:none;
  display:flex; flex-direction:column; justify-content:space-between;
  padding:16px 16px 14px; font-family:"JetBrains Mono",monospace;
}
.aicore-hud .h-top{ display:flex; align-items:center; justify-content:space-between; }
.h-name{ font-size:11px; letter-spacing:.42em; color:var(--amber-hi); text-transform:uppercase;
  text-shadow:0 0 18px rgba(246,205,146,.35); }
.h-badge{ font-size:9.5px; letter-spacing:.22em; color:var(--ink-3); text-transform:uppercase;
  border:1px solid var(--line); border-radius:999px; padding:3px 8px; background:rgba(0,0,0,.25); }
.aicore-hud .h-bottom{ display:flex; flex-direction:column; gap:7px; }
.h-status{ display:flex; align-items:center; gap:8px; font-size:11px; color:var(--ink-2); }
.h-status .dot{ width:7px; height:7px; border-radius:50%; background:var(--go);
  box-shadow:0 0 10px var(--go); animation:agasa-blink 2.4s var(--ease) infinite; }
@keyframes agasa-blink{ 0%,100%{opacity:1} 50%{opacity:.35} }
.h-status .stxt::after{ content:"▍"; color:var(--amber); animation:agasa-caret 1s steps(1) infinite; }
@keyframes agasa-caret{ 50%{opacity:0} }
.h-wave{ width:100%; height:26px; }
.h-sub{ font-size:9.5px; letter-spacing:.16em; color:var(--ink-faint); text-transform:uppercase; }
@media (max-width:560px){ .h-wave{ height:22px; } .h-name{ font-size:10px; } }
</style>


<script id="aicore-js">
(function(){
  var bento=document.getElementById('bento');
  if(!bento) return;

  // ---- build DOM ----
  var core=document.createElement('div');
  core.className='aicore'; core.id='aicore'; core.setAttribute('aria-hidden','true');
  core.innerHTML=
    '<canvas class="aicore-canvas"></canvas>'+
    '<div class="aicore-rings"><i class="r-track"></i><i class="r-dash"></i><i class="r-ticks"></i><i class="r-sweep"></i></div>'+
    '<div class="aicore-hud">'+
      '<div class="h-top"><div class="h-name">A&#8202;G&#8202;A&#8202;S&#8202;A</div><div class="h-badge">core · online</div></div>'+
      '<div class="h-bottom">'+
        '<div class="h-status"><span class="dot"></span><span class="stxt"></span></div>'+
        '<canvas class="h-wave"></canvas>'+
        '<div class="h-sub">// study companion — v0.1 · voice soon</div>'+
      '</div>'+
    '</div>';
  bento.appendChild(core);

  var cvs=core.querySelector('.aicore-canvas'), ctx=cvs.getContext('2d');
  var wave=core.querySelector('.h-wave'), wctx=wave.getContext('2d');
  var stxt=core.querySelector('.stxt');
  var DPR=Math.min(window.devicePixelRatio||1, 1.6);

  var W=0,H=0,cx=0,cy=0,R=0;
  function resize(){
    var r=core.getBoundingClientRect();
    W=r.width; H=r.height; cx=W/2; cy=H*0.46; R=Math.min(W,H)*0.30;
    cvs.width=W*DPR; cvs.height=H*DPR; cvs.style.width=W+'px'; cvs.style.height=H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
    var wr=wave.getBoundingClientRect();
    wave.width=wr.width*DPR; wave.height=wr.height*DPR;
    wave.style.width=wr.width+'px'; wave.style.height=wr.height+'px';
    wctx.setTransform(DPR,0,0,DPR,0,0);
  }
  var ro=new ResizeObserver(resize); ro.observe(core); resize();

  // pointer / energy state
  var mx=0.5,my=0.5, tx=0.5,ty=0.5, energy=0.16, tEnergy=0.16;
  core.addEventListener('mousemove',function(e){
    var r=core.getBoundingClientRect();
    tx=(e.clientX-r.left)/r.width; ty=(e.clientY-r.top)/r.height;
    tEnergy=Math.min(tEnergy+0.02,0.62);
  });
  core.addEventListener('mouseleave',function(){ tx=0.5; ty=0.5; tEnergy=0.16; });
  core.addEventListener('click',function(){ tEnergy=1.0; say(pick(replies)); });

  // particles orbiting the orb
  var parts=[]; for(var i=0;i<46;i++){ parts.push({
    a:Math.random()*Math.PI*2, r:0.62+Math.random()*0.9, sp:(0.15+Math.random()*0.5)*(Math.random()<.5?-1:1),
    s:0.5+Math.random()*1.6, ph:Math.random()*6.28 }); }

  function lerp(a,b,t){ return a+(b-a)*t; }
  var amber=[230,173,107], hi=[244,205,146];
  function rgba(c,a){ return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }

  var t=0, waveHist=new Array(64).fill(0);
  function draw(){
    t+=0.016;
    mx=lerp(mx,tx,0.06); my=lerp(my,ty,0.06);
    energy=lerp(energy,tEnergy,0.08); tEnergy=lerp(tEnergy,0.16,0.012);
    var breathe=1+Math.sin(t*1.1)*0.05+energy*0.10;
    var ox=(mx-0.5)*R*0.5, oy=(my-0.5)*R*0.5;

    ctx.clearRect(0,0,W,H);

    // outer glow halo
    var halo=ctx.createRadialGradient(cx,cy,R*0.2,cx,cy,R*3.0);
    halo.addColorStop(0, rgba(amber,0.16+energy*0.16));
    halo.addColorStop(0.5, rgba(amber,0.05));
    halo.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=halo; ctx.fillRect(0,0,W,H);

    // warped plasma body (layered offset radial blobs)
    ctx.globalCompositeOperation='screen';
    for(var k=0;k<5;k++){
      var ang=t*0.5+k*1.257, rad=R*(0.10+0.06*k)*(0.6+energy);
      var bx=cx+Math.cos(ang)*rad*0.5, by=cy+Math.sin(ang*1.3)*rad*0.5;
      var g=ctx.createRadialGradient(bx,by,0,bx,by,R*breathe*(1.05-0.08*k));
      var col=k%2? hi:amber;
      g.addColorStop(0, rgba(col,0.30));
      g.addColorStop(0.4, rgba(col,0.10));
      g.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=g; ctx.beginPath();
      ctx.arc(cx,cy,R*breathe*1.25,0,6.2832); ctx.fill();
    }

    // bright inner nucleus + pupil that follows cursor
    var nx=cx+ox*0.6, ny=cy+oy*0.6;
    var core1=ctx.createRadialGradient(nx,ny,0,nx,ny,R*0.9*breathe);
    core1.addColorStop(0,'rgba(255,244,225,'+(0.85)+')');
    core1.addColorStop(0.22, rgba(hi,0.7));
    core1.addColorStop(0.55, rgba(amber,0.22));
    core1.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=core1; ctx.beginPath(); ctx.arc(nx,ny,R*1.05*breathe,0,6.2832); ctx.fill();

    // thin scan ripple ring
    var rr=(t*40)% (R*1.6);
    ctx.globalCompositeOperation='screen';
    ctx.strokeStyle=rgba(hi, Math.max(0,0.28-(rr/(R*1.6))*0.28)); ctx.lineWidth=1.2;
    ctx.beginPath(); ctx.arc(cx,cy,R*0.4+rr,0,6.2832); ctx.stroke();

    // orbiting particles
    for(var p=0;p<parts.length;p++){ var o=parts[p];
      o.a+=o.sp*0.01*(0.6+energy);
      var pr=R*o.r*(1+Math.sin(t*0.8+o.ph)*0.06);
      var px=cx+Math.cos(o.a)*pr, py=cy+Math.sin(o.a)*pr*0.92;
      var tw=0.35+0.4*(0.5+0.5*Math.sin(t*2+o.ph));
      ctx.fillStyle=rgba(hi, tw*(0.5+energy*0.5));
      ctx.beginPath(); ctx.arc(px,py,o.s*(0.7+energy*0.6),0,6.2832); ctx.fill();
    }
    ctx.globalCompositeOperation='source-over';

    drawWave();
    requestAnimationFrame(draw);
  }

  function drawWave(){
    var w=wave.getBoundingClientRect().width, h=wave.getBoundingClientRect().height;
    wctx.clearRect(0,0,w,h);
    var target=0.12+energy*0.85;
    for(var i=waveHist.length-1;i>0;i--) waveHist[i]=waveHist[i-1];
    waveHist[0]=target;
    var bars=40, gap=3, bw=(w-(bars-1)*gap)/bars;
    for(var b=0;b<bars;b++){
      var env=Math.sin((b/bars)*Math.PI);
      var amp=(0.18+0.82*env)*(0.25+ waveHist[b%waveHist.length]);
      var n=0.5+0.5*Math.sin(t*6+b*0.6)+0.3*Math.sin(t*11+b);
      var val=Math.max(0.05, amp*(0.5+0.5*n));
      var bh=Math.min(h, val*h);
      var x=b*(bw+gap), y=(h-bh)/2;
      var grd=wctx.createLinearGradient(0,y,0,y+bh);
      grd.addColorStop(0,'rgba(244,205,146,0.9)');
      grd.addColorStop(1,'rgba(230,173,107,0.25)');
      wctx.fillStyle=grd;
      wctx.fillRect(x,y,Math.max(1,bw),bh);
    }
  }

  // ---- status typewriter ----
  var idles=['idle · standing by','listening','monitoring your day','ready when you are, Gosolku',
             'parsing repertoire','holding the fort','all systems nominal'];
  var replies=['yes?','at your service','on it','what shall we study?','right here','ready'];
  function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
  var typing=false;
  function say(msg){
    typing=true; var i=0; stxt.textContent='';
    (function step(){
      if(i<=msg.length){ stxt.textContent=msg.slice(0,i++); setTimeout(step, 34+Math.random()*40); }
      else { typing=false; }
    })();
  }
  say('systems online');
  setInterval(function(){ if(!typing) say(pick(idles)); }, 5200);

  // pause rAF when tab hidden (battery friendly on 8GB)
  var running=true;
  document.addEventListener('visibilitychange',function(){
    if(document.hidden){ running=false; }
    else if(!running){ running=true; requestAnimationFrame(draw); }
  });
  requestAnimationFrame(draw);
})();
</script>

</body>
