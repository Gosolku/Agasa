<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>Agasa</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='%23ffffff'/%3E%3C/svg%3E" />

<style>
  /* The page's black lives on the root only. A background on body as well
     would paint over anything sitting at a negative z-index — which is
     exactly where the eye is. */
  html {
    height: 100%;
    background: #000000;
  }

  body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    color: #e8ecf0;
    font: 13px/1.65 ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
  }

  .backdrop {
    position: fixed;
    inset: 0;
    z-index: -1;
    display: block;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  /* The terminal keeps to the left; the eye is offset right by half this
     width in js, which lands it in the middle of what is left over. */
  .term {
    position: fixed;
    left: 0;
    top: 0;
    bottom: 0;
    width: clamp(300px, 30vw, 430px);
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 22px 20px;
    box-sizing: border-box;
    /* Just enough shade to hold the text where the eye's glow reaches. */
    background: linear-gradient(to right, rgba(0, 0, 0, 0.82) 60%, rgba(0, 0, 0, 0));
  }

  .term__head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    padding-bottom: 14px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.10);
  }

  .wordmark {
    font-size: 19px;
    font-weight: 500;
    letter-spacing: 0.34em;
    text-transform: uppercase;
    color: #ffffff;
    text-shadow: 0 0 22px rgba(255, 255, 255, 0.35);
  }

  .meter {
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #5c6672;
  }

  /* Who is speaking, above what they said. Inline prefixes would eat a third
     of a column this narrow. */
  .who {
    display: block;
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .term__log {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overscroll-behavior: contain;
    scrollbar-width: thin;
    scrollbar-color: #2a3038 transparent;
  }

  .line {
    margin: 0 0 16px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }

  .line[data-kind="user"] { color: #ffffff; }
  .line[data-kind="user"] .who { color: #5c6672; }
  .line[data-kind="agent"] { color: #b3bcc6; }
  .line[data-kind="agent"] .who { color: #ffffff; }
  .line[data-kind="error"] { color: #f85149; }
  .line[data-kind="note"] { color: #5c6672; }

  /* A block that blinks while the answer is still arriving. */
  .caret {
    display: inline-block;
    width: 0.55em;
    height: 1em;
    margin-left: 1px;
    vertical-align: text-bottom;
    background: #e8ecf0;
    animation: blink 1.1s steps(2, start) infinite;
  }

  @keyframes blink { 50% { opacity: 0; } }

  .term__prompt {
    border-top: 1px solid rgba(255, 255, 255, 0.10);
    padding-top: 12px;
  }

  .term__prompt .who { color: #5c6672; }

  .term__field {
    display: flex;
    align-items: baseline;
    gap: 8px;
  }

  .term__field::before {
    content: "\203A";
    color: #5c6672;
  }

  .term__prompt input {
    flex: 1;
    min-width: 0;
    font: inherit;
    color: #ffffff;
    background: none;
    border: 0;
    padding: 0;
    caret-color: #ffffff;
  }

  .term__prompt input:focus { outline: none; }
  .term__prompt input::placeholder { color: #3f4753; }

  /* While a turn is in flight the prompt is inert, and says so quietly. */
  .term[data-busy="true"] .term__prompt { opacity: 0.45; }

  @media (prefers-reduced-motion: reduce) {
    .caret { animation: none; }
  }

  /* Narrow screens have no room beside the terminal, so it takes the width
     and the eye returns to the middle, behind it. */
  @media (max-width: 720px) {
    .term {
      width: 100%;
      background: rgba(0, 0, 0, 0.72);
    }
  }
</style>
</head>
<body>

<canvas class="backdrop" id="backdrop" aria-hidden="true"></canvas>

<section class="term" id="term" data-busy="false" aria-label="Agasa">
  <div class="term__head">
    <span class="wordmark">Agasa</span>
    <span class="meter" data-meter></span>
  </div>

  <div class="term__log" data-log role="log" aria-live="polite" aria-atomic="false"></div>

  <form class="term__prompt" autocomplete="off">
    <label class="who" for="prompt">Gosolku Da Firenze</label>
    <div class="term__field">
      <input id="prompt" type="text" placeholder="say something" spellcheck="false" autofocus />
    </div>
  </form>
</section>

<script type="module">
  import { createEvilEye } from '/js/evil-eye.js';
  import { createTerminal } from '/js/terminal.js';

  const term = document.getElementById('term');

  createEvilEye(document.getElementById('backdrop'), {
    scale: 0.5,
    // Half the terminal's width puts the eye in the middle of the space the
    // terminal leaves; below the breakpoint the terminal covers everything,
    // so it goes back to the middle of the window.
    offset: () => ({
      x: innerWidth > 720 ? term.offsetWidth / 2 : 0,
      y: 0,
    }),
  });

  createTerminal(term, { user: 'Gosolku Da Firenze', agent: 'Agasa' }).focus();
</script>
</body>
</html>
