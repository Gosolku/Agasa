/* ============================================================
   QUIZ — model answers carry code only where it helps
   ============================================================ */
const QUIZ = [
 { topic:"Variables", q:"What's the difference between val and var, and which should you prefer?",
   a:`<code>val</code> can't be reassigned after it's set; <code>var</code> can. <b>Prefer <code>val</code></b> and only use <code>var</code> when the value must change — it prevents accidental reassignment.` },
 { topic:"Types", q:"Why does 5 / 2 give 2 in Kotlin, and how do you get 2.5?",
   a:`Dividing two <code>Int</code>s truncates to a whole number. Make at least one side a <code>Double</code>:
<pre class="code">${hl(`5 / 2      // 2\n5.0 / 2    // 2.5`)}</pre>` },
 { topic:"String templates", q:"How do you drop a value — and a whole expression — into a string?",
   a:`Use <code>$name</code> for a plain value and <code>${'$'}{...}</code> for an expression, instead of gluing with <code>+</code>. Cleaner and harder to get wrong.
<pre class="code">${hl(`val score = 9\nprintln("You scored $score")\nprintln("Next: ${'$'}{score + 1}")`)}</pre>` },
 { topic:"Nullability", q:"What do ?. and ?: do, and when would ?. produce null?",
   a:`<code>?.</code> (safe call) runs the call only if the value isn't null, otherwise the whole thing is <b>null</b>. <code>?:</code> (Elvis) supplies a fallback when the left side is null.
<pre class="code">${hl(`val t: String? = null\nt?.length        // null\nt?.length ?: 0   // 0`)}</pre>` },
 { topic:"Nullability", q:"Exact name expected — what does !! throw if the value is null?",
   exact:"the precise exception name is expected",
   a:`A <b>NullPointerException</b>. <code>!!</code> means "I'm certain this isn't null — crash here if I'm wrong."` },
 { topic:"Control flow", q:"Why is when often better than a long if/else chain?",
   a:`<code>when</code> is an <b>expression</b> — it returns a value you can assign directly — and it's far more readable for many branches. Over a sealed type or enum it can also be exhaustive, so the compiler catches a missing case.` },
 { topic:"Functions", q:"What can a single-expression function drop, and what does a default parameter save the caller?",
   a:`A single-expression function drops the braces and <code>return</code>. A <b>default parameter</b> gives an argument a fallback, so callers can skip the common value.
<pre class="code">${hl(`fun square(n: Int) = n * n              // single-expression\nfun greet(name: String = "friend") = "Hi $name"\ngreet()      // Hi friend`)}</pre>` },
 { topic:"Loops", q:"What's the difference between 1..3 and 0 until 3?",
   a:`<code>1..3</code> is inclusive → 1, 2, 3. <code>0 until 3</code> stops one short → 0, 1, 2. Use <code>until</code> when walking list positions, since it stops before the size.` },
 { topic:"Arrays", q:"What's the one thing you can't do to an array, and what replaces it?",
   a:`You can't change its <b>size</b> — arrays are fixed-length. When you need to add or remove items, use a <code>MutableList</code>.` },
 { topic:"Classes", q:"What does putting val in the primary constructor do?",
   a:`It declares <b>and</b> assigns the property in one step — no separate field plus assignment.
<pre class="code">${hl(`class Car(val make: String, var speed: Int)\nval c = Car("Toyota", 0)   // make & speed set`)}</pre>` },
 { topic:"init blocks", q:"When does an init block run, and what belongs in it?",
   a:`It runs <b>automatically when the object is created</b>, just after the constructor. Put setup that needs more than a plain assignment there — validation, logging, deriving one property from another.` },
 { topic:"Secondary constructors", q:"What keyword writes a secondary constructor, and how does it reach the primary one?",
   a:`The <code>constructor</code> keyword, delegating to the primary with <code>: this(...)</code> — so callers can build with less information when a sensible default exists.
<pre class="code">${hl(`class User(val name: String, val age: Int){\n    constructor(name: String) : this(name, 0)\n}`)}</pre>` },
 { topic:"Getters/setters", q:"What does the field keyword refer to inside a custom setter?",
   a:`The <b>actual stored value</b> (the backing field). You assign to <code>field</code> to avoid an infinite loop — writing to the property name inside its own setter would call the setter again.
<pre class="code">${hl(`var name = ""\n    set(value){ field = value.trim() }`)}</pre>` },
 { topic:"lateinit", q:"Exact name expected — what exception does using a lateinit var before assigning it throw?",
   exact:"the precise name is expected here",
   a:`<b>UninitializedPropertyAccessException</b>. <code>lateinit</code> promises you'll set it before use; touching it early breaks that promise.` },
 { topic:"Companion objects", q:"What does a companion object give you, and how are its members called?",
   a:`Members that belong to the <b>class itself</b> rather than an instance (Kotlin's equivalent of static). Called on the class name, with one companion per class.
<pre class="code">${hl(`class User private constructor(val name: String){\n    companion object { fun create(n: String) = User(n) }\n}\nUser.create("Gosol")   // called on the type`)}</pre>` },
 { topic:"Singleton", q:"What does declaring something with object (not class) create?",
   a:`A <b>single, shared instance</b> — exactly one exists for the whole program. Every part of the code that names it gets the same instance. Good for one-of-a-kind things like settings or a logger.` },
 { topic:"Lazy", q:"When does a by lazy value get created?",
   a:`On the <b>first time it's read</b>, not when it's declared — then it's remembered and reused. Useful when the value is expensive and might not be needed.` },
 { topic:"Enum classes", q:"What is an enum class, and why is a when over one safer than loose strings?",
   a:`A fixed, named set of options — type-safe constants. Because the full list is known, a <code>when</code> over it can cover every case with compiler help, and you can't invent a value that doesn't exist.
<pre class="code">${hl(`enum class Direction { NORTH, SOUTH, EAST, WEST }`)}</pre>` },
 { topic:"Inner classes", q:"What does marking a nested class inner allow that a plain nested class can't?",
   a:`<code>inner</code> lets the class reach the <b>outer</b> class's properties. Without it, a nested class is only grouped inside and can't touch the outer instance's members.
<pre class="code">${hl(`class Outer {\n    private val msg = "hi"\n    inner class Inner { fun show() = println(msg) }\n}`)}</pre>` },
 { topic:"Inheritance", q:"What two keywords let a child class replace a parent's function?",
   a:`The parent marks the function <code>open</code>; the child marks its version <code>override</code>. The class itself must also be <code>open</code> to be extended.` },
 { topic:"Interfaces", q:"How is an interface different from a class you inherit from?",

(function(root){

const LONDON = {"LINES":[{"id":"setup","name":"The core setup","cat":"Foundation","intro":"The Modern (Accelerated) London: play Bf4 before Nf3. Same friendly structure against almost anything — build the pyramid, aim at the king.","moves":[["d4","Claim the centre. Everything starts here."],["d5","A classical reply; Black stakes the centre too."],["Bf4","The Modern move order — bishop OUT before e3, so it's never trapped behind the pawn."],["Nf6","Black develops naturally."],["e3","Now the pyramid begins: the bishop is already safe outside it."],["e6","Black frees the f8-bishop."],["Nf3","Second piece out, eyeing e5."],["Bd6","Black offers to trade the dark bishops."],["Bg3","Sidestep the trade — keep your good bishop, keep the tension."],["O-O","Black tucks the king away."],["Bd3","The battery bishop, pointing straight at h7."],["c5","Black strikes at d4."],["c3","Hold the centre with the pawn — don't take. The pyramid c3-d4-e3 is complete."],["Nc6","Black finishes developing."],["Nbd2","The last piece heads out, ready to reroute to f1-g3 or support Ne5. Setup done — now play chess."]]},{"id":"c5qb6","name":"vs ...c5 & ...Qb6","cat":"Critical test","intro":"Black's sharpest try: hit d4 with ...c5 and the b2 pawn with ...Qb6. The Modern move order lets you meet it cleanly.","moves":[["d4",""],["d5",""],["Bf4",""],["c5","Immediate central pressure before you build."],["e3","Calmly support d4."],["Qb6","The point — hitting b2, which your f4-bishop no longer guards."],["Nc3","The accelerated answer: develop AND defend the idea, since ...Qxb2 now runs into Nb5."],["Nc6","Black develops instead of grabbing (see the trap for why)."],["Nf3","Continue naturally."],["Nf6",""],["Bd3","Battery in place; you're fully mobilised with b2 intact."]]},{"id":"bf5","name":"vs ...Bf5","cat":"Equalising try","intro":"Black develops the light bishop outside the chain before ...e6 — the most respected way to neutralise the London. Trade it off.","moves":[["d4",""],["d5",""],["Bf4",""],["Nf6",""],["e3",""],["Bf5","Black's good bishop comes out first."],["Bd3","Offer the trade — your f4-bishop stays, his active bishop goes."],["Bxd3","If Black avoids it, you got a free tempo; here he trades."],["Qxd3","Recapture toward the centre; the queen eyes the kingside."],["e6",""],["Nf3",""],["Bd6",""],["Bg3","Keep the bishop; you have an easy, pleasant game with the h7 idea in reserve."]]},{"id":"g6","name":"vs ...g6 (King's Indian setup)","cat":"Fianchetto","intro":"Black fianchettoes King's-Indian style. Still just play the London — add h3 so ...Nh5 and ...Bg4 never bother your bishop.","moves":[["d4",""],["Nf6",""],["Bf4",""],["g6","Black heads for the fianchetto."],["e3",""],["Bg7","The bishop eyes your centre and queenside."],["h3","Essential here — stops ...Nh5 hitting the bishop and ...Bg4 pinning."],["O-O",""],["Nf3",""],["d6",""],["Be2","Modest but solid; c3, O-O and Nbd2 follow."],["c5",""],["c3","Hold firm. You have a comfortable, flexible position."]]},{"id":"slav","name":"vs ...c6 (Slav setup)","cat":"Solid","intro":"Black plays a Slav-like ...c6 and ...Bf5. A calm structural battle — you can even grab space with c4.","moves":[["d4",""],["d5",""],["Bf4",""],["c6","Solid, Slav-style."],["e3",""],["Bf5","The bishop comes out before ...e6 shuts it in."],["Nf3",""],["e6",""],["c4","Challenge the centre — you're not obliged to stay passive."],["Bd6",""],["Bg3","Keep your bishop."],["Nf6",""],["Nc3","A rich, slightly better structure for White."]]},{"id":"qgd","name":"vs ...e6 (QGD structure)","cat":"Solid","intro":"Black sets up a Queen's-Gambit-Declined wall with ...e6 and ...Be7. No trades offered — you calmly complete the setup and aim for the Ne5 attacking plan.","moves":[["d4",""],["d5",""],["Bf4",""],["Nf6",""],["e3",""],["e6",""],["Nf3",""],["Be7","Solid but passive — the bishop won't trade yours."],["Bd3",""],["O-O",""],["Nbd2",""],["c5",""],["c3",""],["Nc6",""],["Ne5","The thematic outpost. From here Qf3/Rf3-h3 and Bxh7 ideas loom."]]},{"id":"dutch","name":"vs ...f5 (Dutch)","cat":"Aggressive Black","intro":"Black grabs kingside space with ...f5 but loosens his king. Here you skip Bf4 (the pawn covers it) and point the Bd3 battery straight at the weakened light squares.","moves":[["d4",""],["f5","The Dutch — committal, and it weakens e6 and the king."],["Nf3",""],["Nf6",""],["e3",""],["e6",""],["Bd3","Battery on the b1-h7 diagonal, eyeing the holes ...f5 created."],["d5",""],["O-O",""],["Bd6",""],["b3","Prepare Bb2 and pressure on the long diagonal."],["O-O",""],["Bb2","A comfortable, slightly better game — the king on g8 is airy."]]},{"id":"oldindian","name":"vs ...d6 & ...e5 (Old Indian)","cat":"Indian","intro":"Black plays ...d6 and strikes with ...e5. Don't panic — keep your bishop with Bg3 and keep the tension; White stays comfortably better.","moves":[["d4",""],["Nf6",""],["Bf4",""],["d6",""],["Nf3","Discourage a free ...e5."],["Nbd7",""],["e3",""],["e5","The freeing break."],["Bg3","Sidestep — keep the good bishop, keep the tension."],["Be7",""],["h3","Luft and control of g4."],["O-O",""],["Be2","Calm and solid; White plays for c4 or e4 later."]]},{"id":"englund","name":"vs 1...e5 (Englund Gambit)","cat":"Gambit","intro":"Black's only forcing gambit vs 1.d4. Crucial: do NOT play Bf4 (the ...Qb4+ tricks are real). Accept the pawn and refute with the clean 4.Qd5.","moves":[["d4",""],["e5","The Englund — a pawn for fast development and cheap traps."],["dxe5","Take it."],["Nc6","Hitting e5..."],["Nf3","...defended."],["Qe7","Renewing the attack and eyeing ...Qb4+."],["Qd5","The refutation — defends e5, controls the centre, and kills the ...Qb4+ trick."],["f6",""],["exf6",""],["Nxf6","Attacking the d5-queen."],["Qd3","Retreat home a clean, healthy pawn up with the better position."]]},{"id":"b6qi","name":"vs ...b6 (Queen's Indian)","cat":"Indian","intro":"Black fianchettoes the light bishop to b7. Just develop naturally — the ...Ne4 jump is met by trading, and your kingside chances remain.","moves":[["d4",""],["Nf6",""],["Bf4",""],["b6",""],["e3",""],["Bb7",""],["Nf3",""],["e6",""],["Bd3","Battery vs h7, over the top of the b7-bishop's diagonal."],["Be7",""],["O-O",""],["O-O",""],["Nbd2","c3 and the usual plans follow; meet ...Ne4 with Nxe4."]]},{"id":"jobava","name":"The Jobava London (sharp)","cat":"Alternative weapon","intro":"The aggressive cousin: play Nc3 instead of c3, hit c7 with Nb5, and push e4 fast. A genuine try-to-win version of the London.","moves":[["d4",""],["Nf6",""],["Nc3","The Jobava move order."],["d5",""],["Bf4",""],["e6",""],["Nb5","Immediately questioning c7."],["Na6","Covering c7."],["e3",""],["c6",""],["Nc3","Reroute; White will aim for a quick e4 and a space edge."]]},{"id":"c5main","name":"vs ...c5 mainline","cat":"Most common","intro":"The everyday ...c5 structure without the ...Qb6 sortie — what you'll meet most often. Build the pyramid, keep the bishop, aim for Ne5.","moves":[["d4",""],["d5",""],["Bf4",""],["c5",""],["e3",""],["Nc6",""],["Nf3",""],["Nf6",""],["c3","Hold the centre — don't release the tension."],["e6",""],["Nbd2",""],["Bd6",""],["Bg3","Keep your good bishop."],["O-O",""],["Bd3","Fully set up, battery live. A pleasant London."]]},{"id":"grunfeld","name":"vs ...g6 with ...d5 (Grünfeld)","cat":"Fianchetto","intro":"Black fianchettoes and strikes with ...d5 rather than ...d6. Same London plan — h3 first, then finish developing behind the solid centre.","moves":[["d4",""],["Nf6",""],["Bf4",""],["g6",""],["e3",""],["Bg7",""],["h3","Stop ...Nh5/...Bg4."],["O-O",""],["Nf3",""],["d5","Grünfeld-style, hitting the centre."],["Be2",""],["c5",""],["c3","Solid and flexible; you can break with e4 later."]]},{"id":"bg4","name":"vs ...Bg4 pin","cat":"Common","intro":"Black pins your f3-knight with ...Bg4. The clean answer is Qb3 — it hits b7 and d5 and unpins in one move.","moves":[["d4",""],["d5",""],["Bf4",""],["Nf6",""],["e3",""],["c5",""],["Nf3",""],["Nc6",""],["c3",""],["Bg4","The pin."],["Qb3","The refutation of the pin — attacking b7 and d5 at once."],["Qd7","Forced to defend b7."],["Nbd2",""],["e6",""],["Be2","You broke the pin and stand comfortably."]]},{"id":"cxd4early","name":"Punish: early ...cxd4","cat":"Inaccuracy","intro":"Black releases the central tension too soon with ...cxd4. This just helps you — you recapture, your bishop is already out, and development is free and easy.","moves":[["d4",""],["d5",""],["Bf4",""],["c5",""],["e3",""],["cxd4","Premature — giving up the tension hands White a comfortable, open game."],["exd4","Recapture toward the centre. The e-file half-opens for you."],["Nc6",""],["Nf3",""],["Nf6",""],["c3","Your f4-bishop is already developed — you're effectively a tempo up on a normal structure. Easy edge."]]},{"id":"bxg3","name":"Punish: ...Bxg3 (open h-file)","cat":"Inaccuracy","intro":"When Black trades the dark bishops with ...Bxg3, recapture with the h-pawn — you get an open h-file pointing straight at Black's king.","moves":[["d4",""],["d5",""],["Bf4",""],["Nf6",""],["e3",""],["e6",""],["Nf3",""],["Bd6",""],["Bg3","Offer to keep the tension."],["O-O",""],["Bd3",""],["Bxg3","Trading — but this opens a file for you."],["hxg3","Recapture toward the centre. The h-file is now yours; Rh-file plus Qc2/Ne5 make a real attack."]]},{"id":"ne4early","name":"Punish: early ...Ne4","cat":"Inaccuracy","intro":"Black lunges ...Ne4 before it's supported. Simply challenge it — the knight has no backup, so trading leaves you better developed.","moves":[["d4",""],["d5",""],["Bf4",""],["Nf6",""],["e3",""],["e6",""],["Nf3",""],["Ne4","Premature — the knight isn't supported by ...f5 or ...d5-chain here."],["Nbd2","Challenge it at once."],["Nxd2","Black trades off his only active piece..."],["Qxd2","...and you're comfortably ahead in development with the easier game."]]},{"id":"f6weak","name":"Punish: ...f6 weakening","cat":"Inaccuracy","intro":"Black plays ...f6 to stop your Ne5, but it weakens e6 and the king. Open a second front with c4 and target the soft squares.","moves":[["d4",""],["d5",""],["Bf4",""],["e6",""],["Nf3",""],["Bd6",""],["Bg3",""],["Ne7","Black develops the knight to e7, keeping ...f6 available."],["e3",""],["f6","Stops Ne5 — but weakens e6, g6 and the king."],["c4","Strike the centre while Black is loosened."],["c6",""],["Nc3","You have a clear structural target and the safer king."]]}],"TRAPS":[{"id":"greek","name":"The Greek Gift (Bxh7+)","famous":true,"intro":"The London attacking dream. When Black lets you trade off the e5 knight and his f6-knight leaves h7 undefended, the bishop sacrifice detonates.","moves":[["d4",""],["d5",""],["Bf4",""],["c5",""],["c3",""],["Nc6",""],["e3",""],["Nf6",""],["Nf3",""],["e6",""],["Nbd2",""],["Bd6",""],["Ne5","The thematic outpost, hitting toward the king."],["O-O","Black castles into it."],["Bd3","Battery loaded on the b1-h7 diagonal."],["Bxe5","Black trades the strong knight..."],["dxe5","...and you recapture toward the centre, kicking the f6-knight."],["Nd7","The knight retreats — and h7 is now undefended."],["Nf3",""],["Qc7",""],["Bxh7+","Boom. The classic sacrifice."],["Kxh7","Forced."],["Ng5+","Check, and the queen is coming."],["Kg8",""],["Qh5","Threatening Qh7# / Qxf7+. Black is lost — a winning attack."]],"result":"White has a decisive attack (Qh7# threatened)."},{"id":"f4attack","name":"The ...Nd7 blunder (f4 + Bxh7)","famous":true,"intro":"With the knight planted on e5 and f4 played, the natural-looking ...Nd7 walks into a forced king hunt. One of the most reliable London knockouts.","moves":[["d4",""],["Nf6",""],["Bf4",""],["e6",""],["c3",""],["c5",""],["e3",""],["d5",""],["Nd2",""],["Nc6",""],["Ngf3",""],["Bd6",""],["Bg3",""],["O-O",""],["Bd3","Battery ready."],["Re8","Black prepares ...e5."],["Ne5","The outpost, deep in Black's position."],["Qc7",""],["f4","Reinforce e5 and open attacking lines."],["Nd7","The blunder — challenging e5 but abandoning h7."],["Bxh7+","The thematic strike."],["Kxh7","Forced."],["Qh5+","The queen joins with check."],["Kg8",""],["Qxf7+","Snatching a pawn with check and driving the king."],["Kh7",""],["Qh5+","Repeat to reset..."],["Kg8",""],["Qxe8+","...then win the rook with a decisive material edge."]],"result":"White wins the exchange with a crushing attack (Qxe8+)."},{"id":"ba6","name":"The Qa4 + Ba6 skewer (less known)","famous":false,"intro":"A quieter but deadly trap: after Black pins with ...Bg4, White unpins with Qa4 and, if Black develops naturally, Ba6! wins material outright.","moves":[["d4",""],["d5",""],["Bf4",""],["Nf6",""],["e3",""],["c5",""],["c3",""],["Nc6",""],["Nf3",""],["Bg4","Black pins the f3-knight."],["Nbd2","Develop and prepare to break the pin."],["e6",""],["Qa4","Unpinning — and now the queen pins Black's c6-knight to the b7 pawn."],["Bd6","The natural move — but a blunder."],["Ba6","The point: hitting b7, which is pinned and can't be defended."],["O-O","If 8...bxa6 9.Qxc6+ wins; so Black castles and gives up the pawn."],["Bxb7","Grabbing b7 and attacking the a8-rook."],["Bxf4",""],["Bxc6","Winning material — Black's rook and pieces are hanging."]],"result":"White emerges a clear pawn up with the better position."},{"id":"qb6trap","name":"The b2 poison (queen trap)","famous":true,"intro":"When Black greedily grabs b2 with the queen, Nb5 springs a net — the knight threatens a fork on c7 and the queen runs out of squares.","moves":[["d4",""],["d5",""],["Bf4",""],["c5",""],["e3",""],["Qb6","Hitting b2..."],["Nc3","Offered as bait — develop and dare the capture."],["Qxb2","Black takes the poison."],["Nb5","The trap: threatening Nc7+ forking king and rook."],["Na6","Covering c7 — the only try."],["Rb1","Kicking the queen while eyeing b7."],["Qxa2",""],["Ra1","Chasing again."],["Qb2",""],["Rxa6","Removing the c7 guard..."],["bxa6",""],["Nc7+","The fork lands — king and a8-rook."]],"result":"White forks with Nc7+, wins the exchange, and Black's queen is still stranded."},{"id":"bh6plan","name":"The Bh6 dark-square attack (plan)","famous":false,"intro":"Not a forced trap but a crushing plan vs the fianchetto: trade off Black's g7 bishop with Bh6, then pile onto the dark squares around his king.","moves":[["d4",""],["Nf6",""],["Bf4",""],["g6",""],["Nf3",""],["Bg7",""],["e3",""],["O-O",""],["Be2",""],["d6",""],["h3",""],["Nbd7",""],["O-O",""],["Re8",""],["Bh6","Offer to trade Black's best defender — the g7-bishop."],["Bh8","Black dodges the trade..."],["Qd2","...but you build up: Qd2, then Ne5, g4, and the dark squares crack."]],"result":"White gets a dangerous, long-lasting attack on the dark squares."}]};

ianchettos too, aiming for a calm, positional game. The pure race is muted here — develop soundly, play ...e5, and manoeuvre.","moves":[["d4",""],["Nf6",""],["c4",""],["g6",""],["g3","White heads for a quiet fianchetto."],["Bg7",""],["Bg2",""],["O-O",""],["Nc3",""],["d6",""],["Nf3",""],["Nbd7","Flexible — supports the ...e5 break."],["O-O",""],["e5","The break; a sound, balanced middlegame."],["e4",""],["c6","Solid; prepare ...Qb6 or ...exd4 with a good game."]]},{"id":"averbakh","name":"Averbakh (6.Bg5)","cat":"Tricky","intro":"White pins with an early Bg5 to discourage ...e5. Develop with ...Na6, then break with ...e5 anyway once you're ready.","moves":[["d4",""],["Nf6",""],["c4",""],["g6",""],["Nc3",""],["Bg7",""],["e4",""],["d6",""],["Be2",""],["O-O",""],["Bg5","The Averbakh pin, eyeing ...e5."],["Na6","Flexible development, heading for c5 or c7."],["Qd2",""],["e5","Break anyway — it's well prepared now."],["d5",""],["Qe8","Reroute the queen; prepare ...Nd7 and ...f5 with kingside play."]]}],"TRAPS":[{"id":"storm","name":"The kingside avalanche (model)","famous":true,"intro":"The King's Indian dream. In the locked centre you throw the kingside pawns forward and open lines at White's king faster than he cracks your queenside.","moves":[["d4",""],["Nf6",""],["c4",""],["g6",""],["Nc3",""],["Bg7",""],["e4",""],["d6",""],["Nf3",""],["O-O",""],["Be2",""],["e5",""],["O-O",""],["Nc6",""],["d5",""],["Ne7",""],["Ne1",""],["Nd7",""],["Be3",""],["f5",""],["f3",""],["f4","Lock and gain space."],["Bf2",""],["g5","The pawns roll."],["Nd3",""],["Ng6","Support ...f4 and eye the h4/e3 squares."],["c5",""],["Rf7","Prepare to swing the rook and play ...Bf8, ...g4."],["Rc1",""],["Bf8","Regroup the bishop to defend d6 and free the g7 square."],["cxd6",""],["cxd6",""],["g4","The break; lines rip open toward White's king."]],"result":"Black's kingside storm is faster — a textbook King's Indian attack."},{"id":"refute","name":"Punish 9.Nxe5?","famous":false,"intro":"In the exchange line /* ================= London Trainer ================= */
const $=(s,r=document)=>r.querySelector(s);
const el=(t,c)=>{const e=document.createElement(t);if(c)e.className=c;return e;};
const FILES=["a","b","c","d","e","f","g","h"];

let game=new Chess();
let state={ opening:"london", pc:"w", oc:"b", set:"lines", item:null, ply:0, mode:"learn", sel:null, suppressClick:false };
const OPENINGS={ london:{ data:LONDON, pc:"w" }, kid:{ data:KID, pc:"b" } };
function curData(){ return OPENINGS[state.opening].data; }
function curList(set){ const d=curData(); return set==="traps" ? d.TRAPS : d.LINES; }

/* ---------- line progress · mastery ---------- */
const MASTER_AT=10, MASTER_DAYS=3;
function progAll(){ return store.get("chess_prog",{}); }
function progKey(id,set){ return state.opening+"/"+(set||state.set)+"/"+id; }
function getProg(id,set){ const p=progAll()[progKey(id,set)]; const base={prac:0,seen:false,best:false,days:[],last:null}; return p ? Object.assign(base,p) : base; }
function saveProg(id,set,obj){ const all=progAll(); all[progKey(id,set)]=obj; store.set("chess_prog",all); }
function markSeen(id,set){ const p=getProg(id,set); if(!p.seen){ p.seen=true; saveProg(id,set,p); paintChips(); } }
function isMastered(id,set){ const p=getProg(id,set); return p.prac>=MASTER_AT && (p.days||[]).length>=MASTER_DAYS; }
function masteryCount(){ const lines=curData().LINES||[]; let m=0; lines.forEach(l=>{ if(isMastered(l.id,"lines")) m++; }); return {m,t:lines.length}; }
function nextUnmastered(){ const lines=curData().LINES||[]; return lines.find(l=>l.id!==state.item.id && !isMastered(l.id,"lines")) || null; }
function celebrateMastery(){ const on=document.querySelector('#chipbar .chip.on'); if(on){ on.classList.remove("chip-cel"); void on.offsetWidth; on.classList.add("chip-cel"); setTimeout(()=>on.classList.remove("chip-cel"),1200); } try{ sCheck(); thock(520,0.12,0.12); }catch(e){} }
function paintMastery(){
  let box=$("#masterySummary");
  if(!box){ const cc=$("#chessOverlay .cb-controls"); if(!cc) return; box=el("div"); box.id="masterySummary"; box.className="mastery-sum"; cc.appendChild(box); }
  const r=masteryCount();
  box.innerHTML = r.t ? ('<span class="ms-lbl">Mastered</span><b>'+r.m+'</b> / '+r.t+' lines') : '';
  box.style.display = (state.set==="lines"&&r.t)?"flex":"none";
}
function scorePractice(){
  if(state.scored||state.set!=="lines") return;
  state.scored=true;
  const p=getProg(state.item.id,"lines"); const wasMastered=isMastered(state.item.id,"lines");
  p.prac=(p.prac||0)+1; p.seen=true;
  const dstr=(function(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");})();
  p.days=Array.isArray(p.days)?p.days:[]; if(p.days.indexOf(dstr)===-1) p.days.push(dstr); p.last=dstr;
  const clean=!(state.mistakes>0)&&!state.hinted; if(clean) p.best=true;
  saveProg(state.item.id,"lines",p);
  const nowMastered=isMastered(state.item.id,"lines"); paintChips();
  const remRuns=Math.max(0,MASTER_AT-p.prac), remDays=Math.max(0,MASTER_DAYS-p.days.length);
  const nx=nextUnmastered(); let msg;
  if(nowMastered&&!wasMastered){
    msg='<span class="a-move ok">✦ Mastered</span>Ten runs across '+p.days.length+' separate days — <b>'+shortChessName(state.item.name)+'</b> is yours now.'; celebrateMastery();
  } else {
    let need;
    if(remRuns>0&&remDays>0) need='<b>'+remRuns+'</b> more run'+(remRuns===1?'':'s')+' and <b>'+remDays+'</b> more day'+(remDays===1?'':'s');
    else if(remRuns>0) need='<b>'+remRuns+'</b> more clean run'+(remRuns===1?'':'s');
    else need='a run on <b>'+remDays+'</b> more day'+(remDays===1?'':'s')+' — come back tomorrow';
    msg='<span class="a-move ok">Done</span>Run <b>'+p.prac+'</b>/'+MASTER_AT+' · day <b>'+p.days.length+'</b>/'+MASTER_DAYS+(clean?' · clean ✦':'')+'. '+need+' to master it.';
  }
  if(nx) msg+=' <button class="nextline-btn" data-id="'+nx.id+'">Next line ❯</button>';
  $("#annot").innerHTML=msg;
  const nb=$("#annot .nextline-btn"); if(nb) nb.addEventListener("click",()=>{ state.mode="practice"; loadItem("lines",nb.dataset.id); });
}

/* ---------- sound (wooden "click/thock", chess.com-style) ---------- */
let audioCtx=null, muted=false;
function actx(){ if(!audioCtx){ try{ audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return audioCtx; }
function click(dur,cut,vol,ftype){ if(muted)return; try{ const c=actx(); if(!c)return;
  const n=Math.max(1,Math.floor(c.sampleRate*dur)); const buf=c.createBuffer(1,n,c.sampleRate); const d=buf.getChannelData(0);
  for(let i=0;i<n;i++){ d[i]=(Math.random()*2-1)*(1-i/n); }
  const src=c.createBufferSource(); src.buffer=buf;
  const filt=c.createBiquadFilter(); filt.type=ftype||"lowpass"; filt.frequency.value=cut; filt.Q.value=0.9;
  const g=c.createGain(); const t=c.currentTime;
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  src.connect(filt); filt.connect(g); g.connect(c.destination); src.start(t); src.stop(t+dur+0.02);
}catch(e){} }
function thock(freq,dur,vol,type){ if(muted)return; try{ const c=actx(); if(!c)return;
  const o=c.createOscillator(),g=c.createGain(); o.type=type||"sine"; o.frequency.setValueAtTime(freq,c.currentTime);
  o.frequency.exponentialRampToValueAtTime(freq*0.6,c.currentTime+dur);
  o.connect(g); g.connect(c.destination); const t=c.currentTime;
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.start(t); o.stop(t+dur+0.02);
}catch(e){} }
function sMove(){ click(0.045,2200,0.32,"lowpass"); thock(240,0.07,0.16); }
function sCapture(){ click(0.06,3600,0.42,"lowpass"); thock(150,0.10,0.20); }
function sCheck(){ click(0.05,3000,0.30); thock(300,0.09,0.14); thock(600,0.08,0.10); }
function soundSan(san){ if(!san)return; if(san.includes("#")||san.includes("+"))sCheck(); else if(san.includes("x"))sCapture(); else sMove(); }

/* ---------- board DOM ---------- */
function buildBoardDOM(){
  const board=$("#board"); board.innerHTML="";
  for(let r=7;r>=0;r--){ for(let f=0;f<8;f++){
    const sq=el("div","sq "+(((r+f)%2===0)?"dark":"light"));
    const name=FILES[f]+(r+1); sq.dataset.sq=name;
    if(f===0){ const rk=el("span","co rank"); rk.textContent=(r+1); sq.append(rk); }
    if(r===0){ const fl=el("span","co file"); fl.textContent=FILES[f]; sq.append(fl); }
    sq.addEventListener("click",()=>onSquare(name));
    sq.addEventListener("pointerdown",onPointerDown);
    board.append(sq);
  }}
}
function applyOrient(){ const b=$("#board"); if(b) b.classList.toggle("flip", state.pc==="b"); }

/* ---------- render ---------- */
function render(lf,lt){
  const b=game.board();
  document.querySelectorAll(".sq").forEach(sq=>{
    sq.querySelectorAll(".pc,.dot,.cap").forEach(n=>n.remove());
    sq.classList.remove("last","selq","check");
  });
  for(let r=0;r<8;r++)for(let f=0;f<8;f++){
    const cell=b[r][f]; if(!cell) continue;
    const name=FILES[f]+(8-r);
    const sq=document.querySelector('.sq[data-sq="'+name+'"]');
    const pc=el("div","pc"); pc.innerHTML=PIECES[cell.color+cell.type.toUpperCase()];
    sq.append(pc);
  }
  if(lf) document.querySelector('.sq[data-sq="'+lf+'"]').classList.add("last");
  if(lt) document.querySelector('.sq[data-sq="'+lt+'"]').classList.add("last");
  if(game.inCheck&&game.inCheck()){
    const turn=game.turn(), bd=game.board();
    for(let r=0;r<8;r++)for(let f=0;f<8;f++){const c=bd[r][f]; if(c&&c.type==="k"&&c.color===turn) document.querySelector('.sq[data-sq="'+FILES[f]+(8-r)+'"]').classList.add("check");}
  }
}
function replayTo(ply){
  game=new Chess(); let lf=null,lt=null;
  for(let i=0;i<ply;i++){ const m=game.move(state.item.moves[i][0]); if(m){lf=m.from;lt=m.to;} }
  render(lf,lt); paintAnnotation();
}
function lastMoveSquares(){
  if(state.ply===0) return [null,null];
  const t=new Chess(); let lf=null,lt=null;
  for(let i=0;i<state.ply;i++){ const m=t.move(state.item.moves[i][0]); if(m){lf=m.from;lt=m.to;} }
  return [lf,lt];
}

/* ---------- annotation ---------- */
function paintAnnotation(){
  const a=$("#annot");
  if(state.ply===0){ a.innerHTML='<span class="a-move">Start</span>'+state.item.intro; return; }
  const m=state.item.moves[state.ply-1], num=Math.ceil(state.ply/2), dots=(state.ply%2===1)?".":"...";
  a.innerHTML='<span class="a-move">'+num+dots+" "+m[0]+"</span>"+(m[1]||"");
}

/* ---------- nav ---------- */
function gotoPly(p){ state.ply=Math.max(0,Math.min(state.item.moves.length,p)); replayTo(state.ply); updateFoot(); }
function next(){ if(state.ply<state.item.moves.length){ const san=state.item.moves[state.ply][0]; gotoPly(state.ply+1); soundSan(san); } }
function back(){ if(state.ply>0){ gotoPly(state.ply-1); sMove(); } }
function updateFoot(){
  $("#plyLabel").textContent="move "+state.ply+" / "+state.item.moves.length;
  const done=state.ply>=state.item.moves.length;
  $("#result").style.display=(done&&state.item.result)?"block":"none";
  if(done&&state.item.result) $("#result").textContent=state.item.result;
  if(done&&state.mode==="learn"&&state.item&&state.item.id) markSeen(state.item.id,state.set);
}

/* ---------- practice (player = state.pc, opponent = state.oc) ---------- */
function startPractice(){
  state.mode="practice"; state.ply=0; state.sel=null; state.scored=false; state.mistakes=0; state.hinted=false; replayTo(0); updateFoot();
  const who = state.pc==="w" ? "White" : "Black";
  $("#annot").innerHTML='<span class="a-move">Practise</span>Play '+who+'’s moves — drag a piece or tap from/to. The opponent replies automatically. A wrong move won’t be accepted — try again, or use Hint.';
  maybeAutoOpp();
}
function maybeAutoOpp(){
  if(state.ply<state.item.moves.length && game.turn()===state.oc){
    setTimeout(()=>{ if(state.mode!=="practice")return; const san=state.item.moves[state.ply][0]; const m=game.move(san); if(!m)return; state.ply++;
      render(m.from,m.to); updateFoot(); soundSan(san); checkPracticeEnd(); },320);
  }
}
function checkPracticeEnd(){ if(state.ply>=state.item.moves.length) scorePractice(); }
function onSquare(name){
  if(state.suppressClick) return;
  if(state.mode!=="practice"||state.ply>=state.item.moves.length||game.turn()!==state.pc) return;
  const piece=game.get(name);
  if(state.sel===null){ if(piece&&piece.color===state.pc){ state.sel=name; showDots(name); } return; }
  if(name===state.sel){ state.sel=null; const [lf,lt]=lastMoveSquares(); render(lf,lt); return; }
  if(piece&&piece.color===state.pc){ state.sel=name; showDots(name); return; }
  attemptMove(state.sel,name);
}
function showDots(from){
  const [lf,lt]=lastMoveSquares(); render(lf,lt);
  document.querySelector('.sq[data-sq="'+from+'"]').classList.add("selq");
  game.moves({square:from,verbose:true}).forEach(m=>{ const sq=document.querySelector('.sq[data-sq="'+m.to+'"]'); sq.append(el("span",m.captured?"cap":"dot")); });
}
function attemptMove(from,to){
  const expected=state.item.moves[state.ply][0];
  const t1=new Chess(game.fen()); let exp; try{exp=t1.move(expected);}catch(e){exp=null;}
  const pc=game.get(from);
  const promo=(pc&&pc.type==="p"&&(to[1]==="8"||to[1]==="1"))?"q":undefined;
  const t2=new Chess(game.fen()); let user; try{user=t2.move({from,to,promotion:promo});}catch(e){user=null;}
  if(user&&exp&&user.from===exp.from&&user.to===exp.to){
    const m=game.move({from,to,promotion:promo}); state.ply++; state.sel=null;
    render(m.from,m.to); updateFoot(); soundSan(expected);
    $("#annot").innerHTML='<span class="a-move ok">✓ '+expected+"</span>"+(state.item.moves[state.ply-1][1]||"Correct.");
    maybeAutoOpp(); checkPracticeEnd();
  } else {
    state.mistakes=(state.mistakes||0)+1;
    state.sel=null; const [lf,lt]=lastMoveSquares(); render(lf,lt); flashWrong(to);
    $("#annot").innerHTML='<span class="a-move bad">Not the move</span>That’s not the repertoire move here. Try again, or press Hint.';
  }
}
function flashWrong(sq){ const s=document.querySelector('.sq[data-sq="'+sq+'"]'); if(!s)return; s.classList.add("wrong"); setTimeout(()=>s.classList.remove("wrong"),400); }
function hint(){
  if(state.mode!=="practice"||state.ply>=state.item.moves.length) return;
  state.hinted=true;
  const expected=state.item.moves[state.ply][0]; const t=new Chess(game.fen()); let exp; try{exp=t.move(expected);}catch(e){return;}
  const [lf,lt]=lastMoveSquares(); render(lf,lt);
  document.querySelector('.sq[data-sq="'+exp.from+'"]').classList.add("selq");
  document.querySelector('.sq[data-sq="'+exp.to+'"]').append(el("span","dot hint"));
  $("#annot").innerHTML='<span class="a-move">Hint</span>Move the highlighted piece to the marked square ('+expected+").";
}

/* ---------- drag ---------- */
function onPointerDown(e){
  if(state.mode!=="practice"||state.ply>=state.item.moves.length||game.turn()!==state.pc) return;
  const sqEl=e.target.closest(".sq"); if(!sqEl) return;
  const from=sqEl.dataset.sq, p=game.get(from);
  if(!p||p.color!==state.pc) return;
  e.preventDefault();
  state.sel=from; showDots(from);
  const rect=sqEl.getBoundingClientRect(), size=rect.width;
  let ghost=null, dragging=false;
  const orig=sqEl.querySelector(".pc");
  const startX=e.clientX, startY=e.clientY;
  function mv(ev){
    const x=ev.clientX, y=ev.clientY;
    if(!dragging && Math.hypot(x-startX,y-startY)>5){
      dragging=true;
      ghost=el("div","drag-ghost"); ghost.innerHTML=PIECES[state.pc+p.type.toUpperCase()];
      ghost.style.width=ghost.style.height=size+"px"; document.body.append(ghost);
      if(orig) orig.style.opacity="0";
    }
    if(dragging){ ghost.style.left=(x-size/2)+"px"; ghost.style.top=(y-size/2)+"px"; }
  }
  function up(ev){
    document.removeEventListener("pointermove",mv); document.removeEventListener("pointerup",up);
    if(ghost) ghost.remove(); if(orig) orig.style.opacity="";
    if(dragging){
      const t=document.elementFromPoint(ev.clientX,ev.clientY), tsq=t&&t.closest(".sq");
      if(tsq&&tsq.dataset.sq!==from){ attemptMove(from,tsq.dataset.sq); }
      else { state.sel=null; const [lf,lt]=lastMoveSquares(); render(lf,lt); }
      state.suppressClick=true; setTimeout(function(){state.suppressClick=false;},0);
    }
  }
  document.addEventListener("pointermove",mv); document.addEventListener("pointerup",up);
}

/* ---------- selectors / mode ---------- */
function loadItem(set,id){
  state.set=set; state.item=curList(set).find(x=>x.id===id) || curList(set)[0];
  state.ply=0; state.sel=null;
  if(set==="traps") state.mode="learn";
  paintChips();
  $("#modeRow").style.display=(set==="lines")?"flex":"none";
  if(state.mode==="practice"&&set==="lines"){ startPractice(); }
  else { state.mode="learn"; replayTo(0); updateFoot();
    $("#annot").innerHTML='<span class="a-move">'+(set==="traps"?"Trap":"Line")+"</span>"+state.item.intro; }
  paintModeBtns();
}
function shortChessName(n){
  if(/^vs\s+/i.test(n)){
    const m=n.match(/\(([^)]+)\)\s*$/);
    if(m) return m[1];
    return n.replace(/^vs\s+/i,"");
  }
  return n;
}
function paintChips(){
  const wrap=$("#chipbar"); wrap.innerHTML="";
  curList(state.set).forEach(it=>{
    const c=el("button","chip"+(state.item&&state.item.id===it.id?" on":""));
    const tag=it.cat?it.cat:(it.famous===false?"less known":"famous");
    let badge="";
    if(state.set==="lines"){
      const pr=getProg(it.id,"lines"); const dcount=(pr.days||[]).length; const mastered=isMastered(it.id,"lines");
      if(mastered){ badge='<span class="chip-badge mastered" title="Mastered · '+pr.prac+' runs over '+dcount+' days">✦</span>'; c.classList.add("is-mastered"); }
      else if(pr.prac>0){ const frac=Math.min(1,(pr.prac/MASTER_AT + dcount/MASTER_DAYS)/2); badge='<span class="chip-badge" title="'+pr.prac+'/'+MASTER_AT+' runs · '+dcount+'/'+MASTER_DAYS+' days'+(pr.last?' · last '+pr.last:'')+'"><i style="width:'+Math.round(frac*100)+'%"></i></span>'; }
      else if(pr.seen) badge='<span class="chip-badge seen" title="Learned">•</span>';
    }
    c.innerHTML='<span class="chip-t">'+shortChessName(it.name)+'</span><span class="chip-side">'+badge+'<span class="chip-c">'+tag+'</span></span>';
    c.addEventListener("click",()=>loadItem(state.set,it.id)); wrap.append(c);
  });
  paintMastery();
}
function paintSetBtns(){ document.querySelectorAll("#chessOverlay .setbtn").forEach(b=>b.classList.toggle("on",b.dataset.set===state.set)); }
function paintOpenBtns(){ document.querySelectorAll("#chessOverlay .openbtn").forEach(b=>b.classList.toggle("on",b.dataset.open===state.opening)); }
function paintModeBtns(){
  $("#mLearn").classList.toggle("on",state.mode==="learn");
  $("#mPractice").classList.toggle("on",state.mode==="practice");
  $("#navRow").style.display=(state.mode==="learn")?"flex":"none";
  $("#pracRow").style.display=(state.mode==="practice")?"flex":"none";
}
function setOpening(op){
  if(!OPENINGS[op]||op===state.opening) return;
  state.opening=op; state.pc=OPENINGS[op].pc; state.oc=(state.pc==="w"?"b":"w");
  state.set="lines"; state.mode="learn"; applyOrient(); paintOpenBtns(); paintSetBtns();
  loadItem("lines", curList("lines")[0].id);
}
function setSet(set){ state.set=set; paintSetBtns(); loadItem(set, curList(set)[0].id); }

/* ---------- Elo / week tracker ---------- */
function renderTracker(){
  const elo=store.get("chess_elo",500), pct=Math.max(0,Math.min(100,Math.round((elo-500)/700*100)));
  const ei=$("#tkElo"); if(ei && document.activeElement!==ei) ei.value=elo;
  const tp=$("#tkPct"); if(tp) tp.style.width=pct+"%";
  const wc=$("#tkWk"); if(wc) wc.textContent=weekCount();
  const wt=$("#tkWkT"); if(wt) wt.textContent=weekTarget();
}
function refreshCards(){ if(typeof updateCards==="function") updateCards(); else if(window.updateCards) window.updateCards(); }
function wireTracker(){
  const ei=$("#tkElo");
  if(ei) ei.addEventListener("change",()=>{ const v=parseInt(ei.value,10); if(!isNaN(v)){ store.set("chess_elo",Math.max(0,Math.min(3000,v))); renderTracker(); refreshCards(); } });
  const g=$("#tkGame"); if(g) g.addEventListener("click",()=>{ setWeekCount(weekCount()+1); renderTracker(); refreshCards(); });
  const r=$("#tkReset"); if(r) r.addEventListener("click",()=>{ setWeekCount(0); renderTracker(); refreshCards(); });
}

/* ---------- init / open / close ---------- */
function initTrainer(){
  buildBoardDOM(); applyOrient(); paintOpenBtns(); paintSetBtns(); paintChips();
  loadItem("lines", curList("lines")[0].id);
  $("#btnNext").addEventListener("click",next);
  $("#btnBack").addEventListener("click",back);
  $("#btnStart").addEventListener("click",()=>gotoPly(0));
  $("#btnEnd").addEventListener("click",()=>gotoPly(state.item.moves.length));
  $("#mLearn").addEventListener("click",()=>{ state.mode="learn"; replayTo(state.ply); updateFoot(); paintModeBtns(); $("#annot").innerHTML='<span class="a-move">'+(state.set==="traps"?"Trap":"Line")+"</span>"+state.item.intro; });
  $("#mPractice").addEventListener("click",()=>{ startPractice(); paintModeBtns(); });
  $("#btnHint").addEventListener("click",hint);
  $("#btnResetP").addEventListener("click",startPractice);
  document.querySelectorAll("#chessOverlay .openbtn").forEach(b=>b.addEventListener("click",()=>setOpening(b.dataset.open)));
  document.querySelectorAll("#chessOverlay .setbtn").forEach(b=>b.addEventListener("click",()=>setSet(b.dataset.set)));
  $("#muteBtn").addEventListener("click",()=>{ muted=!muted; $("#muteBtn").classList.toggle("off",muted); $("#muteBtn").title=muted?"Sound off":"Sound on"; if(!muted) sMove(); });
  wireTracker(); renderTracker();
  document.addEventListener("keydown",e=>{ if(!$("#chessOverlay").classList.contains("show")||state.mode!=="learn")return; if(e.key==="ArrowRight"){e.preventDefault();next();} if(e.key==="ArrowLeft"){e.preventDefault();back();} });
}
function openTrainer(){ $("#chessOverlay").classList.add("show"); document.body.style.overflow="hidden"; actx(); if(!window._trInit){ initTrainer(); window._trInit=true; } renderTracker(); }
function closeTrainer(){ $("#chessOverlay").classList.remove("show"); document.body.style.overflow=""; }

window.ChessTrainer = { open: openTrainer, close: closeTrainer, init: initTrainer, line:function(id){ try{ openTrainer(); state.mode="practice"; loadItem("lines",id); }catch(e){} } };
try{ window.CHESS_LINES={ london:(OPENINGS.london.data.LINES||[]).map(function(l){return {id:l.id,name:l.name};}), kid:(OPENINGS.kid.data.LINES||[]).map(function(l){return {id:l.id,name:l.name};}) }; }catch(e){}
(function(){
  var cb=$("#closeBtn"); if(cb) cb.addEventListener("click",closeTrainer);
  var ov=$("#chessOverlay"); if(ov) ov.addEventListener("click",function(e){ if(e.target===ov) closeTrainer(); });
  document.addEventListener("keydown",function(e){ if(e.key==="Escape"&&$("#chessOverlay")&&$("#chessOverlay").classList.contains("show")) closeTrainer(); });
})();

})();

<!-- study-os logic: greeting, bento cards, modals, chess wiring, polish -->
<script>

const $ = (s,r=document)=>r.querySelector(s);

const CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
const CUE = 'Open <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M8 7h9v9"/></svg>';
const UNDO_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M3.5 13a9 9 0 1 0 2-9.3L3 7"/></svg>';

/* ---------- witty, time-aware greeting (rolled once per load) ---------- */
const NAME = '<span class="accent">Gosolku<span class="firenze"> da Firenze</span></span>';
function greetingText(){
  const h = new Date().getHours(); let pool;
  if(h<5)        pool=[`The small hours, ${NAME}.`, `Still at the lamp, ${NAME}.`, `Burning it late, ${NAME}.`];
  else if(h<7)   pool=[`Before the dawn, ${NAME}.`, `Fajr light, ${NAME}.`, `An early beginning, ${NAME}.`];
  else if(h<12)  pool=[`Good morning, ${NAME}.`, `A fresh page, ${NAME}.`, `The morning is yours, ${NAME}.`];
  else if(h<17)  pool=[`Good afternoon, ${NAME}.`, `At your desk, ${NAME}.`, `The afternoon holds, ${NAME}.`];
  else if(h<21)  pool=[`Good evening, ${NAME}.`, `The evening hours, ${NAME}.`, `Prime hours, ${NAME}.`];
  else           pool=[`Winding down, ${NAME}.`, `A composed close, ${NAME}.`, `The day yields, ${NAME}.`];

}
$("#greeting").innerHTML = greetingText();

}
clock(); setInterval(clock, 20000);

/* ---------- constants + helpers ---------- */
const COURSE_TOTAL_H = 60;

const G = {
 course:'<svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 5h13a3 3 0 0 1 3 3v11a2.5 2.5 0 0 0-2.5-2.5H3z"/><path d="M21 5H8a3 3 0 0 0-3 3"/></svg>',
 physique:'<svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 8v8M18 8v8M4 10v4M20 10v4M6 12h12"/></svg>',
 quran:'<svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 5c-2-1.5-5-1.5-7 0v13c2-1.5 5-1.5 7 0 2-1.5 5-1.5 7 0V5c-2-1.5-5-1.5-7 0z"/><path d="M12 5v14"/></svg>',
 school:'<svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 9l9-4 9 4-9 4-9-4z"/><path d="M7 11v4c0 1 2 2.5 5 2.5S17 16 17 15v-4"/></svg>',
 chess:'<svg class="glyph" viewBox="0 0 24 24"><text x="12" y="19" text-anchor="middle" font-size="21" fill="currentColor">♞</text></svg>'
};

/* week helpers (auto-reset per ISO week) */
function weekKey(){ const d=new Date(), j=new Date(d.getFullYear(),0,1);
  const wk=Math.ceil((((d-j)/86400000)+j.getDay()+1)/7); return d.getFullYear()+"-w"+wk; }
function weekCount(){ const s=store.get("chess_week",{k:weekKey(),n:0}); return s.k===weekKey()?s.n:0; }
function setWeekCount(n){ store.set("chess_week",{k:weekKey(),n:Math.max(0,n)}); }
const weekTarget = ()=> store.get("chess_wk_target",15);

/* ---------- physique state helpers (shared by modal, cards, assistant) ---------- */
/* Daily/keystone items: done/skip ticks, reset with the day.
   Weekly items (skipping): a small count toward a weekly target, like chess games.
   A skipped weekly day is neutral — never a red mark. */
function physWeekKey(){ return weekKey(); }
function physWeekCount(id){ const s=store.get("physwk_"+id,{k:physWeekKey(),n:0}); return s.k===physWeekKey()?s.n:0; }
function physWeekSet(id,n){ store.set("physwk_"+id,{k:physWeekKey(),n:Math.max(0,n)}); }
function physDailyItems(){ return PHYSIQUE.filter(i=>i.kind!=="weekly"); }
function physWeeklyItems(){ return PHYSIQUE.filter(i=>i.kind==="weekly"); }
function physDoneToday(id){ return store.get("phys_"+id,false); }
function physSkipToday(id){ return store.get("physskip_"+id,false); }
function physDailyDone(){ return physDailyItems().filter(i=>physDoneToday(i.id)).length; }
function physDailySkip(){ return physDailyItems().filter(i=>physSkipToday(i.id)).length; }
function physDailyLeft(){ return Math.max(0, physDailyItems().length - physDailyDone() - physDailySkip()); }
function physWeeklyMet(){ return physWeeklyItems().every(i=>physWeekCount(i.id) >= (i.target||1)); }

/* ---------- card factory ---------- */
/* A calm face: crest + name + one quiet word. No figures — the detail lives inside. */

}
/* ---------- mount ---------- */

    b.addEventListener("mousemove",e=>{ const r=b.getBoundingClientRect(); b.style.setProperty("--gx",((e.clientX-r.left)/r.width*100)+"%"); b.style.setProperty("--gy",((e.clientY-r.top)/r.height*100)+"%"); });
  });
})();
function updateCards(){ boxes.forEach(b=> b._update && b._update()); }
window.updateCards=updateCards;

/* ---------- shared modal shell ---------- */
const overlay=$("#overlay"), modal=$("#modal");
function showOverlay(){ overlay.classList.add("show"); document.body.style.overflow="hidden"; }
function closeModal(){ overlay.classList.remove("show"); document.body.style.overflow=""; setTimeout(()=>{ modal.innerHTML=""; },300); }
overlay.addEventListener("click",e=>{ if(e.target===overlay) closeModal(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&overlay.classList.contains("show")) closeModal(); });
function mhead(eyebrow,title,sub,back){
  return `<div class="modal-head"><div>${back?`<button class="mback">‹ ${back}</button>`:""}<div class="m-eyebrow">${eyebrow}</div><h2>${title}</h2><p>${sub}</p></div><button class="close">✕</button></div>`;
}
function wireHead(backFn){
  const c=modal.querySelector(".close"); if(c) c.addEventListener("click",closeModal);
  const bk=modal.querySelector(".mback"); if(bk) bk.addEventListener("click", backFn||closeModal);
}

/* ---------- recap ---------- */
function openRecap(){
  let nav="", content="";
  RECAP.forEach(item=>{
    if(item.g){ nav+=`<div class="rn-div">${item.g}</div>`; return; }
    const isXml = item.android && /<[A-Za-z]/.test(item.code) && !/\bfun |\bval |\bclass |override /.test(item.code.split("\n")[0]);
    const fname = item.android ? (isXml ? item.id+".xml" : item.id+".kt") : item.id+".kt";
    const tag = item.android ? `<span class="atag">Android</span>` : "";
    nav+=`<button data-goto="t-${item.id}"><span class="rn-num">${item.num}</span><span>${item.title.split("·")[0].trim()}</span>${item.android?'<span class="rn-a">◆</span>':''}</button>`;
    content+=`<div class="topic${item.android?' topic-a':''}" id="t-${item.id}">
      <div class="topic-h"><span class="tnum">${item.num}</span><h3>${item.title}</h3>${tag}<span class="ttime">${item.time}</span></div>
      <p class="def">${item.def}</p>
      ${item.code?codecard(fname,item.code):""}
      ${item.out?outblock(item.out):""}
      <div class="ip"><div class="ip-h">In practice</div><p>${item.ip}</p></div></div>`;
  });
  const bn=BEYOND_NOW.map(x=>`<div class="bitem"><div class="bk">${x.k}</div><div class="bd">${x.d}</div></div>`).join("");
  const bl=BEYOND_LATER.map(x=>`<div class="bitem"><div class="bk">${x.k}</div><div class="bd">${x.d}<br><span class="flag ${x.resolved?'resolved':''}">${x.resolved?'✓ reached':'○ coming later'} <span class="ftime">${x.time}</span></span> <span style="color:var(--ink-faint);font-size:12px">${x.note}</span></div></div>`).join("");
  content+=`<div class="beyond"><h3>Beyond the course</h3><p class="bsub">Small but useful things — plus a check on what the course promised for later.</p>
    <h4>(a) Worth knowing</h4>${bn}
    <h4>(b) Flagged earlier — now covered</h4>${bl}</div>`;
  modal.innerHTML=mhead("Recap","Kotlin → Android, the whole course","80 topics across the full 60h · Kotlin language, then Android app-building · organised by idea, not timestamp","Course")
    + `<div class="modal-body"><nav class="m-nav">${nav}</nav><div class="m-content">${content}</div></div>`;
  const rc=modal.querySelector(".m-content");
  wireHead(openCourseModal);
  modal.querySelectorAll(".m-nav button").forEach(btn=>{
    btn.addEventListener("click",()=>{ const t=modal.querySelector("#"+btn.dataset.goto); if(t) rc.scrollTo({top:t.offsetTop-12,behavior:"smooth"}); });
  });
  rc.addEventListener("scroll",()=>{ const tops=[...modal.querySelectorAll(".topic")]; let cur=tops[0];
    tops.forEach(t=>{ if(t.offsetTop-56<=rc.scrollTop) cur=t; });
    if(cur) modal.querySelectorAll(".m-nav button").forEach(x=>x.classList.toggle("active",x.dataset.goto==="t-"+cur.id.slice(2))); });
  if(!overlay.classList.contains("show")) showOverlay();
}

/* ---------- quiz ---------- */
const HIST="quiz_history", WRONG="quiz_wrong";
const getWrong=()=> store.get(WRONG,{});

/* subjects mirror the recap's own groupings (covered range) */
const SUBJECTS={
  "Variables":"Foundations","Types":"Foundations","String templates":"Foundations",
  "Control flow":"Control & data","Nullability":"Control & data","Functions":"Control & data","Loops":"Control & data","Arrays":"Control & data",
  "Classes":"Objects","init blocks":"Objects","Secondary constructors":"Objects","Getters/setters":"Objects","lateinit":"Objects","Companion objects":"Objects","Singleton":"Objects","Lazy":"Objects","Enum classes":"Objects","Inner classes":"Objects","Inheritance":"Objects","Sealed classes":"Objects","Abstract classes":"Objects","Data classes":"Objects","Interfaces":"Objects","Object expressions":"Objects","Delegation":"Objects",
  "Collections":"Collections"
};
const SUBJECT_ORDER=["Foundations","Control & data","Objects","Collections"];
const subjOf=q=> q.subject || SUBJECTS[q.topic] || "More";

/* variety + harder questions, folded into the pool so no two runs match */
const QUIZ_EXTRA=[
 { topic:"Variables", hard:true, q:"What separates const val from a plain val?",
   a:`<code>const val</code> is a <b>compile-time</b> constant — fixed before the app runs, and only allowed at top level or inside an <code>object</code>/companion. A plain <code>val</code> is assigned <b>at runtime</b> and may hold a computed value.` },
 { topic:"Types", q:"What type is inferred for val x = 4.0, and why does it matter?",
   a:`<b>Double</b>. It matters because arithmetic follows the type — mix it with plain <code>Int</code> division and you meet the classic <code>5 / 2 == 2</code> trap.` },
 { topic:"Nullability", hard:true, q:"Contrast ?. and !! when the value is null.",
   a:`<code>?.</code> short-circuits to <b>null</b> (no crash); <code>!!</code> forces the value and <b>throws NullPointerException</b> if it was null. Default to <code>?.</code> with an Elvis fallback; keep <code>!!</code> for "I'm certain."` },
 { topic:"Loops", q:"Write the loop header that walks the valid indices of a list of size n.",
   a:`<pre class="code">${hl(`for (i in 0 until n) { }   // 0 .. n-1`)}</pre><code>until</code> stops one short of the size — the shape that dodges the off-by-one crash.` },
 { topic:"Control flow", hard:true, q:"When can a when omit else and still compile?",
   a:`When it is <b>exhaustive</b> — it covers every case of an <code>enum</code>, or every subclass of a <code>sealed</code> class. The compiler sees the full set and knows nothing is missing.` },
 { topic:"Companion objects", q:"What is Kotlin's nearest equivalent to a static member?",
   a:`A member of a <code>companion object</code> — it belongs to the class itself, is called on the class name, and there is one per class.` },
 { topic:"Getters/setters", q:"What is a custom getter good for?",
   a:`Computing a value fresh on each read rather than storing it — a full name from first + last, or an uppercased copy — via <code>get() = ...</code>.` },
 { topic:"Inheritance", q:"What must a Kotlin class be before another can extend it?",
   a:`<code>open</code>. Classes and members are <b>final by default</b>; you opt into inheritance with <code>open</code> and replace behaviour with <code>override</code>.` },
 { topic:"lateinit", hard:true, q:"When is lateinit the right call over a nullable String?",
   a:`When the value is set once during setup and always <b>before</b> any read (a view, a binding) — so you skip both <code>null</code> and constant <code>?.</code>. If you can't guarantee it's filled in time, a nullable <code>String?</code> is safer.` },
 { topic:"Sealed classes", hard:true, q:"Why does the compiler know every subclass of a sealed class?",
   a:`They must be declared in the same module/file, so the full set is fixed at compile time — which is exactly what lets a <code>when</code> over the type be exhaustive.` },
 { topic:"Data classes", q:"What does copy() give you that a normal class doesn't?",
   a:`A duplicate with chosen fields changed and the rest carried over:
<pre class="code">${hl(`val b = a.copy(age = 17)`)}</pre>Generated automatically for a <code>data</code> class, along with <code>toString()</code>, content <code>==</code> and destructuring.` },
 { topic:"Interfaces", hard:true, q:"Give two ways an interface differs from an abstract class.",
   a:`A class can implement <b>many</b> interfaces but extend only <b>one</b> class; and an interface holds <b>no state</b> (no backing fields), whereas an abstract class can carry state and shared code.` },
 { topic:"Delegation", hard:true, q:"What does class delegation with by achieve over inheritance?",
   a:`It reuses an implementation by <b>forwarding</b> calls to a held object — composition, not inheritance. You wrap it, forward what you don't change, and override only what you do.` },
 { topic:"Collections", hard:true, q:"You must strip duplicate tags — List, Set, or Map?",
   a:`A <b>Set</b> — it keeps only unique values and drops repeats silently. A List preserves the duplicates; a Map is for key → value lookup.` },
 { topic:"Enum classes", q:"Give a concrete case where an enum beats loose strings.",
   a:`A status that can only be <code>NOT_STARTED</code>, <code>LEARNING</code> or <code>DONE</code> — the enum makes typos impossible and lets a <code>when</code> cover every case with compiler help.` },
 { topic:"Abstract classes", hard:true, q:"What can an abstract class do that an interface cannot?",
   a:`Hold <b>state</b> — real properties with backing fields — and a constructor, while still forcing subclasses to fill in <code>abstract</code> members. Choose it when subclasses share real stored data and code.` }
];
QUIZ.push.apply(QUIZ, QUIZ_EXTRA);

function histLabel(m){ return m==="weak"?"Weak-areas retry":m==="full"?"Full run":m==="hard"?"Challenge":m; }

function openQuiz(){
  modal.innerHTML=mhead("Quiz","Kotlin, so far","Reveal each answer, mark yourself honestly. Weak spots are remembered.","Course")
    + `<div class="modal-body"><div class="m-content quiz" id="quizArea"></div></div>`;
  wireHead(openCourseModal);
  quizStart(); if(!overlay.classList.contains("show")) showOverlay();
}
function quizStart(){
  const area=modal.querySelector("#quizArea");
  const wrong=getWrong(); const weak=Object.keys(wrong).filter(k=>wrong[k]).length;
  const hardN=QUIZ.filter(q=>q.hard).length;
  area.innerHTML=`<div class="quiz-panel"><div class="big">${QUIZ.length}</div><div class="lbl">questions across every topic so far · shuffled, so no two runs are the same</div>
    <div class="quiz-modes">
      <button class="mode-btn" data-mode="full"><div><div class="mb-t">Full run</div><div class="mb-s">Every question, freshly shuffled</div></div><span class="mb-arr">→</span></button>
      <button class="mode-btn" data-mode="subjects"><div><div class="mb-t">By subject</div><div class="mb-s">Focus one area — ${SUBJECT_ORDER.length} to choose from</div></div><span class="mb-arr">→</span></button>
      <button class="mode-btn" data-mode="hard" ${hardN?'':'disabled'}><div><div class="mb-t">Challenge · harder questions</div><div class="mb-s">${hardN?hardN+" tougher questions that dig a level deeper":"None yet"}</div></div><span class="mb-arr">→</span></button>
      <button class="mode-btn" data-mode="weak" ${weak?'':'disabled'}><div><div class="mb-t">Retry weak areas</div><div class="mb-s">${weak?weak+" question"+(weak>1?"s":"")+" you missed last time":"Nothing flagged yet — finish a run first"}</div></div><span class="mb-arr">→</span></button>
      <button class="mode-btn soon" data-mode="soon"><div><div class="mb-t">Future challenges <span class="soon-pill">soon</span></div><div class="mb-s">Timed runs, streaks &amp; mixed gauntlets — arriving as the course grows</div></div><span class="mb-arr">→</span></button>
    </div>
    <div class="history"><h4>Past attempts</h4><div id="histList"></div></div></div>`;
  area.querySelectorAll(".mode-btn").forEach(btn=>btn.addEventListener("click",()=>{
    if(btn.disabled) return;
    const m=btn.dataset.mode;
    if(m==="soon") return;
    if(m==="subjects") return subjectPicker();
    runQuiz(m);
  }));
  renderHistory(area.querySelector("#histList"));
}
function subjectPicker(){
  const area=modal.querySelector("#quizArea");
  const counts={}; QUIZ.forEach(q=>{ const s=subjOf(q); counts[s]=(counts[s]||0)+1; });
  const cards=SUBJECT_ORDER.filter(s=>counts[s]).map(s=>`<button class="mode-btn" data-subj="${s}"><div><div class="mb-t">${s}</div><div class="mb-s">${counts[s]} question${counts[s]>1?"s":""}</div></div><span class="mb-arr">→</span></button>`).join("");
  area.innerHTML=`<div class="quiz-panel"><div class="lbl" style="margin-bottom:15px">Choose a subject to drill</div>
    <div class="quiz-modes">${cards}</div>
    <button class="btn ghost" id="subjBack" style="margin-top:16px">‹ Back</button></div>`;
  area.querySelectorAll(".mode-btn").forEach(b=>b.addEventListener("click",()=>runQuiz("subject:"+b.dataset.subj)));
  area.querySelector("#subjBack").addEventListener("click",quizStart);
}
function renderHistory(box){
  const hist=store.get(HIST,[]);
  if(!hist.length){ box.innerHTML=`<div class="hist-empty">No attempts yet. Your runs appear here.</div>`; return; }
  box.innerHTML="";
  hist.slice().reverse().forEach(h=>{
    const row=el("div","hist-row");
    row.innerHTML=`<span class="hr-score">${h.score}/${h.total}</span><span class="hr-mode">${histLabel(h.mode)}</span><span class="hr-date">${h.date}</span><button class="hr-del" title="Delete">✕</button>`;
    row.querySelector(".hr-del").addEventListener("click",()=>{ const cur=store.get(HIST,[]); const i=cur.indexOf(h); if(i>-1){ cur.splice(i,1); store.set(HIST,cur); } renderHistory(box); });
    box.append(row);
  });
}
function runQuiz(mode){
  const area=modal.querySelector("#quizArea"); const wrong=getWrong();
  let idx=QUIZ.map((_,i)=>i);
  if(mode==="weak") idx=idx.filter(i=>wrong[i]);
  else if(mode==="hard") idx=idx.filter(i=>QUIZ[i].hard);
  else if(mode.indexOf("subject:")===0){ const s=mode.slice(8); idx=idx.filter(i=>subjOf(QUIZ[i])===s); }
  for(let i=idx.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [idx[i],idx[j]]=[idx[j],idx[i]]; }
  const lastFirst=store.get("quiz_lastfirst",-1);
  if(idx.length>1 && idx[0]===lastFirst){ [idx[0],idx[1]]=[idx[1],idx[0]]; }
  store.set("quiz_lastfirst", idx.length?idx[0]:-1);
  if(!idx.length){ area.innerHTML=`<div class="quiz-panel"><div class="lbl">Nothing to run here yet.</div><button class="btn ghost" id="bk" style="margin-top:14px">‹ Back</button></div>`; area.querySelector("#bk").addEventListener("click",quizStart); return; }
  const label = mode==="weak"?"weak-areas retry":mode==="hard"?"challenge":mode.indexOf("subject:")===0?mode.slice(8):"full run";
  let pos=0, correct=0; const sess={};
  function renderQ(){
    const qi=idx[pos], q=QUIZ[qi];
    area.innerHTML=`<div style="flex:1">
      <div class="q-meta"><span>Question ${pos+1} of ${idx.length}</span><span>${label}</span></div>
      <div class="q-badges"><span class="qb-subj">${subjOf(q)}</span>${q.hard?'<span class="qb-hard">harder</span>':''}</div>
      <div class="q-topic">${q.topic}</div><div class="q-question">${q.q}</div>
      ${q.exact?`<div class="q-hint">exact name expected · ${q.exact}</div>`:""}
      <button class="btn ghost" id="reveal">Reveal model answer</button>
      <div class="model" id="model"><div class="ma-h">Model answer</div><div class="ma-body">${q.a}</div>
        <div class="mark-row"><button class="btn" id="got">Got it</button><button class="btn ghost" id="missed">Missed it</button></div></div>
      </div>
      <div class="quiz-foot"><span class="qscore">Correct so far · <b>${correct}</b> / ${pos}</span><button class="btn ghost" id="quit">End &amp; save</button></div>`;
    area.querySelector("#reveal").addEventListener("click",()=>area.querySelector("#model").classList.add("show"));
    area.querySelector("#got").addEventListener("click",()=>mark(true,qi));
    area.querySelector("#missed").addEventListener("click",()=>mark(false,qi));
    area.querySelector("#quit").addEventListener("click",finish);
  }
  function mark(ok,qi){ if(ok) correct++; else sess[qi]=true; pos++; if(pos>=idx.length) finish(); else renderQ(); }
  function finish(){
    const w=getWrong(); idx.slice(0,pos).forEach(qi=>{ if(sess[qi]) w[qi]=true; else delete w[qi]; }); store.set(WRONG,w);
    const hist=store.get(HIST,[]); hist.push({score:correct,total:pos,mode:label,date:new Date().toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})}); store.set(HIST,hist);
    showResults(correct,pos,mode);
  }
  renderQ();
}
function showResults(score,total,mode){
  const area=modal.querySelector("#quizArea");
  const pct=total?Math.round(score/total*100):0;
  const line=pct>=80?"Sharp. That's consolidated.":pct>=50?"Solid — a couple to firm up.":"Worth another pass. That's what the retry is for.";
  const weak=Object.keys(getWrong()).filter(k=>getWrong()[k]).length;
  area.innerHTML=`<div class="quiz-panel"><div class="big">${score}<span style="color:var(--ink-faint)">/${total}</span></div><div class="lbl">${line}</div>
    <div class="quiz-modes">
      ${weak?`<button class="mode-btn" data-mode="weak"><div><div class="mb-t">Retry weak areas</div><div class="mb-s">${weak} still flagged</div></div><span class="mb-arr">→</span></button>`:""}
      <button class="mode-btn" data-mode="menu"><div><div class="mb-t">Back to start</div><div class="mb-s">Modes &amp; attempt history</div></div><span class="mb-arr">→</span></button>
    </div></div>`;
  area.querySelectorAll(".mode-btn").forEach(btn=>btn.addEventListener("click",()=> btn.dataset.mode==="menu"?quizStart():runQuiz(btn.dataset.mode)));
}

/* ---------- physique ---------- */
function openPhysiqueModal(){
  const setSub=()=>{ const s=modal.querySelector("#physSub");
    if(s){ const wk=physWeeklyItems().length?` · rope ${physWeekCount(physWeeklyItems()[0].id)}/${physWeeklyItems()[0].target||1} this week`:"";
      s.textContent=`${physDailyDone()}/${physDailyItems().length-physDailySkip()} done · ${physDailySkip()} set aside${wk} · resets with the day`; } };
  modal.innerHTML=mhead("Physique","Anchored to the day",`<span id="physSub"></span>`)
    + `<div class="modal-body"><div class="m-solo" id="physBody"></div></div>`;
  wireHead();
  const body=modal.querySelector("#physBody");
  if(window.physCloseout) window.physCloseout(body,{setSub:setSub});

  const ul=el("ul","list"); let n=0;
  PHYSIQUE.forEach((item)=>{
    n++;
    const li=el("li"); if(item.kind==="keystone") li.classList.add("keystone");
    const step=el("span","step"); step.textContent=(n);
    const txt=el("span","ltext");
    const badge=item.kind==="keystone"?` <span class="pk">keystone</span>`:"";
    txt.innerHTML=item.t+badge+(item.s?` <span class="lsub">${item.s}</span>`:"");

    if(item.kind==="weekly"){
      /* weekly rhythm — a small count, never a red mark for a missed day */
      const chk=el("button","chk"); chk.innerHTML=CHECK_SVG; chk.title="Log one session this week";
      const dec=el("button","skipbtn wk-dec"); dec.type="button"; dec.setAttribute("aria-label","Remove one this week"); dec.textContent="−";
      const cnt=el("span","wk-count");
      li.append(step,chk,txt,cnt,dec); ul.append(li);
      const paint=()=>{ const c=physWeekCount(item.id), tgt=item.target||1;
        cnt.textContent=`${c}/${tgt}`; const met=c>=tgt;
        chk.classList.toggle("on",met); li.classList.toggle("done",met); li.classList.remove("skipped"); };
      chk.addEventListener("click",e=>{ e.stopPropagation(); physWeekSet(item.id,physWeekCount(item.id)+1); paint(); updateCards(); setSub(); });
      dec.addEventListener("click",e=>{ e.stopPropagation(); physWeekSet(item.id,Math.max(0,physWeekCount(item.id)-1)); paint(); updateCards(); setSub(); });
      paint();
    } else {
      const chk=el("button","chk"); chk.innerHTML=CHECK_SVG;
      const skip=el("button","skipbtn"); skip.type="button"; skip.setAttribute("role","switch"); skip.setAttribute("aria-label","Set aside today");
      const undo=el("button","undobtn"); undo.type="button"; undo.setAttribute("aria-label","Clear this — undo done or set-aside"); undo.title="Clear this row"; undo.innerHTML=UNDO_SVG;
      li.append(step,chk,txt,undo,skip); ul.append(li);
      const kDone="phys_"+item.id, kSkip="physskip_"+item.id;
      const paint=()=>{ const d=store.get(kDone,false), sk=store.get(kSkip,false);
        chk.classList.toggle("on",d); li.classList.toggle("done",d);
        li.classList.toggle("skipped",sk); skip.classList.toggle("on",sk);
        skip.setAttribute("aria-checked",sk?"true":"false");
        undo.classList.toggle("live",d||sk); };
      chk.addEventListener("click",e=>{ e.stopPropagation();
        const now=!store.get(kDone,false); store.set(kDone,now); if(now) store.set(kSkip,false);
        paint(); updateCards(); setSub(); });
      skip.addEventListener("click",e=>{ e.stopPropagation();
        const now=!store.get(kSkip,false); store.set(kSkip,now); if(now) store.set(kDone,false);
        paint(); updateCards(); setSub(); });
      undo.addEventListener("click",e=>{ e.stopPropagation();
        store.set(kDone,false); store.set(kSkip,false);
        paint(); updateCards(); setSub(); });
      paint();
    }
  });
  body.append(ul); setSub();
  if(!overlay.classList.contains("show")) showOverlay();
}

function openQuranModal(){
  const memo=()=>JUZ30.filter(([n])=>store.get("quran_"+n,"stop")==="go").length;
  modal.innerHTML=mhead("Quran","Juz 30 · Juz 'Amma",`<span id="qSub"></span>`)
    + `<div class="modal-body"><div class="m-solo" id="quranBody"></div></div>`;
  wireHead();
  const setSub=()=>{ const s=modal.querySelector("#qSub"); if(s) s.textContent=`${memo()}/${JUZ30.length} surah memorised`; };
  const body=modal.querySelector("#quranBody");
  const legend=el("div","mini-legend");
  legend.innerHTML=`<span><i style="background:var(--stop)"></i>not started</span><span><i style="background:var(--mid)"></i>learning</span><span><i style="background:var(--go)"></i>memorised</span>`;
  body.append(legend);
  const ul=el("ul","list quran");
  JUZ30.forEach(([num,name])=>{
    const li=el("li");

    const nm=el("span","qname"); nm.textContent=name;
    const tr=el("div","traffic"); const key="quran_"+num;

    ["stop","mid","go"].forEach(c=>{
      const dot=el("button","tl"); dot.dataset.c=c;

        const current=store.get(key,"stop");
        tr.querySelectorAll(".tl").forEach(x=>x.classList.remove("on"));
        if(current===c){ store.set(key,"stop"); tr.querySelector('.tl[data-c="stop"]').classList.add("on"); } else { dot.classList.add("on"); store.set(key,c); }
        updateCards(); setSub();
      });
      tr.append(dot);
    });
    li.append(n,nm,tr); ul.append(li);
  });
  body.append(ul); setSub();
  if(!overlay.classList.contains("show")) showOverlay();
}

/* ---------- school ---------- */
function openSchoolModal(){
  modal.innerHTML=mhead("School","Reserved","Brentside Sixth Form")
   + `<div class="modal-body"><div class="m-solo">
        <div class="school-note"><span class="soon">To be continued</span>
        <p>Held for Brentside Sixth Form — timetable, subjects, deadlines and a term calendar. This space fills in once the term begins, so the OS grows with the year rather than sitting empty.</p></div>
      </div></div>`;
  wireHead();
  if(!overlay.classList.contains("show")) showOverlay();
}

/* ---------- chess ---------- */
function openChess(){ if(window.ChessTrainer) window.ChessTrainer.open(); }

/* ---------- ambient: mouse spotlight ---------- */
window.addEventListener("mousemove",e=>{
  document.documentElement.style.setProperty("--mx",(e.clientX/window.innerWidth*100)+"%");
  document.documentElement.style.setProperty("--my",(e.clientY/window.innerHeight*100)+"%");
},{passive:true});
