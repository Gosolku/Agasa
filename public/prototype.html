<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<meta name="robots" content="noindex" />
<title>Agasa — core prototype</title>

<style>
  /* ═══ prototype ══════════════════════════════════════════════════
     Standalone. Imports nothing from the app and is imported by
     nothing, so it can be broken freely. Every tunable the brief pins
     down lives either in :root below or in the CORE block of the
     shader — one place each.
     ════════════════════════════════════════════════════════════════ */

  :root {
    --space:       #000000;
    --light:       #ffffff;
    --ink:         #ffffff;
    --ink-dim:     #8a8a8a;
    --ink-faint:   #5c5c5c;

    --rail-w:      360px;
    --inset:       20px;
    --rail-bg:     rgba(8, 8, 8, 0.65);
    --rail-blur:   blur(24px);
    --rail-line:   rgba(255, 255, 255, 0.08);
    --rail-radius: 16px;

    --win-bg:      rgba(12, 12, 12, 0.75);
    --win-blur:    blur(20px);
    --win-line:    rgba(255, 255, 255, 0.12);

    --ease:        cubic-bezier(0.16, 1, 0.3, 1);
    --motion:      all 0.35s var(--ease);

    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
            "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, monospace;

    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }

  body {
    background: var(--space);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.55;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* The core sits behind everything. The ground colour is set on <body>
     and nowhere else, so it propagates to the viewport canvas and a
     negative-index child still paints on top of it. */
  #core {
    position: fixed;
    inset: 0;
    z-index: -1;
    display: block;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  /* No WebGL: a still gradient carries the same composition rather than
     leaving a black rectangle where the core should be. */
  body[data-nogl="true"]::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    background:
      radial-gradient(circle at 50% 50%,
        transparent 0 8%,
        rgba(255, 255, 255, 0.16) 9%,
        rgba(255, 255, 255, 0.05) 38%,
        transparent 62%);
  }

  /* ── chat rail ─────────────────────────────────────────────── */

  .rail {
    position: fixed;
    left: var(--inset);
    top: var(--inset);
    bottom: var(--inset);
    width: var(--rail-w);
    display: flex;
    flex-direction: column;
    background: var(--rail-bg);
    backdrop-filter: var(--rail-blur);
    -webkit-backdrop-filter: var(--rail-blur);
    border: 1px solid var(--rail-line);
    border-radius: var(--rail-radius);
    overflow: hidden;
  }

  .rail__head {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 15px 18px;
    border-bottom: 1px solid var(--rail-line);
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.2em;
    color: var(--ink-dim);
  }
  .rail__pip {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--light);
    box-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
  }
  .rail__state { margin-left: auto; letter-spacing: 0.12em; color: var(--ink-faint); }

  .thread {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 20px 18px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    scrollbar-width: thin;
    scrollbar-color: rgba(255, 255, 255, 0.16) transparent;
  }
  .thread::-webkit-scrollbar { width: 6px; }
  .thread::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.16);
    border-radius: 3px;
  }

  .thread__empty {
    margin: auto;
    text-align: center;
    color: var(--ink-faint);
    font-size: 13px;
  }

  .turn { animation: rise 0.35s var(--ease) both; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: none; }
  }

  .turn__who {
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: 0.18em;
    color: var(--ink-faint);
    margin-bottom: 7px;
  }
  .turn--user .turn__body {
    background: rgba(255, 255, 255, 0.055);
    border: 1px solid var(--rail-line);
    border-radius: 10px;
    padding: 10px 13px;
  }
  .turn__body { color: var(--ink); white-space: pre-wrap; }
  .turn--agent .turn__body { color: rgba(255, 255, 255, 0.86); }

  /* the streaming caret — a block, not a spinner */
  .caret {
    display: inline-block;
    width: 7px; height: 1.05em;
    margin-left: 2px;
    vertical-align: text-bottom;
    background: var(--light);
    animation: blink 1s steps(2, start) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .composer {
    padding: 12px;
    border-top: 1px solid var(--rail-line);
  }
  .composer__box {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    padding: 8px 8px 8px 13px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--rail-line);
    border-radius: 12px;
    transition: var(--motion);
  }
  .composer__box:focus-within {
    border-color: rgba(255, 255, 255, 0.34);
    background: rgba(255, 255, 255, 0.075);
    box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.05);
  }
  .composer textarea {
    flex: 1;
    min-width: 0;
    font: inherit;
    color: var(--ink);
    background: none;
    border: 0;
    outline: none;
    resize: none;
    max-height: 6.5em;
    padding: 5px 0;
    line-height: 1.5;
  }
  .composer textarea::placeholder { color: var(--ink-faint); }
  .composer__send {
    flex: 0 0 auto;
    display: grid;
    place-items: center;
    width: 32px; height: 32px;
    color: var(--space);
    background: var(--light);
    border: 0;
    border-radius: 9px;
    cursor: pointer;
    transition: var(--motion);
  }
  .composer__send:hover { transform: translateY(-1px); }
  .composer__send svg { width: 15px; height: 15px; }
  .composer__hint {
    display: flex;
    gap: 12px;
    margin-top: 9px;
    padding: 0 4px;
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: 0.1em;
    color: var(--ink-faint);
  }
  .composer__hint span:last-child { margin-left: auto; }

  /* ── stage ─────────────────────────────────────────────────── */

  .stage {
    position: fixed;
    right: var(--inset);
    top: 78px;
    width: min(370px, calc(100vw - var(--rail-w) - 80px));
    display: flex;
    flex-direction: column;
    gap: 16px;
    pointer-events: none;
  }

  .window {
    background: var(--win-bg);
    backdrop-filter: var(--win-blur);
    -webkit-backdrop-filter: var(--win-blur);
    border: 1px solid var(--win-line);
    border-radius: var(--rail-radius);
    padding: 17px;
    transition: var(--motion);
    transform-origin: 85% 0%;

    /* inactive is the resting state; the harness adds .is-open */
    opacity: 0;
    transform: scale(0.92) translateY(16px);
    pointer-events: none;
  }
  .window.is-open {
    opacity: 1;
    transform: scale(1) translateY(0);
    pointer-events: auto;
  }

  .window__head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 15px;
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: 0.18em;
    color: var(--ink-faint);
  }

  .timer__clock {
    font-size: 46px;
    font-weight: 200;
    letter-spacing: 0.01em;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .timer__label { margin-top: 9px; color: var(--ink-dim); font-size: 13px; }
  .timer__track {
    margin-top: 17px;
    height: 2px;
    background: rgba(255, 255, 255, 0.12);
    border-radius: 2px;
    overflow: hidden;
  }
  .timer__fill {
    height: 100%;
    width: 100%;
    background: var(--light);
    transition: width 1s linear;
  }

  .check { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; }
  .check li {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 8px 7px;
    border-radius: 8px;
    cursor: pointer;
    transition: var(--motion);
  }
  .check li:hover { background: rgba(255, 255, 255, 0.05); }
  .check .box {
    flex: 0 0 auto;
    width: 15px; height: 15px;
    border: 1px solid rgba(255, 255, 255, 0.32);
    border-radius: 4px;
    display: grid;
    place-items: center;
    font-size: 9px;
    color: transparent;
    transition: var(--motion);
  }
  .check li[data-done="true"] .box {
    background: var(--light);
    border-color: var(--light);
    color: var(--space);
  }
  .check li[data-done="true"] .text {
    color: var(--ink-faint);
    text-decoration: line-through;
  }

  /* ── dev toolbar ───────────────────────────────────────────── */

  #prototype-toolbar {
    position: fixed;
    right: var(--inset);
    top: var(--inset);
    z-index: 10;
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 6px;
    padding: 6px;
    background: var(--win-bg);
    backdrop-filter: var(--win-blur);
    -webkit-backdrop-filter: var(--win-blur);
    border: 1px solid var(--win-line);
    border-radius: 12px;
  }
  #prototype-toolbar button {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.04em;
    color: var(--ink);
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 8px;
    padding: 7px 12px;
    cursor: pointer;
    transition: var(--motion);
    white-space: nowrap;
  }
  #prototype-toolbar button:hover {
    background: rgba(255, 255, 255, 0.12);
    border-color: rgba(255, 255, 255, 0.28);
  }
  #prototype-toolbar button[aria-pressed="true"] {
    background: var(--light);
    border-color: var(--light);
    color: var(--space);
  }
  #prototype-toolbar button:disabled { opacity: 0.4; cursor: default; }

  .sr-only {
    position: absolute; width: 1px; height: 1px;
    padding: 0; margin: -1px; overflow: hidden;
    clip-path: inset(50%); white-space: nowrap;
  }

  @media (max-width: 900px) {
    .rail { right: var(--inset); width: auto; }
    .stage { display: none; }
  }
</style>
</head>
<body>

<canvas id="core" aria-hidden="true"></canvas>

<div id="prototype-toolbar" role="group" aria-label="Prototype controls">
  <button type="button" id="btnStream">Simulate Stream</button>
  <button type="button" id="btnTimer" aria-pressed="false">Toggle Timer</button>
  <button type="button" id="btnChecklist" aria-pressed="false">Toggle Checklist</button>
  <button type="button" id="btnClear">Clear Thread</button>
</div>

<section class="rail" aria-label="Conversation">
  <header class="rail__head">
    <span class="rail__pip"></span>
    AGASA CORE
    <span class="rail__state" id="railState">idle</span>
  </header>

  <div class="thread" id="thread" role="log" aria-label="Messages" aria-live="polite">
    <p class="thread__empty" id="empty">Nothing yet. Try <b>Simulate Stream</b>.</p>
  </div>

  <form class="composer" id="composer">
    <label class="sr-only" for="input">Message</label>
    <div class="composer__box">
      <textarea id="input" rows="1" placeholder="Ask anything…" autocomplete="off"></textarea>
      <button type="submit" class="composer__send" aria-label="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </div>
    <div class="composer__hint">
      <span>↵ send</span><span>⇧↵ newline</span><span id="glState">webgl</span>
    </div>
  </form>
</section>

<div class="stage" aria-label="View stage">
  <section class="window" id="winTimer" aria-hidden="true">
    <div class="window__head"><span>TIMER</span><span id="timerState">RUNNING</span></div>
    <div class="timer__clock" id="timerClock">24:00</div>
    <div class="timer__label">Focus block</div>
    <div class="timer__track"><div class="timer__fill" id="timerFill"></div></div>
  </section>

  <section class="window" id="winChecklist" aria-hidden="true">
    <div class="window__head"><span>CHECKLIST</span><span id="checkCount">0/4</span></div>
    <ul class="check" id="checkList">
      <li data-done="false"><span class="box">✓</span><span class="text">Re-read the brief</span></li>
      <li data-done="false"><span class="box">✓</span><span class="text">Compile the shader</span></li>
      <li data-done="false"><span class="box">✓</span><span class="text">Tune the falloff</span></li>
      <li data-done="false"><span class="box">✓</span><span class="text">Screenshot it</span></li>
    </ul>
  </section>
</div>

<script type="module">
/* ═══ the core ══════════════════════════════════════════════════════
   A full-screen quad and one fragment shader. Every pixel converts to
   polar coordinates, samples a noise field on the angle and the radius,
   and returns a single luminance — the image is monochrome by
   construction rather than by desaturating something colourful.

   Two notes on the shader below:

   · The noise is 3D simplex sampled on a *circle*, not 2D simplex
     sampled on the raw angle. Feeding theta straight in leaves a hard
     seam down the ray at ±π, where the noise field does not meet
     itself. Riding a circle of circumference tuned to eight features
     gives the same eight-fold structure the brief asks for with no
     seam at all; the third axis carries the radial drift term.

   · Glow is a tone-mapped exponential rather than a multiply, so the
     filaments saturate to white at their cores instead of clipping
     flat across their whole width.
   ═══════════════════════════════════════════════════════════════════ */

const VERT = `
attribute vec2 a_position;
void main() {
  gl_Position = vec4(a_position, 0.0, 1.0);
}`;

const FRAG = `
precision highp float;

uniform vec2  u_resolution;
uniform float u_time;

const float PUPIL  = 0.1;   // hard void, inner edge of the iris
const float IRIS   = 0.8;   // outer edge, where falloff begins
const float RINGS  = 8.0;   // angular features around one revolution
const float SCALE  = 1.8;   // radial frequency of the noise field
const float SPEED  = 0.1;   // outward drift, revolutions per second
const float GLOW   = 0.55;  // luminance boost before tone mapping
const float TAU    = 6.28318530718;

/* ── Ashima simplex 3D ──────────────────────────────────────────── */

vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
vec4 permute(vec4 x) { return mod289(((x * 34.0) + 1.0) * x); }
vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }

float snoise(vec3 v) {
  const vec2 C = vec2(1.0 / 6.0, 1.0 / 3.0);
  const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);

  vec3 i  = floor(v + dot(v, C.yyy));
  vec3 x0 = v - i + dot(i, C.xxx);

  vec3 g = step(x0.yzx, x0.xyz);
  vec3 l = 1.0 - g;
  vec3 i1 = min(g.xyz, l.zxy);
  vec3 i2 = max(g.xyz, l.zxy);

  vec3 x1 = x0 - i1 + C.xxx;
  vec3 x2 = x0 - i2 + C.yyy;
  vec3 x3 = x0 - D.yyy;

  i = mod289(i);
  vec4 p = permute(permute(permute(
             i.z + vec4(0.0, i1.z, i2.z, 1.0))
           + i.y + vec4(0.0, i1.y, i2.y, 1.0))
           + i.x + vec4(0.0, i1.x, i2.x, 1.0));

  float n_ = 0.142857142857;
  vec3 ns = n_ * D.wyz - D.xzx;

  vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
  vec4 x_ = floor(j * ns.z);
  vec4 y_ = floor(j - 7.0 * x_);

  vec4 x = x_ * ns.x + ns.yyyy;
  vec4 y = y_ * ns.x + ns.yyyy;
  vec4 h = 1.0 - abs(x) - abs(y);

  vec4 b0 = vec4(x.xy, y.xy);
  vec4 b1 = vec4(x.zw, y.zw);

  vec4 s0 = floor(b0) * 2.0 + 1.0;
  vec4 s1 = floor(b1) * 2.0 + 1.0;
  vec4 sh = -step(h, vec4(0.0));

  vec4 a0 = b0.xzyw + s0.xzyw * sh.xxyy;
  vec4 a1 = b1.xzyw + s1.xzyw * sh.zzww;

  vec3 p0 = vec3(a0.xy, h.x);
  vec3 p1 = vec3(a0.zw, h.y);
  vec3 p2 = vec3(a1.xy, h.z);
  vec3 p3 = vec3(a1.zw, h.w);

  vec4 norm = taylorInvSqrt(vec4(dot(p0, p0), dot(p1, p1), dot(p2, p2), dot(p3, p3)));
  p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;

  vec4 m = max(0.6 - vec4(dot(x0, x0), dot(x1, x1), dot(x2, x2), dot(x3, x3)), 0.0);
  m = m * m;
  return 42.0 * dot(m * m, vec4(dot(p0, x0), dot(p1, x1), dot(p2, x2), dot(p3, x3)));
}

/* Ridged fractal noise: 1 - |n| turns the zero crossings into bright
   creases, which is what reads as a filament rather than a cloud. */
float filaments(float theta, float radius) {
  vec2 ring = vec2(cos(theta), sin(theta)) * (RINGS / TAU);
  float drift = radius * SCALE - u_time * SPEED;

  // Starting amplitude is deliberately below half: weighting the first
  // octave less puts the character in the fine strands rather than in
  // eight fat lobes.
  float sum = 0.0;
  float amp = 0.38;
  float freq = 1.0;

  for (int i = 0; i < 5; i++) {
    // Each octave adds detail around the ring but barely any along the
    // radius. That imbalance is what makes the field read as filaments
    // running outwards rather than as clouds sitting on top of it.
    float n = snoise(vec3(ring * freq, drift * mix(1.0, freq, 0.22)));
    sum += (1.0 - abs(n)) * amp;
    freq *= 2.35;
    amp *= 0.62;
  }
  return sum;
}

void main() {
  vec2 uv = (gl_FragCoord.xy - 0.5 * u_resolution) / min(u_resolution.x, u_resolution.y);
  // Sets how much of the viewport the core occupies. At 0.28 the iris
  // edge (r = 0.8) lands near 45% of the half-height and its falloff
  // finishes well inside the frame, so the core sits in space rather
  // than filling it.
  uv /= 0.28;

  float r = length(uv);
  float theta = atan(uv.y, uv.x);

  // The pupil is a void, not a dark disc — nothing is drawn inside it.
  if (r < PUPIL) {
    gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0);
    return;
  }

  float n = filaments(theta, r);

  // Peak across the iris, soft falloff outside it.
  float inner = smoothstep(PUPIL, PUPIL + 0.05, r);
  float outer = 1.0 - smoothstep(IRIS, IRIS + 0.55, r);
  float mask = inner * outer;

  // Thin the filaments towards the rim so the edge dissolves into
  // strands rather than stopping on a line.
  float taper = mix(1.0, 0.36, smoothstep(PUPIL, IRIS, r));
  float core = pow(clamp(n, 0.0, 1.0), 4.2) * mask * taper;

  // Light spilling off the pupil, and a faint wash filling the iris.
  float bloom = GLOW * exp(-(r - PUPIL) * 7.5) * 0.42;
  float wash  = GLOW * mask * 0.025;

  float lum = 1.0 - exp(-(core * (2.4 + GLOW * 3.0) + bloom + wash));

  // A hairline where the void meets the light.
  lum += (1.0 - smoothstep(0.0, 0.008, abs(r - PUPIL))) * 0.55;

  lum = clamp(lum, 0.0, 1.0);
  gl_FragColor = vec4(vec3(lum), 1.0);
}`;

const canvas = document.getElementById('core');
const glState = document.getElementById('glState');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

let gl = null;
try {
  gl = canvas.getContext('webgl2') || canvas.getContext('webgl');
} catch { /* fall through to the CSS gradient */ }

let running = false;
let frame = 0;
let started = 0;
let uResolution = null;
let uTime = null;
let w = 0, h = 0;

function compile(type, source) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
    throw new Error(gl.getShaderInfoLog(shader) || 'shader failed to compile');
  }
  return shader;
}

function setup() {
  const program = gl.createProgram();
  gl.attachShader(program, compile(gl.VERTEX_SHADER, VERT));
  gl.attachShader(program, compile(gl.FRAGMENT_SHADER, FRAG));
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    throw new Error(gl.getProgramInfoLog(program) || 'program failed to link');
  }
  gl.useProgram(program);

  // One triangle large enough to cover the clip volume — cheaper than a
  // quad and it never shows a diagonal seam.
  const buffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);

  const location = gl.getAttribLocation(program, 'a_position');
  gl.enableVertexAttribArray(location);
  gl.vertexAttribPointer(location, 2, gl.FLOAT, false, 0, 0);

  uResolution = gl.getUniformLocation(program, 'u_resolution');
  uTime = gl.getUniformLocation(program, 'u_time');
}

function resize() {
  // A full-bleed shader at 3× on a phone is a lot of fragments.
  const dpr = Math.min(devicePixelRatio || 1, 1.5);
  const nw = Math.max(1, Math.round(innerWidth * dpr));
  const nh = Math.max(1, Math.round(innerHeight * dpr));
  if (nw === w && nh === h) return;
  w = nw; h = nh;
  canvas.width = w;
  canvas.height = h;
  gl.viewport(0, 0, w, h);
  gl.uniform2f(uResolution, w, h);
}

function draw(seconds) {
  resize();
  gl.uniform1f(uTime, seconds);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

function step(ms) {
  if (!running) return;
  frame = requestAnimationFrame(step);
  if (!started) started = ms;
  draw((ms - started) / 1000);
}

function start() {
  if (running || reduced || !gl) return;
  running = true;
  frame = requestAnimationFrame(step);
}

function stop() {
  running = false;
  cancelAnimationFrame(frame);
}

// No point running a GPU loop for a tab nobody is looking at.
document.addEventListener('visibilitychange', () => {
  if (document.hidden) stop(); else start();
});

addEventListener('resize', () => { if (gl && !running) draw(0); }, { passive: true });

if (gl) {
  try {
    setup();
    if (reduced) draw(0); else start();
    glState.textContent = gl instanceof WebGL2RenderingContext ? 'webgl2' : 'webgl';
  } catch (err) {
    gl = null;
    document.body.dataset.nogl = 'true';
    glState.textContent = 'shader failed';
    console.error(err);
  }
} else {
  document.body.dataset.nogl = 'true';
  glState.textContent = 'no webgl';
}

/* ═══ the harness ═══════════════════════════════════════════════════
   Everything below fakes the events the real app would send, so the
   motion and the material can be judged without a backend.
   ═══════════════════════════════════════════════════════════════════ */

const thread = document.getElementById('thread');
const railState = document.getElementById('railState');
const empty = document.getElementById('empty');

const SCRIPT = [
  {
    ask: 'Put a timer on the stage for 24 minutes.',
    reply: 'Opening the timer. Twenty-four minutes, counting down on the stage — ' +
           'I will not interrupt you before it runs out.',
  },
  {
    ask: 'What is the core actually drawing?',
    reply: 'One fragment shader. Each pixel becomes polar coordinates, samples ' +
           'ridged simplex noise on the angle and the radius, and returns a single ' +
           'luminance. The pupil is a void the shader returns early from.',
  },
  {
    ask: 'Give me a checklist for the redesign.',
    reply: 'Four items on the stage. Tick them as they land — it survives a reload, ' +
           'which the thread deliberately does not.',
  },
];
let scriptIndex = 0;
let streaming = false;

function addTurn(who, text) {
  if (empty && empty.isConnected) empty.remove();

  const turn = document.createElement('div');
  turn.className = `turn turn--${who}`;

  const label = document.createElement('div');
  label.className = 'turn__who';
  label.textContent = who === 'user' ? 'YOU' : 'AGASA';
  turn.appendChild(label);

  const body = document.createElement('div');
  body.className = 'turn__body';
  body.textContent = text;
  turn.appendChild(body);

  thread.appendChild(turn);
  thread.scrollTop = thread.scrollHeight;
  return body;
}

/** Reveal a reply a word at a time, with a caret, so the streaming
 *  state is something to look at rather than something to imagine. */
function streamReply(text) {
  const body = addTurn('agent', '');
  const caret = document.createElement('span');
  caret.className = 'caret';
  body.appendChild(caret);

  const words = text.split(' ');
  let i = 0;
  streaming = true;
  railState.textContent = 'streaming';
  setButtonsBusy(true);

  const tick = setInterval(() => {
    caret.remove();
    body.textContent += (i ? ' ' : '') + words[i];
    body.appendChild(caret);
    thread.scrollTop = thread.scrollHeight;
    i += 1;

    if (i >= words.length) {
      clearInterval(tick);
      caret.remove();
      streaming = false;
      railState.textContent = 'idle';
      setButtonsBusy(false);
    }
  }, 55);
}

function setButtonsBusy(busy) {
  btnStream.disabled = busy;
}

function simulate(prompt) {
  if (streaming) return;
  const entry = SCRIPT[scriptIndex % SCRIPT.length];
  scriptIndex += 1;
  addTurn('user', prompt || entry.ask);
  setTimeout(() => streamReply(entry.reply), 320);
}

function toggleWindow(win, button) {
  const open = win.classList.toggle('is-open');
  win.setAttribute('aria-hidden', String(!open));
  button.setAttribute('aria-pressed', String(open));
}

const btnStream = document.getElementById('btnStream');
const btnTimer = document.getElementById('btnTimer');
const btnChecklist = document.getElementById('btnChecklist');
const winTimer = document.getElementById('winTimer');
const winChecklist = document.getElementById('winChecklist');

btnStream.addEventListener('click', () => simulate());
btnTimer.addEventListener('click', () => toggleWindow(winTimer, btnTimer));
btnChecklist.addEventListener('click', () => toggleWindow(winChecklist, btnChecklist));

document.getElementById('btnClear').addEventListener('click', () => {
  thread.replaceChildren();
  const note = document.createElement('p');
  note.className = 'thread__empty';
  note.textContent = 'Thread cleared.';
  thread.appendChild(note);
  railState.textContent = 'idle';
});

const input = document.getElementById('input');

document.getElementById('composer').addEventListener('submit', (event) => {
  event.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  input.style.height = 'auto';
  simulate(text);
});

input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = `${input.scrollHeight}px`;
});

input.addEventListener('keydown', (event) => {
  if (event.key === 'Enter' && !event.shiftKey) {
    event.preventDefault();
    document.getElementById('composer').requestSubmit();
  }
});

/* ── mock module behaviour, so the windows are not just pictures ── */

const TOTAL = 24 * 60;
let remaining = TOTAL;

setInterval(() => {
  if (!winTimer.classList.contains('is-open') || document.hidden) return;
  remaining = remaining > 0 ? remaining - 1 : TOTAL;
  const m = String(Math.floor(remaining / 60)).padStart(2, '0');
  const s = String(remaining % 60).padStart(2, '0');
  document.getElementById('timerClock').textContent = `${m}:${s}`;
  document.getElementById('timerFill').style.width = `${(remaining / TOTAL) * 100}%`;
}, 1000);

const checkList = document.getElementById('checkList');
const checkCount = document.getElementById('checkCount');

checkList.addEventListener('click', (event) => {
  const item = event.target.closest('li');
  if (!item) return;
  item.dataset.done = item.dataset.done === 'true' ? 'false' : 'true';
  const done = checkList.querySelectorAll('[data-done="true"]').length;
  checkCount.textContent = `${done}/${checkList.children.length}`;
});
</script>
</body>
</html>
